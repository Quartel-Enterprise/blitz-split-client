# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
# Apple targets can't build or run tests on Linux/Windows (CI runners); skip them silently there.
kotlin.native.ignoreDisabledTargets=true

# Gradle
# A daemon left idle (a finished worktree, a session gone) gives its 8 GB back after 15 minutes, not 3 hours.
org.gradle.daemon.idletimeout=900000
# The macOS jobs of CI replace this line with a smaller heap (.github/actions/gradle/action.yml): a flag added
# here goes there too.
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
# A download that fails with a 429, a 5xx or a dropped connection is tried again, waiting twice as long each time:
# 6 tries from 2 seconds wait up to a minute in all, where Gradle's 3 from 1 second gave up after about 3 seconds.
# A repository that still fails is disabled for the rest of the build (docs/ci.md, "Downloads").
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true
