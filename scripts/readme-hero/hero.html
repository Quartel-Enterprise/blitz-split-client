<!doctype html>
<!--
  The README's opening image (scripts/readme-hero/generate.sh): the same group of the sample trip on the native UIs,
  each in its device. compose.mjs fills the {{…}} slots (the theme and the captures' file URLs), writes the page next to
  the captures and
  photographs it. Transparent around the devices, so it sits on GitHub's page in either theme.
-->
<html data-theme="{{theme}}">
<head>
<meta charset="utf-8">
<style>
  :root {
    --caption: #1f2328;
    --caption-dim: #59636e;
    --browser-bar: #e8eaed;
    --browser-tab: #ffffff;
    --browser-field: #ffffff;
    --browser-text: #3c4043;
    --browser-edge: rgba(0, 0, 0, 0.12);
    --status: #1d1b20;
  }
  :root[data-theme="dark"] {
    --caption: #f0f6fc;
    --caption-dim: #9198a1;
    --browser-bar: #1f1f1f;
    --browser-tab: #2b2b2b;
    --browser-field: #2b2b2b;
    --browser-text: #e3e3e3;
    --browser-edge: rgba(255, 255, 255, 0.10);
    --status: #e6e1e5;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 680px; background: transparent; overflow: hidden; }
  body { position: relative; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }

  .device { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .caption { text-align: center; line-height: 1.3; width: 100%; }
  .caption b { display: block; font-size: 15px; font-weight: 600; color: var(--caption); }
  .caption span { font-size: 13px; color: var(--caption-dim); }

  /* The Mac's window: the capture is the window alone, its corners already round and transparent */
  .mac { left: 486px; top: 10px; align-items: flex-start; }
  .mac .caption { text-align: left; width: 200px; }
  .mac img { width: 600px; display: block; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.35)) drop-shadow(0 0 1px rgba(0, 0, 0, 0.5)); }

  /* The browser: Chrome's bar drawn around the web app's page */
  .web { left: 700px; top: 186px; z-index: 1; }
  .browser {
    width: 570px; border-radius: 12px; overflow: hidden; background: var(--browser-bar);
    box-shadow: 0 22px 48px rgba(0, 0, 0, 0.38), 0 0 0 1px var(--browser-edge);
  }
  .browser-bar { padding: 8px 12px 10px; display: grid; grid-template-rows: 22px 22px; gap: 6px; }
  .browser-top { display: flex; align-items: center; gap: 14px; }
  .lights { display: flex; gap: 7px; }
  .lights i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }
  .tab {
    height: 22px; padding: 0 12px; border-radius: 8px 8px 0 0; background: var(--browser-tab);
    color: var(--browser-text); font-size: 11px; display: flex; align-items: center; gap: 6px; align-self: flex-end;
  }
  .tab img { width: 12px; height: 12px; border-radius: 3px; }
  .field {
    height: 22px; border-radius: 11px; background: var(--browser-field); color: var(--browser-text);
    font-size: 11px; display: flex; align-items: center; padding: 0 12px; margin: 0 40px;
  }
  .browser > img { width: 100%; display: block; }

  /* The phones: a plain bezel around each screen */
  .phone {
    position: relative; padding: 7px; background: #0b0b0c; border-radius: 40px;
    box-shadow: 0 0 0 1.5px #3a3a3e, 0 22px 44px rgba(0, 0, 0, 0.4);
  }
  .phone img { display: block; border-radius: 33px; }
  .iphone { left: 252px; top: 150px; width: 214px; }
  .iphone img { width: 200px; }
  .island { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 62px; height: 19px; border-radius: 10px; background: #000; }
  .android { left: 16px; top: 110px; width: 214px; }
  .android .phone { border-radius: 34px; }
  .android img { width: 200px; border-radius: 28px; }
  .punch { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 11px; height: 11px; border-radius: 50%; background: #000; }
  .android-status {
    position: absolute; top: 12px; left: 22px; right: 22px; height: 18px; display: flex; align-items: center;
    justify-content: space-between; font: 500 11px/1 Roboto, "Helvetica Neue", sans-serif; color: var(--status);
  }
  .android-status svg { width: 34px; height: 11px; }

  /* The watches: a case around each round or rounded screen, both dark only */
  .watch { z-index: 2; gap: 10px; }
  .watch .case {
    position: relative; background: #0b0b0c; box-shadow: 0 0 0 1.5px #3a3a3e, 0 16px 30px rgba(0, 0, 0, 0.45);
  }
  .watch .case img { display: block; }
  .watch .caption { white-space: nowrap; }
  /* Under the Mac's caption, left of the browser */
  .wear { left: 480px; top: 462px; width: 104px; }
  .wear .case { padding: 5px; border-radius: 50%; }
  .wear .case img { width: 94px; height: 94px; border-radius: 50%; }
  .applewatch { left: 590px; top: 462px; width: 104px; }
  .applewatch .case { padding: 5px; border-radius: 26px; }
  .applewatch .case img { width: 94px; border-radius: 21px; }
</style>
</head>
<body>
  <div class="device mac">
    <img id="mac" alt="" src="{{captures}}/mac-{{theme}}.png">
    <div class="caption"><b>Mac</b><span>SwiftUI · Liquid Glass</span></div>
  </div>

  <div class="device web">
    <div class="browser">
      <div class="browser-bar">
        <div class="browser-top">
          <div class="lights"><i></i><i></i><i></i></div>
          <div class="tab"><img id="favicon" alt="" src="{{favicon}}">Blitz Split</div>
        </div>
        <div class="field">web.blitzsplit.com</div>
      </div>
      <img id="web" alt="" src="{{captures}}/web-{{theme}}.png">
    </div>
    <div class="caption"><b>Web</b><span>React · shadcn/ui</span></div>
  </div>

  <div class="device iphone">
    <div class="phone"><img id="ios" alt="" src="{{captures}}/ios-{{theme}}.png"><div class="island"></div></div>
    <div class="caption"><b>iPhone and iPad</b><span>SwiftUI · Liquid Glass</span></div>
  </div>

  <div class="device android">
    <div class="phone">
      <img id="android" alt="" src="{{captures}}/android-{{theme}}.png">
      <div class="punch"></div>
      <div class="android-status">
        <span>9:41</span>
        <svg viewBox="0 0 34 11" fill="currentColor" aria-hidden="true">
          <path d="M0 10.5 L9 1.5 L9 10.5 Z"/>
          <path d="M12 4.5 Q17 0 22 4.5 L17 10.5 Z"/>
          <rect x="25" y="2" width="8" height="8.5" rx="1.2"/>
        </svg>
      </div>
    </div>
    <div class="caption"><b>Android</b><span>Jetpack Compose<br>Material 3 Expressive</span></div>
  </div>

  <div class="device watch wear">
    <div class="case"><img id="wear" alt="" src="{{captures}}/wear-dark.png"></div>
    <div class="caption"><b>Wear OS</b><span>Compose</span></div>
  </div>

  <div class="device watch applewatch">
    <div class="case"><img id="watch" alt="" src="{{captures}}/watch-dark.png"></div>
    <div class="caption"><b>Apple Watch</b><span>SwiftUI</span></div>
  </div>

</body>
</html>
