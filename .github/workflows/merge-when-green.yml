name: merge-when-green

# Squash merges a pull request labeled merge-when-green once every check on its head commit has
# passed, then removes the label. No check is required by the ruleset (every check workflow is path
# filtered, see docs/ci.md), so GitHub's own auto-merge would merge right away.
#
# It runs when the label is added (the checks may already be green) and whenever one of the pull
# request workflows completes (the last one to finish is the one that finds everything green). A
# failed check leaves the pull request open with the label on.
#
# A branch behind its base is brought up to date and checked again before it merges when one side adds a
# language and the other touches localized text, the pair that turned main red with #604 and #605 (see the
# "Bring the branch up to date with its base" step).
#
# A green pull request with an unresolved review conversation is not merged: the ruleset refuses it,
# so the label goes and a comment says why. Resolving a conversation starts no workflow, so adding
# the label again is what merges it then. The checks review-gate held for claude-review's threads
# (see review-gate.yml) don't count as failed: once every conversation is resolved, this workflow
# re-runs them and merges when they pass.
#
# Events get lost: a run that fails to start (startup_failure), or a workflow_run GitHub never
# sends. So a sweep also checks every labeled pull request, and workflow_dispatch runs that sweep
# by hand, for every labeled pull request or only the one given. GitHub's scheduler alone is not
# enough: it drops most scheduled runs of this repository (about one in 26 fired over a day), so the
# sweep also runs on every push to main (each merge), once per push. With no activity on main only the
# schedule or a manual dispatch recovers a lost event. A label this workflow removed for
# unresolved conversations still has to be added again.
on:
  pull_request:
    types:
      - labeled
  push:
    branches:
      - main
  schedule:
    # Off the hour, when GitHub's scheduled runs queue the longest.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pull-request:
        description: 'The number of the pull request to check. Empty checks every open one labeled merge-when-green.'
        required: false
        default: ''
  workflow_run:
    workflows:
      - build-and-test
      - apple
      - static-analysis
      - duplication
      - module-graph
      - release-notes
      - codeql
      - claude-review
      - claude-review-on-request
      - claude-review-refs
    types:
      - completed

permissions:
  contents: read

jobs:
  # The sweep lists the branches of the labeled pull requests, and the merge job below checks each
  # one, as it does the branch of a pull request event. Drafts and pull requests from forks are
  # left out here already, so they start no merge job on every sweep; the merge job skips them
  # too, as on the events. A workflow_run sweeps nothing: it checks its own branch.
  sweep:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - name: List the labeled pull requests
        id: list
        # pipefail, so a pull request number that doesn't exist fails here instead of passing an
        # empty list on.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull-request }}
        run: |
          # As in the merge job, the label is filtered here rather than with --label, which goes
          # through the search index and lags behind a label just added.
          fields=headRefName,labels,state,isDraft,isCrossRepository
          if [ -n "$PR_NUMBER" ]; then
            prs=$(gh pr view "$PR_NUMBER" --json "$fields" | jq -c '[.]')
          else
            prs=$(gh pr list --state open --limit 200 --json "$fields")
          fi
          branches=$(jq -c '[.[] | select(.state == "OPEN" and (.isDraft | not) and (.isCrossRepository | not)
            and any(.labels[]; .name == "merge-when-green")) | .headRefName] | unique' <<< "$prs")
          echo "Labeled pull request branches: $branches"
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  merge:
    needs: sweep
    # Pull requests from forks are left out: their author could push a commit after a maintainer
    # added the label, and this would merge it with the maintainer's token. A skipped sweep (the
    # label and pull request workflow_run events) doesn't skip this job; a failed one does.
    if: >-
      !cancelled() && (
      (github.event_name == 'pull_request' && github.event.label.name == 'merge-when-green' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')) ||
      (needs.sweep.result == 'success' && needs.sweep.outputs.branches != '' &&
      needs.sweep.outputs.branches != '[]'))
    # One branch on an event, every labeled one on a sweep. toJSON quotes the event's branch name.
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.sweep.outputs.branches || format('[{0}]', toJSON(github.event.pull_request.head.ref || github.event.workflow_run.head_branch))) }}
    runs-on: ubuntu-latest
    # The wait for the checks whose completion starts nothing takes up to 15 minutes of it, and
    # each of its rounds reads GitHub's API two or three times.
    timeout-minutes: 30
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    concurrency:
      group: merge-when-green-${{ matrix.branch }}
    steps:
      # Reads the pull request with MERGE_WHEN_GREEN_TOKEN too, so a missing or expired token fails
      # here, before anything else runs.
      - name: Check whether every check passed
        id: green
        env:
          GH_TOKEN: ${{ secrets.MERGE_WHEN_GREEN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ matrix.branch }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || 0 }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The MERGE_WHEN_GREEN_TOKEN secret is not set."
            exit 1
          fi

          # An empty --head filters nothing, and would judge any labeled pull request.
          if [ -z "$HEAD_BRANCH" ]; then
            echo "::error::No head branch to check."
            exit 1
          fi

          # No pull request workflow runs on every push here, so none can tell that the push's workflows have
          # registered their runs. A label added, or a sweep run, right after a push gives them time
          # to; a completed run of the head commit (workflow_run) means they already have.
          if [ "$GITHUB_EVENT_NAME" != workflow_run ]; then
            sleep 30
          fi

          # The label is filtered here rather than with --label, which goes through the search index:
          # it lags behind a label just added or removed, and behind a merge.
          if ! prs=$(gh pr list --state open --head "$HEAD_BRANCH" \
            --json number,headRefOid,isDraft,isCrossRepository,labels); then
            echo "::error::Reading the pull requests with the MERGE_WHEN_GREEN_TOKEN secret failed. If the token expired, create a new one and update the secret."
            exit 1
          fi

          # The pull request's current head is what gets judged, not the commit of the run that
          # started this one: claude-review's run ends on the opening commit after it pushed its fix
          # commit, and on a pull request whose changes run no check workflow (docs only) only
          # claude-review's own short run of the push completes on the fix commit, possibly before the
          # review's run ends. A draft can't be merged; marking it ready runs its
          # checks again. Two labeled pull requests can share a branch (one into two bases): one is
          # handled per run, and its merge or label change starts this workflow again for the other.
          match=$(jq -c '[.[] | select((.isCrossRepository | not) and (.isDraft | not)
            and any(.labels[]; .name == "merge-when-green"))] | first // empty' <<< "$prs")
          if [ -z "$match" ]; then
            echo "No open pull request of $HEAD_BRANCH is labeled merge-when-green and ready for review."
            exit 0
          fi
          pr=$(jq -r .number <<< "$match")
          head=$(jq -r .headRefOid <<< "$match")

          # Some checks turn green with nothing to start this workflow then. The check code scanning
          # adds (CodeQL) is no workflow run: it turns green a little after the codeql workflow's run
          # completes. The "Analyze" checks of GitHub's Code Quality are jobs of a run GitHub starts on
          # its own on every push (event "dynamic": its workflow is no file of the repository, and it
          # is named after the pull request), which no workflow_run announces; on a pull request whose
          # changes run no check workflow (docs only) they are the last to finish. So while the only
          # checks left are pending ones of those two kinds, the checks are read again:
          # - for 15 minutes while a dynamic run that is still going owns one of them: a Code Quality
          #   run takes a minute as a rule, and took 13 at its longest;
          # - for 2 minutes otherwise: a check no run owns, a dynamic run of the head commit with no
          #   check on it yet (its jobs may not have theirs), or a read GitHub's API failed.
          # Every 20 seconds for the first 2 minutes and every minute after that, so a long wait costs
          # few API calls.
          long_wait=900
          short_wait=120
          waited=0
          stalled=0
          unread_for=0
          pause() {
            local step=20
            if [ "$waited" -ge "$short_wait" ]; then step=60; fi
            sleep "$step"
            waited=$((waited + step))
            if [ "$1" = stalled ]; then stalled=$((stalled + step)); fi
            if [ "$1" = unread ]; then unread_for=$((unread_for + step)); else unread_for=0; fi
          }
          while :; do
            unread=false

            # A wait can be long, and the pull request may no longer be the one read before it: merged
            # or closed by someone, made a draft, its label taken off by whoever changed their mind, or
            # pushed to, in which case that commit's own runs decide. Read again on every round after
            # the first, so the wait ends as soon as that happens.
            if [ "$waited" -gt 0 ]; then
              if now=$(gh pr view "$pr" --json state,isDraft,labels,headRefOid \
                --jq '"\(.state) \(.isDraft) \(any(.labels[]; .name == "merge-when-green")) \(.headRefOid)"'); then
                if [ "$now" != "OPEN false true $head" ]; then
                  echo "#$pr changed during the wait (state, draft, labeled, head: $now): not merged by this run."
                  exit 0
                fi
              else
                unread=true
              fi
            fi

            # The head commit's runs GitHub started on its own that are still going: one whose jobs
            # have no check yet shows nowhere else. A read that fails is no answer, never "none".
            if ! going=$(GH_TOKEN="$GITHUB_TOKEN" gh api --method GET "repos/$GH_REPO/actions/runs" \
              -f head_sha="$head" -f event=dynamic -f per_page=100 \
              --jq '[.workflow_runs[] | select(.status != "completed") | (.id | tostring)]'); then
              unread=true
              going='[]'
            fi

            # gh exits with 8 while checks are pending and with 1 when one failed or none exists. Those
            # are answers here, not errors, so the JSON it prints is what gets inspected. A pull request
            # whose changes run no check workflow (docs only) has nothing to wait for. GITHUB_TOKEN reads
            # them, since it is granted checks: read and the personal token isn't. An error on the first
            # read fails the job, as it always did; one in the middle of a wait is read again, for 2
            # minutes, since giving up there would leave a green pull request with nothing to merge it.
            checks=$(GH_TOKEN="$GITHUB_TOKEN" gh pr checks "$pr" --json name,workflow,bucket,link 2> "$RUNNER_TEMP/checks.err") || true
            if ! jq -e 'type == "array"' <<< "$checks" > /dev/null 2>&1; then
              if ! grep -q 'no checks reported' "$RUNNER_TEMP/checks.err"; then
                cat "$RUNNER_TEMP/checks.err"
                if [ "$waited" -eq 0 ] || [ "$unread_for" -ge "$short_wait" ]; then
                  exit 1
                fi
                pause unread
                continue
              fi
              checks='[]'
            fi
            others=$(jq '[.[] | select(.workflow != "merge-when-green")]' <<< "$checks")

            # GitHub sometimes leaves a job's check in progress after its workflow run completed: the
            # job has no steps and never ends, so waiting on it would wait forever. A pending check
            # whose run completed takes the run's conclusion instead: a run succeeds only when every
            # job of it did. A run still going that GitHub started on its own joins the ones listed
            # above, which may have been read before it existed. One that can't be read may be either.
            unknown='[]'
            pending_runs=$(jq -r '.[] | select(.bucket == "pending") | .link // ""
              | capture("/actions/runs/(?<id>[0-9]+)/job/")? | .id' <<< "$others" | sort -u)
            for run_id in $pending_runs; do
              if ! run=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GH_REPO/actions/runs/$run_id" \
                --jq '"\(.status) \(.conclusion // "none") \(.event)"'); then
                unknown=$(jq -c --arg id "$run_id" '. + [$id]' <<< "$unknown")
                continue
              fi
              read -r status conclusion event <<< "$run"
              if [ "$status" != completed ]; then
                if [ "$event" = dynamic ]; then
                  going=$(jq -c --arg id "$run_id" '. + [$id] | unique' <<< "$going")
                fi
                continue
              fi
              case "$conclusion" in
                success) bucket=pass ;;
                skipped) bucket=skipping ;;
                cancelled) bucket=cancel ;;
                *) bucket=fail ;;
              esac
              echo "::warning::Run $run_id completed ($conclusion) with a check still in progress: counted as $bucket."
              others=$(jq --arg id "$run_id" --arg bucket "$bucket" 'map(if .bucket == "pending"
                and ((.link // "") | contains("/actions/runs/\($id)/job/")) then .bucket = $bucket else . end)' <<< "$others")
            done

            # A gate that held its workflow's checks for claude-review's open threads is the only
            # review-gate check that fails. Its run completes failed, which starts this workflow too.
            held=$(jq '[.[] | select((.name | startswith("review-gate")) and .bucket == "fail")] | length' <<< "$others")
            unfinished=$(jq -r '.[] | select(.bucket != "pass" and .bucket != "skipping")
              | select(((.name | startswith("review-gate")) and .bucket == "fail") | not)
              | "\(.name): \(.bucket)"' <<< "$others")

            # What each check left says: a failed one, or a pending one of a run of the repository's
            # own workflows, ends this run at once, since that run's completion starts another. The
            # others start nothing when they turn green: no run owns the check, a dynamic run does, or
            # its run couldn't be read.
            left=$(jq -c --argjson going "$going" --argjson unknown "$unknown" '[.[]
              | select(.bucket != "pass" and .bucket != "skipping")
              | select(((.name | startswith("review-gate")) and .bucket == "fail") | not)
              | (((.link // "") | capture("/actions/runs/(?<id>[0-9]+)").id) // null) as $run
              | if .bucket != "pending" then "blocking"
                elif $run == null then "unowned"
                elif any($going[]; . == $run) then "dynamic"
                elif any($unknown[]; . == $run) then "unowned"
                else "blocking" end]' <<< "$others")
            if jq -e 'any(.[]; . == "blocking")' <<< "$left" > /dev/null; then
              echo "#$pr is not green yet:"
              echo "$unfinished"
              exit 0
            fi

            if [ -n "$unfinished" ]; then
              limit=$short_wait
              if jq -e 'any(.[]; . == "dynamic")' <<< "$left" > /dev/null; then limit=$long_wait; fi
              if [ "$waited" -ge "$limit" ]; then
                echo "#$pr is not green yet, after $((waited / 60)) minutes of waiting:"
                echo "$unfinished"
                exit 0
              fi
              echo "Waiting for the checks whose completion starts no workflow:"
              echo "$unfinished"
              pause
              continue
            fi

            # Every check there is passed. Merging still takes this round's reads to have answered.
            if [ "$unread" = true ]; then
              if [ "$unread_for" -ge "$short_wait" ]; then
                echo "::warning::#$pr looks green, but GitHub's API failed to say whether it still is, or which runs are going: not merged by this run."
                exit 0
              fi
              echo "A read of GitHub's API failed: reading again."
              pause unread
              continue
            fi

            # A run GitHub started on its own may not have given its jobs their checks yet, so it gets
            # 2 minutes to. Past that it is a run with no check on the commit (a run stuck in progress,
            # or one that never checks anything), which holds no merge: it is named and left behind.
            if [ "$going" != '[]' ]; then
              if [ "$stalled" -lt "$short_wait" ]; then
                echo "Waiting for the checks of run(s) $going, which GitHub started on its own."
                pause stalled
                continue
              fi
              echo "::warning::Run(s) $going of #$pr, which GitHub started on its own, are still going with no check on the commit: not waited for."
            fi
            break
          done

          # A job waiting on another (the checks behind review-gate) has no check until it starts, so
          # while review-gate waits for the review, or right after it passes, every check can be green
          # while its workflow still has jobs to run. A run of the head commit counts as unfinished
          # until it completes; its completion starts this workflow again. So does a claude-review run
          # of an earlier commit: it ends on the opening commit after pushing its fix commit, and its
          # threads come last. Runs started by a label (claude-review-on-request, run-checks, this
          # one) don't count: their job is skipped for any other label, and a skipped run starts
          # nothing; a review on request shows as a pending check instead. The run that started this
          # one counts as complete whatever the listing says, which can lag behind the event.
          running=$(GH_TOKEN="$GITHUB_TOKEN" HEAD="$head" gh api --method GET "repos/$GH_REPO/actions/runs" \
            -f branch="$HEAD_BRANCH" -f event=pull_request -f per_page=100 \
            --jq '.workflow_runs[] | select(.status != "completed" and .id != (env.TRIGGER_RUN_ID | tonumber))
              | select(.path | test("^\\.github/workflows/(claude-review-on-request|run-checks|merge-when-green)\\.yml$") | not)
              | select(.head_sha == env.HEAD or .path == ".github/workflows/claude-review.yml")
              | "\(.name) (\(.head_sha[:7]))"')
          if [ -n "$running" ]; then
            echo "#$pr still has workflows running:"
            echo "$running"
            exit 0
          fi

          {
            echo "pr=$pr"
            echo "head=$head"
            echo "held=$held"
          } >> "$GITHUB_OUTPUT"

      # The ruleset requires every review conversation to be resolved, and has no bypass. Checking
      # first leaves a comment on the pull request instead of a failed merge nobody looks at.
      - id: threads
        if: steps.green.outputs.pr != ''
        uses: Quartel-Enterprise/claude-review/threads@1.5.0
        with:
          command: open-threads
          pull-request: ${{ steps.green.outputs.pr }}

      # Every step after the threads lookup checks that it ran: a skipped step's output is null, which
      # an expression takes for 0, so a bare count == '0' would hold on a pull request still running.
      - name: Remove the label for the unresolved conversations
        if: steps.threads.outcome == 'success' && steps.threads.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.green.outputs.pr }}
          HELD: ${{ steps.green.outputs.held }}
          UNRESOLVED: ${{ steps.threads.outputs.count }}
        run: |
          echo "#$PR_NUMBER is green but has $UNRESOLVED unresolved review conversation(s)."
          if [ "$HELD" -gt 0 ]; then
            body="The checks are held for the Claude review's threads, and $UNRESOLVED review"
            body+=" conversation(s) are still unresolved, so this was not merged. Fix each one, or reply"
            body+=" with why it stays as it is, resolve them, then add the \`merge-when-green\` label"
            body+=" again: the held checks run then, and this merges once they pass."
          else
            body="Every check passed, but $UNRESOLVED review conversation(s) are still unresolved, so this"
            body+=" was not merged. Fix each one, or reply with why it stays as it is, resolve them, then"
            body+=" add the \`merge-when-green\` label again."
          fi
          gh pr comment "$PR_NUMBER" --body "$body"
          gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/merge-when-green" > /dev/null

      # Every conversation is resolved now, so the gate lets the held checks through; their
      # completion starts this workflow again. They are re-run with MERGE_WHEN_GREEN_TOKEN: what
      # GITHUB_TOKEN does starts no other workflow, so its re-runs might never start this one.
      - id: rerun
        if: steps.threads.outcome == 'success' && steps.threads.outputs.count == '0' && steps.green.outputs.held != '0'
        uses: Quartel-Enterprise/claude-review/threads@1.5.0
        with:
          command: rerun-held
          sha: ${{ steps.green.outputs.head }}
          token: ${{ secrets.MERGE_WHEN_GREEN_TOKEN }}

      # A review-gate check failed without a failed hold step to re-run (the gate itself broke), so
      # nothing would ever merge the pull request: the label goes, with a comment saying why.
      - name: Report what was re-run
        if: steps.rerun.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.green.outputs.pr }}
          RERUN: ${{ steps.rerun.outputs.count }}
        run: |
          if [ "$RERUN" -gt 0 ]; then
            echo "Re-ran $RERUN run(s) of #$PR_NUMBER held for review conversations that are resolved now."
            exit 0
          fi
          echo "::warning::A review-gate check of #$PR_NUMBER failed, but no run was held for review threads."
          body="A \`review-gate\` check failed without holding the checks for review threads, so this"
          body+=" was not merged. Re-run the failed \`review-gate\` job, then add the"
          body+=" \`merge-when-green\` label again."
          gh pr comment "$PR_NUMBER" --body "$body"
          gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/merge-when-green" > /dev/null

      # Two pull requests can each be green alone and red together. When one adds a language while the
      # other adds or changes text, the new language lacks the other one's strings and release notes, and
      # neither branch ever ran the translation checks on both (#604 and #605 broke main that way). No
      # check is required by the ruleset, so GitHub doesn't hold back a branch behind main either. So a
      # branch behind its base is brought up to date first when one side adds a language (AppLanguage.kt,
      # or a new strings.xml or web dictionary) and the other touches localized text (strings.xml,
      # xcstrings, the web dictionaries, release notes, the store listing). The update merges the base into
      # the branch with MERGE_WHEN_GREEN_TOKEN, so the push runs the checks again; their completion starts
      # this workflow again, and the pull request merges once they pass on the updated branch. Any other
      # branch behind main merges as before: updating each one on every merge would run every check
      # again, the Mac's Apple builds included, for a conflict that doesn't happen there. A base that
      # gained 300 files or more (all GitHub's comparison lists) counts as touching both.
      - name: Bring the branch up to date with its base
        id: current
        if: steps.threads.outcome == 'success' && steps.threads.outputs.count == '0' && steps.green.outputs.held == '0'
        env:
          GH_TOKEN: ${{ secrets.MERGE_WHEN_GREEN_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.green.outputs.pr }}
          HEAD_SHA: ${{ steps.green.outputs.head }}
        shell: bash
        run: |
          set -o pipefail
          base=$(gh pr view "$PR_NUMBER" --json baseRefName --jq .baseRefName)

          # What the base gained since the branch left it: its commits (ahead_by of head...base) and the
          # files they changed, as "<status> <path>".
          gained=$(gh api "repos/$GH_REPO/compare/$HEAD_SHA...$base" \
            --jq '"\(.ahead_by) \(.files | length)", (.files[] | "\(.status) \(.filename)")')
          read -r behind gained_count <<< "$(head -n 1 <<< "$gained")"
          base_files=$(tail -n +2 <<< "$gained")
          if [ "$behind" -eq 0 ]; then
            echo "#$PR_NUMBER is up to date with $base."
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | "\(.status) \(.filename)"')

          text='^[a-z]+ ((.*/)?res/values[^/]*/strings\.xml|.*\.xcstrings|webApp/src/i18n/.*|release-notes/.*|store-listing/.*)$'
          language='^([a-z]+ (.*/)?AppLanguage\.kt|added (.*/)?res/values-[^/]+/strings\.xml|added webApp/src/i18n/[^/]+\.ts)$'
          has() { grep -Eq "$1" <<< "$2"; }
          if [ "$gained_count" -ge 300 ]; then
            base_files=$'modified AppLanguage.kt\nmodified Localizable.xcstrings'
          fi
          if ! { has "$language" "$pr_files" && has "$text" "$base_files"; } &&
            ! { has "$language" "$base_files" && has "$text" "$pr_files"; }; then
            echo "#$PR_NUMBER is $behind commit(s) behind $base, with no language added on one side and text changed on the other: merged as it is."
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "#$PR_NUMBER is $behind commit(s) behind $base, and one side adds a language the other's text has to be checked against: updating the branch."
          echo "current=false" >> "$GITHUB_OUTPUT"
          if answer="$(gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/update-branch" \
            -f expected_head_sha="$HEAD_SHA" 2>&1 > /dev/null)"; then
            echo "Updated: the checks of the new head decide, and their completion starts this workflow again."
            exit 0
          fi
          echo "$answer"
          reason="$(printf '%s\n' "$answer" | sed -n 's/^gh: //p' | head -n 1)"
          case "$reason" in
            # A push meanwhile: its checks decide.
            *'expected head sha'*)
              echo "#$PR_NUMBER got a push meanwhile: its checks decide."
              exit 0
              ;;
            # Not a refusal: no answer at all, or GitHub's own error. The label stays, and the next run tries again.
            '' | *'(HTTP 5'[0-9][0-9]')')
              echo "::warning::The update didn't go through (${reason:-no answer from GitHub}); the label stays for the next run."
              exit 1
              ;;
          esac
          # A conflict with the base, or a token GitHub won't let push to the branch, fails the same way on
          # every later run, so the label goes, with a comment saying why.
          body="Every check passed, but this branch is behind \`$base\`, and one side adds a language the other"
          body+=" side's text has to be checked against, so it has to be brought up to date and checked again"
          body+=" before it merges. GitHub refused to update it:"
          body+=$'\n\n> '"$reason"$'\n\n'
          body+="Merge \`$base\` into the branch (https://github.com/$GH_REPO/blob/main/docs/ci.md#merge-when-green),"
          body+=" then add the \`merge-when-green\` label again."
          gh pr comment "$PR_NUMBER" --body "$body"
          gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/merge-when-green" > /dev/null
          exit 1

      # A merge made with GITHUB_TOKEN triggers no other workflow, so the push to main would run none
      # of the checks of main. The merge is made with a token of its own instead: a fine-grained
      # personal access token restricted to this repository, with Actions, Contents, Pull requests and
      # Workflows set to Read and write. It merges as its owner, under the ruleset like any merge:
      # never with --admin. A refused merge (a conflict with main, a pull request that changes a
      # workflow merged by a token without Workflows) would fail the same way on every later run, so
      # the label goes, with a comment saying why. A push meanwhile is not a refusal: its checks
      # decide. The merge goes through the REST endpoint, whose answer names the reason: gh pr merge
      # only says "the base branch policy prohibits the merge".
      - name: Merge the pull request
        if: steps.current.outcome == 'success' && steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_WHEN_GREEN_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.green.outputs.pr }}
          HEAD_SHA: ${{ steps.green.outputs.head }}
        run: |
          # Only gh's first line is kept, "gh: <GitHub's message> (HTTP <status>)": the answer's JSON
          # goes, and so does a hint about scopes gh may add after it.
          if ! answer="$(gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash -f sha="$HEAD_SHA" 2>&1 > /dev/null)"; then
            echo "$answer"
            reason="$(printf '%s\n' "$answer" | sed -n 's/^gh: //p' | head -n 1)"
            # Not a refusal: no answer at all, GitHub's own error, or main moved under the merge (another
            # pull request merged first). The label stays, and the next run tries again.
            case "$reason" in
              '' | 'Base branch was modified'* | *'(HTTP 5'[0-9][0-9]')')
                echo "::warning::The merge didn't go through (${reason:-no answer from GitHub}); the label stays for the next run."
                exit 1
                ;;
            esac
            # Nor is a pull request someone merged or closed meanwhile, or one that got a push: its checks decide.
            if [ "$(gh pr view "$PR_NUMBER" --json state,headRefOid --jq '"\(.state) \(.headRefOid)"')" = "OPEN $HEAD_SHA" ]; then
              body="Every check passed and every conversation is resolved, but GitHub refused the merge:"
              body+=$'\n\n> '"$reason"$'\n\n'
              body+="Fix what it reports (https://github.com/$GH_REPO/blob/main/docs/ci.md#merge-when-green), then add the"
              body+=" \`merge-when-green\` label again."
              gh pr comment "$PR_NUMBER" --body "$body"
              gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/merge-when-green" > /dev/null
            fi
            exit 1
          fi

          # The label only means "merge this once it is green", so it goes once that is done.
          gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/merge-when-green" > /dev/null
