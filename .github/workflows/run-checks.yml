name: run-checks

# Re-runs the checks review-gate held on a pull request's head commit for claude-review's open
# threads (see review-gate.yml), once those threads are resolved. Resolving a thread starts no
# workflow, so adding the run-checks label is what starts them when the author resolved the threads
# without pushing. A push needs no label: it runs the checks on its own commit.
#
# With a thread still open, nothing is re-run, since the gate would only hold the checks again: a
# comment says so. The label goes either way, so it can be added again.
on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read

jobs:
  rerun:
    if: github.event.label.name == 'run-checks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci

      - id: threads
        uses: Quartel-Enterprise/claude-review/threads@1.5.0
        with:
          command: open-threads
          pull-request: ${{ github.event.pull_request.number }}
          claude-only: 'true'

      - name: Say why nothing was re-run
        if: steps.threads.outcome == 'success' && steps.threads.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPEN: ${{ steps.threads.outputs.count }}
        run: scripts/ci/run-checks-say-why-nothing-was-re-run.sh

      - id: rerun
        if: steps.threads.outcome == 'success' && steps.threads.outputs.count == '0'
        uses: Quartel-Enterprise/claude-review/threads@1.5.0
        with:
          command: rerun-held
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Report the re-run
        if: steps.rerun.outcome == 'success'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RERUN: ${{ steps.rerun.outputs.count }}
        run: scripts/ci/run-checks-report-the-re-run.sh

      # The label goes either way, so it can be added again.
      - name: Remove the run-checks label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/run-checks" > /dev/null || true
