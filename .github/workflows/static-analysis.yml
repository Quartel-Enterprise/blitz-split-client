name: static-analysis

on:
  pull_request:
    # The defaults, plus a draft marked ready, which claude-review reviews then (see review-gate below).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '.github/workflows/static-analysis.yml'
      - 'scripts/ktlint.sh'
      - 'scripts/cpd.sh'
      - 'scripts/cpd-check.mjs'
      - '.jscpd.json'
      - '.jscpd-baseline.json'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.swift'
      - 'webApp/src/**'
      - '.editorconfig'
      - 'gradle/libs.versions.toml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/static-analysis.yml'
      - 'scripts/ktlint.sh'
      - 'scripts/cpd.sh'
      - 'scripts/cpd-check.mjs'
      - '.jscpd.json'
      - '.jscpd-baseline.json'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.swift'
      - 'webApp/src/**'
      - '.editorconfig'
      - 'gradle/libs.versions.toml'

permissions:
  contents: read

# Cancels in-progress runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Waits for the opening review on the commit a pull request opened with, or was marked ready for
  # review on, since that review may push a commit of its fixes, and on that fix commit; on all of
  # them, it holds the jobs below while a thread the review opened is unresolved. Every other event
  # skips it, and the jobs below run on a skipped gate too. See .github/workflows/review-gate.yml.
  review-gate:
    if: >-
      github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
      (github.event.action == 'synchronize' && github.event.sender.login == 'claude[bot]')
    uses: ./.github/workflows/review-gate.yml
    permissions:
      actions: read
      pull-requests: read

  ktlint:
    needs: review-gate
    if: ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The same script as locally, so CI runs the ruleset release the version catalog pins. The
      # runner has gpg, so the jar is checked against its release signature, never only its SHA-1.
      - name: Run ktlint
        env:
          KTLINT_REQUIRE_SIGNATURE: 'true'
        run: ./scripts/ktlint.sh

  duplication:
    needs: review-gate
    if: ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # npx keeps the jscpd it installs in the npm cache, so a run only downloads it again for another release.
      - name: Cache jscpd
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: jscpd-${{ hashFiles('scripts/cpd.sh') }}

      # The baseline of main, so a pull request that takes copied code in shows it as a warning.
      - name: Fetch the baseline of main
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:.jscpd-baseline.json > "$RUNNER_TEMP/jscpd-baseline-main.json" 2> /dev/null \
            || echo '{}' > "$RUNNER_TEMP/jscpd-baseline-main.json"

      # The same script as locally, with the jscpd release it pins.
      - name: Look for copied code
        run: ./scripts/cpd.sh --base "$RUNNER_TEMP/jscpd-baseline-main.json"
