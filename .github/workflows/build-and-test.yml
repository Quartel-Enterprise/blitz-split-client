name: build-and-test

# The shared Kotlin's unit tests and coverage, the same tests on the JS target, the Android app and
# its lint, and the web app. The Apple side runs in apple.yml, on a macOS runner.
#
# On a pull request, `changes` says which of these jobs the changed paths reach, and the others are skipped: a skipped
# job counts as passed for merge-when-green, and no check is required by the ruleset. On main every job runs.
#
# Every job has a timeout: a runner that hangs would otherwise hold the check for GitHub's default
# of six hours, and merge-when-green would wait on it all that time. The timeouts are about three
# times what each job takes on a pull request that recompiles everything.
on:
  pull_request:
    # The defaults, plus a draft marked ready, which claude-review reviews then (see review-gate below).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'iosApp/**'
      - 'release-notes/**'
      - 'store-listing/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'iosApp/**'
      - 'release-notes/**'
      - 'store-listing/**'

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one. On main every commit has a group
# of its own and always finishes: a cancelled run saves no Gradle cache, so main's entries would fall
# behind and the next pull requests would recompile from scratch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Waits for the opening review on the commit a pull request opened with, or was marked ready for
  # review on, since that review may push a commit of its fixes, and on that fix commit; on all of
  # them, it holds the jobs below while a thread the review opened is unresolved. Every other event
  # skips it, and the jobs below run on a skipped gate too. See .github/workflows/review-gate.yml.
  review-gate:
    if: >-
      github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
      (github.event.action == 'synchronize' && github.event.sender.login == 'claude[bot]')
    uses: ./.github/workflows/review-gate.yml
    permissions:
      actions: read
      pull-requests: read

  # Says which jobs below the change reaches, from the changed paths, as apple.yml's `changes` does for its own. Each
  # output is "false" when that job has nothing to check; a job runs unless its answer is exactly "false", so when this
  # job is skipped (on main), fails, or gives no answer, everything runs. On main every job runs anyway: only main's
  # runs save the Gradle cache the pull requests restore (.github/actions/gradle), and a job main skipped would leave
  # its entries behind. It doesn't wait for the review gate, since it checks nothing.
  #
  # Each changed file reaches some of the jobs:
  # - the build itself (build-logic, the root's Gradle scripts, gradle/, gradle.properties, version.properties, the
  #   wrapper, the Gradle action, this workflow and the review gate) reaches every job;
  # - a module of core/ and feature/ reaches every job by its commonMain and its build script; by commonTest only the
  #   tests (jvm and JS); by jvmMain or jvmTest only unit-tests; by jsMain the JS tests and the web; by jsTest the JS
  #   tests; by androidMain only the Android jobs; by an Apple source set none (apple.yml builds them). shared/ is the
  #   same but for the JS tests: it has no tests, and no tested module depends on it;
  # - android/store_screenshots reaches unit-tests, which compiles its sample states, and the Android jobs; the rest of
  #   android/, androidApp/ and wearApp/ the Android jobs; webApp/ the web job; scripts/modules-with-tests.sh the JS
  #   tests, whose shards it deals;
  # - what no build here reads reaches none: Markdown and docs, iosApp/, the release notes and store listings (left
  #   out of the paths that start this workflow too), the other workflows, the store and release scripts, the style and
  #   copied-code checks' scripts and config, and the translations' check of the Android strings, which has a job of its
  #   own (translations.yml) and is checked again here by lintDebug whenever a strings.xml changes.
  #
  # Any other path reaches every job: a file this list doesn't know runs everything, as before.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.diff.outputs.unit }}
      js: ${{ steps.diff.outputs.js }}
      android: ${{ steps.diff.outputs.android }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      # Two commits: GitHub's merge of the pull request with main and main itself, its first parent. Without their
      # files: the diff below compares names, which the commits' trees hold, so no file's content is downloaded and
      # only this workflow is written to disk.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github/workflows/build-and-test.yml
          sparse-checkout-cone-mode: false

      # --no-renames lists both paths of a moved file, and without core.quotePath a name with an accent would come
      # quoted and match nothing. A diff that fails or lists no file counts as a change to all of it.
      - name: Look at what the change reaches
        id: diff
        run: |
          set -euo pipefail
          unit=false js=false android=false web=false
          everything() { unit=true js=true android=true web=true; }
          build='^(build-logic/|gradle/|[^/]+\.gradle\.kts$|gradle\.properties$|version\.properties$|gradlew(\.bat)?$)'
          build="$build|^\.github/actions/gradle/|^\.github/workflows/(build-and-test|review-gate)\.yml$"
          none='\.md$|^docs/|^\.claude/|^iosApp/|^release-notes/|^store-listing/|^fastlane/|^\.github/'
          none="$none|^scripts/(release|store-screenshots|store-video|readme-hero)/|^scripts/(cpd|ktlint)\.sh$"
          none="$none|^scripts/heavy-check\.|^scripts/check-android-strings\.py$|^\.jscpd|^\.editorconfig$"
          if ! files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD) || [ -z "$files" ]; then
            everything
          else
            while IFS= read -r file; do
              if [[ $file =~ $build ]]; then
                everything
              elif [[ $file =~ $none ]]; then
                :
              elif [[ $file =~ ^(core|feature|shared)/ ]]; then
                # A flag only turns on: a later file never turns off what an earlier one reached.
                tested=true
                [[ $file == shared/* ]] && tested=false
                if [[ $file =~ /src/(apple|ios|macos|watchos|native)[A-Za-z0-9]*/ ]]; then
                  :
                elif [[ $file =~ /src/androidMain/ ]]; then
                  android=true
                elif [[ $file =~ /src/jvm(Main|Test)/ ]]; then
                  unit=true
                elif [[ $file =~ /src/jsMain/ ]]; then
                  web=true
                  [[ $tested == true ]] && js=true
                elif [[ $file =~ /src/jsTest/ ]]; then
                  js=true
                elif [[ $file =~ /src/commonTest/ ]]; then
                  unit=true js=true
                else
                  unit=true android=true web=true
                  [[ $tested == true ]] && js=true
                fi
              elif [[ $file =~ ^android/store_screenshots/ ]]; then
                unit=true android=true
              elif [[ $file =~ ^(android|androidApp|wearApp)/ ]]; then
                android=true
              elif [[ $file =~ ^webApp/ ]]; then
                web=true
              elif [[ $file == scripts/modules-with-tests.sh ]]; then
                js=true
              else
                echo "$file reaches every job."
                everything
              fi
            done <<< "$files"
          fi
          {
            echo "unit=$unit"
            echo "js=$js"
            echo "android=$android"
            echo "web=$web"
          } | tee -a "$GITHUB_OUTPUT"

  unit-tests:
    needs: [review-gate, changes]
    if: >-
      ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' &&
      needs.changes.outputs.unit != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # jvmTest runs the commonTest of every module on the jvm target; koverVerifyCi holds the merged
      # line coverage of core and feature at 80%. compileCommonMainKotlinMetadata compiles each module's
      # commonMain against what every target shares, which no target's own compile checks (sqlite's
      # blocking calls compile on each target but not there). The store screenshot generators only run
      # when asked for, so their sample states are compiled here to catch a UiState field they miss.
      - name: Run unit tests and verify coverage
        run: >-
          ./gradlew jvmTest :koverVerifyCi :koverHtmlReportCi compileCommonMainKotlinMetadata
          :android:store_screenshots:compileDebugUnitTestKotlin --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/

  # Every module's commonTest on the JS target, in a headless Chrome. The actuals of jsMain live in a
  # few modules with few tests of their own; the tests that exercise them are the other modules', so
  # every module's suite runs.
  #
  # Each module links its own test executable and runs it in its own Karma and Chrome, which is
  # most of the job's time, so the modules are split across the shards of the matrix. Each shard
  # compiles what its modules depend on again; that part runs in parallel and is the smaller one.
  # Adding a shard is adding a number to the list: the split reads the count from the matrix.
  js-tests:
    needs: [review-gate, changes]
    if: >-
      ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' &&
      needs.changes.outputs.js != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One shard's failure doesn't hide the other modules' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # A module has tests on the JS target when it has commonTest or jsTest sources, so a new module
      # joins a shard on its own. The modules are dealt round-robin from the sorted list, which puts
      # some core and some feature modules on every shard. apple-tests deals its own from the same
      # script.
      - name: Pick this shard's modules
        id: modules
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          modules=$(./scripts/modules-with-tests.sh commonTest jsTest)
          tasks=$(awk -v shard="$SHARD_INDEX" -v total="$SHARD_TOTAL" \
            '(NR - 1) % total == shard { gsub("/", ":"); printf ":%s:jsTest ", $0 }' <<< "$modules")
          if [ -z "$tasks" ]; then
            echo "::error::No module with tests falls on shard $((SHARD_INDEX + 1)) of $SHARD_TOTAL."
            exit 1
          fi
          echo "$tasks" | tr ' ' '\n'
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run the tests on the JS target
        env:
          TASKS: ${{ steps.modules.outputs.tasks }}
        run: |
          read -ra tasks <<< "$TASKS"
          ./gradlew "${tasks[@]}" --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: js-test-reports-${{ matrix.shard }}
          path: '**/build/reports/tests/**'

  # The release build and the lint compile different variants (release and debug), so they share
  # no compilation and run side by side: one job doing both ran them one after the other.
  android:
    needs: [review-gate, changes]
    if: >-
      ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' &&
      needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Release matters: it is the only variant where R8 runs, so a missing keep rule surfaces here
      # instead of on a device. Without the signing secrets it is signed with the debug key, which
      # is all a compile check needs. The phone's app and the watch's (:wearApp), which a release
      # ships together.
      - name: Assemble the Android release
        run: ./gradlew :androidApp:assembleRelease :wearApp:assembleRelease

  android-lint:
    needs: [review-gate, changes]
    if: >-
      ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' &&
      needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # lintDebug lints :androidApp, :wearApp and every :android:* module.
      - name: Lint the Android UI
        run: ./gradlew lintDebug --continue

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'

  web:
    needs: [review-gate, changes]
    if: >-
      ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' &&
      needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webApp/package-lock.json

      # webApp depends on the JS library of :shared through a file: dependency, so the library is
      # built before npm installs it.
      - name: Build the shared JS library
        run: npm --prefix webApp run shared

      - name: Install the web dependencies
        run: npm --prefix webApp ci

      # Every language holds English's messages, with its {placeholders}: tsc sees the keys, this the rest.
      - name: Check the translations
        run: npm --prefix webApp run check:messages

      # tsc type checks the app against the library's TypeScript definitions, then Vite bundles it.
      # Its prebuild builds the library again, up to date by now.
      - name: Build the web app
        run: npm --prefix webApp run build
