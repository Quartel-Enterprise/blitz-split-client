name: app-store-screenshots

# Sends App Store screenshots that were captured and framed on a Mac to App Store Connect, where only GitHub has the
# key (docs/store-listing-screenshots.md#sending-a-set-made-on-a-mac). By hand only, by an administrator of the
# repository, on main.
#
# The set travels as the assets of a draft GitHub release, which `node scripts/store-screenshots/local-set.mjs send`
# makes on the Mac: it checks the set, packs it and prints the command to run here.
#
#   gh workflow run app-store-screenshots.yml -f set=3.0.0                    # both versions, the editable ones
#   gh workflow run app-store-screenshots.yml -f set=3.0.0 -f ios=false       # the Mac's alone
#
# To repair shelves without sending a whole set again (docs/store-listing-screenshots.md#repairing-shelves):
#
#   gh workflow run app-store-screenshots.yml -f tidy_only=true               # sort and check, nothing is sent
#   gh workflow run app-store-screenshots.yml -f set=3.0.0 -f locales="en-US de-DE"   # those locales alone
#
#   1. `check` fetches the set, checks it again as the Mac did (a set that would empty a shelf is refused) and hands
#      it to the jobs after it as artifacts of the run.
#   2. `ios` and `macos` upload it one locale per job, one after the other, then tidy the shelves up: the jobs a
#      release runs for the screenshots it frames itself (app-store-screenshots-upload.yml). The two versions are
#      apart on App Store Connect, so they go side by side.
#   3. `finish` says in the run's summary which locales landed and whether the tidy-up left the shelves as staged,
#      and removes the draft release once both are so. A locale that failed keeps it, and is sent again with its
#      job's own re-run button; a shelf that isn't as staged keeps it, for its locale to be sent again from; so
#      does a version the set holds and the run left out, which is still to send, and a run that sent chosen
#      locales alone, which can't tell whether the others are up.
#
# The screenshots only, on the version that is open for editing: no build, no text, no submission for review. A
# stable release dispatched afterwards with `screenshots` off submits the version with them
# (docs/release-process.md#screenshots-made-on-a-mac).
#
# Not while a release is running: it writes on the same App Store version, and submits it. The `check` job refuses
# the run then, each upload job checks again (one run again later starts without `check`), and a stable release
# that submits refuses to start while a run of this is going (the `plan` job of release-production.yml).
#
# Repository secrets: the three APP_STORE_CONNECT_API_* ones, the releases' own (docs/release-process.md#secrets).
on:
  workflow_dispatch:
    inputs:
      set:
        description: "The set's name, as `local-set.mjs send` printed it. Blank with tidy_only"
        type: string
        default: ""
      ios:
        description: "App Store, iPhone and iPad"
        type: boolean
        default: true
      macos:
        description: "App Store, Mac"
        type: boolean
        default: true
      app_version:
        description: "The version to write on, X.Y.Z, created when it is missing. Blank writes on the editable one"
        type: string
        default: ""
      devices:
        description: "Send these shelves alone, with commas (iphone_duo,watch_ultra_3), as the set was sent: the others stay as they are. Blank sends every one"
        type: string
        default: ""
      allow_missing_devices:
        description: "The set leaves a device out on purpose, never the iPhone Duo: its shelf is emptied in every locale"
        type: boolean
        default: false
      locales:
        description: "Send these locales of the set alone, App Store codes with a space between (en-US de-DE). Blank sends every one"
        type: string
        default: ""
      tidy_only:
        description: "Send nothing and fetch no set: only tidy the shelves up and check that each holds every screen"
        type: boolean
        default: false

permissions:
  contents: read

# One at a time, and no concurrency group for it: GitHub keeps one run waiting per group and cancels it without a
# word when another arrives. `check` refuses the run instead while another run of this workflow is going, as it
# does during a release. Two dispatched in the same instant refuse each other.

# Named, so every step runs with pipefail: a `gh` that fails at the head of a pipe must stop the step.
defaults:
  run:
    shell: bash

env:
  # The draft release the set travels as, the tag local-set.mjs gives it (TAG_PREFIX). A draft has no tag in the
  # repository until it is published, which nothing here does.
  SET_TAG: store-screenshots-${{ inputs.set }}

jobs:
  # No environment here: this job reaches no store and reads no secret, and its own step checks the branch.
  check:
    name: Fetch and check the set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # A draft release shows only to a token that can write the repository's contents.
      contents: write
      # To see whether a release, or another run of this workflow, is going.
      actions: read
    outputs:
      ios_locales: ${{ steps.staged.outputs.ios_locales }}
      mac_locales: ${{ steps.staged.outputs.mac_locales }}
      ios_shelves: ${{ steps.set.outputs.ios_shelves }}
      mac_shelves: ${{ steps.set.outputs.mac_shelves }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The jobs that reach the store name the Production environment, whose branch rule keeps a copy of this
      # workflow on another branch from reaching it. GitHub makes a missing environment with no rule, so the ref is
      # checked here too.
      - name: Check where the run comes from
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::Screenshots are sent from main, and this run was dispatched on $REF. See docs/store-listing-screenshots.md."
            exit 1
          fi

      - name: Check who sends
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      # A run that would end green having sent nothing stops here instead.
      - name: Check the inputs
        env:
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          APP_VERSION: ${{ inputs.app_version }}
          LOCALES: ${{ inputs.locales }}
          DEVICES: ${{ inputs.devices }}
          TIDY_ONLY: ${{ inputs.tidy_only }}
        run: |
          if [ "$IOS" != true ] && [ "$MACOS" != true ]; then
            echo "::error::No platform is selected."
            exit 1
          fi
          # The tidy-up works on the version that is open for editing, and sends nothing: an input that names
          # something to send, or a version to write on, was meant for another run.
          if [ "$TIDY_ONLY" = true ]; then
            if [ -n "$SET$LOCALES$APP_VERSION$DEVICES" ]; then
              echo "::error::tidy_only sends nothing: leave set, locales, devices and app_version blank."
              exit 1
            fi
            exit 0
          fi
          # The name becomes the tag of the release that is read and then deleted: nothing but a set's name goes
          # through (SET_NAME of scripts/store-screenshots/local-set.mjs).
          if [[ ! "$SET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,59}$ ]]; then
            echo "::error::set is the name local-set.mjs printed: letters, digits, dots, dashes and underscores."
            exit 1
          fi
          # It reaches the lane's command line, where a space would split it: shelf names and commas alone.
          if [[ -n "$DEVICES" && ! "$DEVICES" =~ ^[a-z0-9_]+(,[a-z0-9_]+)*$ ]]; then
            echo "::error::devices is shelf names with commas and no spaces, as local-set.mjs printed: iphone_duo,watch_ultra_3."
            exit 1
          fi
          # It reaches a lane's environment, so nothing but a version goes through.
          if [[ -n "$APP_VERSION" && ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::app_version is a version as the App Store writes it, X.Y.Z, or blank."
            exit 1
          fi

      # A release writes on the same App Store version, and submits it: a version waiting for review takes no
      # screenshot, so the locales still to go would be left without theirs. Another run of this workflow would
      # replace the same shelves over this one.
      - name: Check that no release and no other set is going
        uses: ./.github/actions/no-run-going
        with:
          token: ${{ github.token }}
          workflows: release-beta.yml release-production.yml app-store-screenshots.yml
          then: send the screenshots once that run is over

      - name: Set up Node
        if: ${{ !inputs.tidy_only }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Only a draft is a set: a published release of that tag is somebody's, and is left alone. Each archive is one
      # version's staged folder, a folder per locale, with its checksum beside it.
      - name: Fetch the set
        if: ${{ !inputs.tidy_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
        run: |
          if ! release="$(gh release view "$SET_TAG" --json isDraft,assets)"; then
            echo "::error::No set named $SET: no draft release $SET_TAG. Send it from the Mac first, with node scripts/store-screenshots/local-set.mjs send."
            exit 1
          fi
          if [ "$(jq -r .isDraft <<< "$release")" != true ]; then
            echo "::error::$SET_TAG is a published release, not a set."
            exit 1
          fi
          set_dir="$RUNNER_TEMP/set"
          mkdir -p "$set_dir"
          fetch() {
            local archive="$1" folder="$2" input="$3"
            if ! jq -e --arg name "$archive" 'any(.assets[]; .name == $name)' <<< "$release" > /dev/null; then
              echo "::error::The set $SET has no $archive: it was sent without that platform. Dispatch with $input off."
              exit 1
            fi
            gh release download "$SET_TAG" --dir "$set_dir" --pattern "$archive"
            if ! grep -F "  $archive" "$set_dir/SHA256SUMS" > "$set_dir/$archive.sha256"; then
              echo "::error::The set's SHA256SUMS doesn't list $archive."
              exit 1
            fi
            (cd "$set_dir" && sha256sum --check "$archive.sha256")
            # Nothing but images in a locale's folder is written on the runner, which is all local-set.mjs packs:
            # no link, no folder of its own, no path that leaves the staged folder.
            odd="$(tar -tvf "$set_dir/$archive" | grep -v '^-' || true)"
            misplaced="$(tar -tf "$set_dir/$archive" | grep -vE '^[A-Za-z]+(-[A-Za-z]+)*/[A-Za-z0-9_]+\.png$' || true)"
            if [ -n "$odd" ] || [ -n "$misplaced" ]; then
              printf '%s\n' "$odd" "$misplaced"
              echo "::error::$archive holds something that isn't <locale>/<image>.png, so local-set.mjs didn't pack it. Nothing was extracted."
              exit 1
            fi
            mkdir -p "$folder"
            tar -xf "$set_dir/$archive" -C "$folder"
          }
          gh release download "$SET_TAG" --dir "$set_dir" --pattern SHA256SUMS
          if [ "$IOS" = true ]; then fetch ios.tar fastlane/screenshots ios; fi
          if [ "$MACOS" = true ]; then fetch mac.tar fastlane/screenshots-mac macos; fi

      # The Mac checked it before sending, and this is what decides: a locale of the listing missing, a device with a
      # screen missing, an image of another size, a file that isn't a PNG. deliver replaces every screenshot of a
      # locale with what it is handed, so a set without one of a version's devices would empty that shelf: refused,
      # unless allow_missing_devices says it is meant, and always for the iPhone Duo (REQUIRED_SHELVES). With devices,
      # only those shelves are checked, and only they are replaced.
      - name: Check the set
        if: ${{ !inputs.tidy_only }}
        id: set
        env:
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          ALLOW_MISSING_DEVICES: ${{ inputs.allow_missing_devices }}
          DEVICES: ${{ inputs.devices }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          options=()
          if [ -n "$DEVICES" ]; then options+=(--devices "$DEVICES" --no-left-out); fi
          if [ "$IOS" = true ]; then options+=(--ios fastlane/screenshots); fi
          if [ "$MACOS" = true ]; then options+=(--mac fastlane/screenshots-mac); fi
          if [ "$ALLOW_MISSING_DEVICES" = true ]; then options+=(--allow-missing-devices); fi
          said="$RUNNER_TEMP/check.txt"
          if ! node scripts/store-screenshots/local-set.mjs check "${options[@]}" > "$said" 2>&1; then
            cat "$said"
            {
              echo "## The set \`$SET\` was refused"
              echo
              echo '```'
              cat "$said"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The set $SET was refused: the run's summary says what is wrong with it. Nothing was sent."
            exit 1
          fi
          cat "$said"
          version="the editable version"
          if [ -n "$APP_VERSION" ]; then version="version $APP_VERSION"; fi
          {
            echo "## The set \`$SET\`"
            echo
            echo "Going on $version of each platform, one locale per job:"
            echo
            echo '```'
            cat "$said"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The upload jobs' matrices, read off what the set holds, as a release's are read off what it framed. Read
      # into variables first, so a script that fails stops the step. With `locales`, only those of each version's:
      # a locale the set lacks stops the run here, before anything is sent.
      - name: List the set's locales
        if: ${{ !inputs.tidy_only }}
        id: staged
        env:
          LOCALES: ${{ inputs.locales }}
        run: |
          ios_locales="$(./scripts/release/staged-screenshot-locales.sh fastlane/screenshots)"
          mac_locales="$(./scripts/release/staged-screenshot-locales.sh fastlane/screenshots-mac)"
          if [ -n "$LOCALES" ]; then
            if [ -n "$ios_locales" ]; then ios_locales="$(node scripts/store-screenshots/local-set.mjs locales --staged "$ios_locales" --only "$LOCALES")"; fi
            if [ -n "$mac_locales" ]; then mac_locales="$(node scripts/store-screenshots/local-set.mjs locales --staged "$mac_locales" --only "$LOCALES")"; fi
            echo "Only **$LOCALES** of the set go up: the other locales' shelves are left as they are." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "ios_locales=$ios_locales"
            echo "mac_locales=$mac_locales"
          } >> "$GITHUB_OUTPUT"

      # Under a release's own names, for the jobs both run. Not compressed: a PNG already is.
      - name: Hand the iPhone and iPad screenshots to the upload jobs
        if: ${{ inputs.ios && !inputs.tidy_only }}
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots-ios
          path: fastlane/screenshots/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      - name: Hand the Mac screenshots to the upload jobs
        if: ${{ inputs.macos && !inputs.tidy_only }}
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots-mac
          path: fastlane/screenshots-mac/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  # The names of these two are read by `finish`, off the run's jobs: "<name> / send <locale>".
  ios:
    name: iPhone and iPad
    needs: check
    if: ${{ inputs.ios }}
    permissions:
      contents: read
      # Each upload job looks for a release running, as `check` did: a job run again starts without `check`.
      actions: read
    uses: ./.github/workflows/app-store-screenshots-upload.yml
    with:
      platform: ios
      refuse_during_release: true
      # No locale's job with tidy_only. Its list is never read then, and still names one entry: an empty matrix
      # fails a job that runs, and nobody tried whether it fails one that is skipped.
      tidy_only: ${{ inputs.tidy_only }}
      locales: ${{ inputs.tidy_only && '["none"]' || needs.check.outputs.ios_locales }}
      artifact: app-store-screenshots-ios
      app_version: ${{ inputs.app_version }}
      devices: ${{ inputs.devices }}
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  macos:
    name: Mac
    needs: check
    if: ${{ inputs.macos }}
    permissions:
      contents: read
      # Each upload job looks for a release running, as `check` did: a job run again starts without `check`.
      actions: read
    uses: ./.github/workflows/app-store-screenshots-upload.yml
    with:
      platform: mac
      refuse_during_release: true
      # No locale's job with tidy_only. Its list is never read then, and still names one entry: an empty matrix
      # fails a job that runs, and nobody tried whether it fails one that is skipped.
      tidy_only: ${{ inputs.tidy_only }}
      locales: ${{ inputs.tidy_only && '["none"]' || needs.check.outputs.mac_locales }}
      artifact: app-store-screenshots-mac
      app_version: ${{ inputs.app_version }}
      devices: ${{ inputs.devices }}
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  # After the last locale of both, failed ones included. It reaches no store: it reads the run's own jobs and
  # deletes the draft release. A run that sent chosen locales alone, or none, removes nothing.
  finish:
    name: Report and remove the set
    needs: [check, ios, macos]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To delete the draft release.
      contents: write
      # To read which of the run's jobs passed.
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check who sends
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # A locale landed when its upload job passed, the latest try of it: a job run again counts as it ended then.
      - name: Say which locales landed
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          APP_VERSION: ${{ inputs.app_version }}
          IOS_LOCALES: ${{ needs.check.outputs.ios_locales }}
          MAC_LOCALES: ${{ needs.check.outputs.mac_locales }}
          IOS_SHELVES: ${{ needs.check.outputs.ios_shelves }}
          MAC_SHELVES: ${{ needs.check.outputs.mac_shelves }}
          LOCALES: ${{ inputs.locales }}
          TIDY_ONLY: ${{ inputs.tidy_only }}
        run: |
          jobs="$RUNNER_TEMP/jobs.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | {name, conclusion}' | jq -s . > "$jobs"
          options=(--jobs "$jobs")
          if [ "$TIDY_ONLY" = true ]; then
            # No locale was sent: the report is the tidy-up's alone.
            options+=(--tidy-only)
            IOS_LOCALES='[]'
            MAC_LOCALES='[]'
          else
            options+=(--set "$SET")
          fi
          if [ -n "$LOCALES" ]; then options+=(--only "$LOCALES"); fi
          if [ -n "$APP_VERSION" ]; then options+=(--version "$APP_VERSION"); fi
          if [ "$IOS" = true ]; then options+=(--ios-job "iPhone and iPad" --ios-locales "$IOS_LOCALES" --ios-shelves "$IOS_SHELVES"); fi
          if [ "$MACOS" = true ]; then options+=(--mac-job "Mac" --mac-locales "$MAC_LOCALES" --mac-shelves "$MAC_SHELVES"); fi
          node scripts/store-screenshots/local-set.mjs report "${options[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Only a draft, as when it was fetched. Gone already when a run of this job removed it and was run again. A set
      # that holds both versions' screenshots and went up one version per run loses, each time, the archive that
      # landed, and is removed with the last one. A release that can't be read is not one that is gone: the step
      # fails then, and is run again. Not while the tidy-up says a shelf isn't as staged: the set is what the
      # locale of that shelf is sent again from.
      - name: Remove the set
        if: ${{ steps.report.outputs.landed == 'true' && steps.report.outputs.tidied == 'true' && inputs.locales == '' && !inputs.tidy_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
        run: |
          errors="$RUNNER_TEMP/release-view-errors.txt"
          if ! release="$(gh release view "$SET_TAG" --json isDraft,assets 2> "$errors")"; then
            if ! grep -qi "release not found" "$errors"; then
              cat "$errors"
              echo "::error::Could not read the draft release $SET_TAG, so nothing says whether it is still there. Run this job again."
              exit 1
            fi
            echo "The draft release \`$SET_TAG\` is already gone." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$(jq -r .isDraft <<< "$release")" != true ]; then
            echo "::error::$SET_TAG is a published release, not a set: left alone."
            exit 1
          else
            sent=()
            if [ "$IOS" = true ]; then sent+=(ios.tar); fi
            if [ "$MACOS" = true ]; then sent+=(mac.tar); fi
            unsent="$(jq -r '[.assets[].name | select(endswith(".tar"))] - $ARGS.positional | join(" and ")' --args "${sent[@]}" <<< "$release")"
            if [ -z "$unsent" ]; then
              gh release delete "$SET_TAG" --yes
              echo "Every locale landed, so the set was removed: the draft release \`$SET_TAG\` is deleted." >> "$GITHUB_STEP_SUMMARY"
            else
              for archive in "${sent[@]}"; do
                if jq -e --arg name "$archive" 'any(.assets[]; .name == $name)' <<< "$release" > /dev/null; then
                  gh release delete-asset "$SET_TAG" "$archive" --yes
                fi
              done
              echo "Every locale landed, and what went up was removed from the set. **The draft release \`$SET_TAG\` was kept**: it still holds $unsent, the version this run left out. Dispatch again for that one alone, or drop it with \`gh release delete $SET_TAG --yes\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo
            echo "**Next:** look at the shelves in App Store Connect, then dispatch the stable release with \`screenshots\` off: it submits these versions with the screenshots they now have (docs/release-process.md#screenshots-made-on-a-mac)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Whenever it wasn't removed: a locale didn't land, a shelf isn't as staged, or the run sent chosen locales
      # alone, which say nothing of the others. The last is what was asked, so it is no warning.
      - name: Keep the set
        if: ${{ !inputs.tidy_only && (steps.report.outputs.landed != 'true' || steps.report.outputs.tidied != 'true' || inputs.locales != '') }}
        env:
          LANDED: ${{ steps.report.outputs.landed }}
          TIDIED: ${{ steps.report.outputs.tidied }}
          LOCALES: ${{ inputs.locales }}
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          drop="\`gh release delete $SET_TAG --repo $GITHUB_REPOSITORY --yes\`"
          # The repair's commands, for the versions this run wrote on: a set sent one version per run has lost the
          # other's archive, and a version this run named is the one to write on again.
          versions=""
          if [ "$IOS" != true ]; then versions+=" -f ios=false"; fi
          if [ "$MACOS" != true ]; then versions+=" -f macos=false"; fi
          again="gh workflow run app-store-screenshots.yml --repo $GITHUB_REPOSITORY -f set=$SET$versions"
          if [ -n "$APP_VERSION" ]; then again+=" -f app_version=$APP_VERSION"; fi
          tidy="gh workflow run app-store-screenshots.yml --repo $GITHUB_REPOSITORY -f tidy_only=true$versions"
          if [ "$LANDED" != true ]; then
            removal="and removes the set once every locale is up and the shelves are as staged"
            if [ -n "$LOCALES" ]; then removal="and keeps the set, as a run of chosen locales does"; fi
            echo "**The set was kept**, as the draft release \`$SET_TAG\`: a locale didn't land. Run its job again with the job's own re-run button; this job then runs again too, $removal. To drop it instead: $drop." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=The set was kept::A locale didn't land, so the draft release $SET_TAG is still there. The run's summary names the locale."
          elif [ "$TIDIED" != true ]; then
            echo "**The set was kept**, as the draft release \`$SET_TAG\`: every locale's job passed, and a shelf isn't as staged. The tidy-up job's summary names it. Send that shelf's locale again from this set, \`$again -f locales=\"<locale> <locale>\"\`, or, for a shelf that is only out of order, tidy up again with \`$tidy\` (docs/store-listing-screenshots.md#repairing-shelves). Don't delete one of a file's two entries by hand: both go. Once the shelves are right, drop the set: $drop." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=The set was kept::A shelf isn't as staged, so the draft release $SET_TAG is still there to send its locale again from. The tidy-up job's summary names the shelf."
          else
            echo "**The set was kept**, as the draft release \`$SET_TAG\`: this run sent chosen locales alone, and doesn't know whether the others are up. Once the shelves are right, drop it: $drop." >> "$GITHUB_STEP_SUMMARY"
          fi
