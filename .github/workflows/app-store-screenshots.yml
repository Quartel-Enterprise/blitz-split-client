name: app-store-screenshots

# Sends App Store screenshots that were captured and framed on a Mac to App Store Connect, where only GitHub has the
# key (docs/store-listing-screenshots.md#sending-a-set-made-on-a-mac). By hand only, by an administrator of the
# repository, on main.
#
# The set travels as the assets of a draft GitHub release, which `node scripts/store-screenshots/local-set.mjs send`
# makes on the Mac: it checks the set, packs it and prints the command to run here.
#
#   gh workflow run app-store-screenshots.yml -f set=3.0.0                    # both versions, the editable ones
#   gh workflow run app-store-screenshots.yml -f set=3.0.0 -f ios=false       # the Mac's alone
#
# To repair shelves without sending a whole set again (docs/store-listing-screenshots.md#repairing-shelves):
#
#   gh workflow run app-store-screenshots.yml -f tidy_only=true               # sort and check, nothing is sent
#   gh workflow run app-store-screenshots.yml -f set=3.0.0 -f locales="en-US de-DE"   # those locales alone
#
#   1. `check` fetches the set, checks it again as the Mac did (a set that would empty a shelf is refused) and hands
#      it to the jobs after it as artifacts of the run.
#   2. `ios` and `macos` upload it one locale per job, one after the other, then tidy the shelves up: the jobs a
#      release runs for the screenshots it frames itself (app-store-screenshots-upload.yml). The two versions are
#      apart on App Store Connect, so they go side by side.
#   3. `finish` says in the run's summary which locales landed and whether the tidy-up left the shelves as staged,
#      and removes the draft release once both are so. A locale that failed keeps it, and is sent again with its
#      job's own re-run button; a shelf that isn't as staged keeps it, for its locale to be sent again from; so
#      does a version the set holds and the run left out, which is still to send, and a run that sent chosen
#      locales alone, which can't tell whether the others are up.
#
# The screenshots only, on the version that is open for editing: no build, no text, no submission for review. A
# stable release dispatched afterwards with `screenshots` off submits the version with them
# (docs/release-process.md#screenshots-made-on-a-mac).
#
# Not while a release is running: it writes on the same App Store version, and submits it. The `check` job refuses
# the run then, each upload job checks again (one run again later starts without `check`), and a stable release
# that submits refuses to start while a run of this is going (the `plan` job of release-production.yml).
#
# Repository secrets: the three APP_STORE_CONNECT_API_* ones, the releases' own (docs/release-process.md#secrets).
on:
  workflow_dispatch:
    inputs:
      set:
        description: "The set's name, as `local-set.mjs send` printed it. Blank with tidy_only"
        type: string
        default: ""
      ios:
        description: "App Store, iPhone and iPad"
        type: boolean
        default: true
      macos:
        description: "App Store, Mac"
        type: boolean
        default: true
      app_version:
        description: "The version to write on, X.Y.Z, created when it is missing. Blank writes on the editable one"
        type: string
        default: ""
      devices:
        description: "Send these shelves alone, with commas (iphone_duo,watch_ultra_3), as the set was sent: the others stay as they are. Blank sends every one"
        type: string
        default: ""
      allow_missing_devices:
        description: "The set leaves a device out on purpose, never the iPhone Duo: its shelf is emptied in every locale"
        type: boolean
        default: false
      locales:
        description: "Send these locales of the set alone, App Store codes with a space between (en-US de-DE). Blank sends every one"
        type: string
        default: ""
      tidy_only:
        description: "Send nothing and fetch no set: only tidy the shelves up and check that each holds every screen"
        type: boolean
        default: false

permissions:
  contents: read

# One at a time, and no concurrency group for it: GitHub keeps one run waiting per group and cancels it without a
# word when another arrives. `check` refuses the run instead while another run of this workflow is going, as it
# does during a release. Two dispatched in the same instant refuse each other.

# Named, so every step runs with pipefail: a `gh` that fails at the head of a pipe must stop the step.
defaults:
  run:
    shell: bash

env:
  # The draft release the set travels as, the tag local-set.mjs gives it (TAG_PREFIX). A draft has no tag in the
  # repository until it is published, which nothing here does.
  SET_TAG: store-screenshots-${{ inputs.set }}

jobs:
  # No environment here: this job reaches no store and reads no secret, and its own step checks the branch.
  check:
    name: Fetch and check the set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # A draft release shows only to a token that can write the repository's contents.
      contents: write
      # To see whether a release, or another run of this workflow, is going.
      actions: read
    outputs:
      ios_locales: ${{ steps.staged.outputs.ios_locales }}
      mac_locales: ${{ steps.staged.outputs.mac_locales }}
      ios_shelves: ${{ steps.set.outputs.ios_shelves }}
      mac_shelves: ${{ steps.set.outputs.mac_shelves }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The jobs that reach the store name the Production environment, whose branch rule keeps a copy of this
      # workflow on another branch from reaching it. GitHub makes a missing environment with no rule, so the ref is
      # checked here too.
      - name: Check where the run comes from
        env:
          REF: ${{ github.ref }}
        run: scripts/ci/check-where-the-run-comes-from.sh

      - name: Check who sends
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      # A run that would end green having sent nothing stops here instead.
      - name: Check the inputs
        env:
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          APP_VERSION: ${{ inputs.app_version }}
          LOCALES: ${{ inputs.locales }}
          DEVICES: ${{ inputs.devices }}
          TIDY_ONLY: ${{ inputs.tidy_only }}
        run: scripts/ci/app-store-screenshots-check-the-inputs.sh

      # A release writes on the same App Store version, and submits it: a version waiting for review takes no
      # screenshot, so the locales still to go would be left without theirs. Another run of this workflow would
      # replace the same shelves over this one.
      - name: Check that no release and no other set is going
        uses: ./.github/actions/no-run-going
        with:
          token: ${{ github.token }}
          workflows: release-beta.yml release-production.yml app-store-screenshots.yml
          then: send the screenshots once that run is over

      - name: Set up Node
        if: ${{ !inputs.tidy_only }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Only a draft is a set: a published release of that tag is somebody's, and is left alone. Each archive is one
      # version's staged folder, a folder per locale, with its checksum beside it.
      - name: Fetch the set
        if: ${{ !inputs.tidy_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          DEVICES: ${{ inputs.devices }}
        run: scripts/ci/app-store-screenshots-fetch-the-set.sh

      # The Mac checked it before sending, and this is what decides: a locale of the listing missing, a device with a
      # screen missing, an image of another size, a file that isn't a PNG. deliver replaces every screenshot of a
      # locale with what it is handed, so a set without one of a version's devices would empty that shelf: refused,
      # unless allow_missing_devices says it is meant, and always for the iPhone Duo (REQUIRED_SHELVES). With devices,
      # only those shelves are checked, and only they are replaced.
      - name: Check the set
        if: ${{ !inputs.tidy_only }}
        id: set
        env:
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          ALLOW_MISSING_DEVICES: ${{ inputs.allow_missing_devices }}
          DEVICES: ${{ inputs.devices }}
          APP_VERSION: ${{ inputs.app_version }}
        run: scripts/ci/app-store-screenshots-check-the-set.sh

      # The upload jobs' matrices, read off what the set holds, as a release's are read off what it framed. Read
      # into variables first, so a script that fails stops the step. With `locales`, only those of each version's:
      # a locale the set lacks stops the run here, before anything is sent.
      - name: List the set's locales
        if: ${{ !inputs.tidy_only }}
        id: staged
        env:
          LOCALES: ${{ inputs.locales }}
        run: scripts/ci/app-store-screenshots-list-the-sets-locales.sh

      # Under a release's own names, for the jobs both run. Not compressed: a PNG already is.
      - name: Hand the iPhone and iPad screenshots to the upload jobs
        if: ${{ inputs.ios && !inputs.tidy_only }}
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots-ios
          path: fastlane/screenshots/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      - name: Hand the Mac screenshots to the upload jobs
        if: ${{ inputs.macos && !inputs.tidy_only }}
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots-mac
          path: fastlane/screenshots-mac/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  # The names of these two are read by `finish`, off the run's jobs: "<name> / send <locale>".
  ios:
    name: iPhone and iPad
    needs: check
    if: ${{ inputs.ios }}
    permissions:
      contents: read
      # Each upload job looks for a release running, as `check` did: a job run again starts without `check`.
      actions: read
    uses: ./.github/workflows/app-store-screenshots-upload.yml
    with:
      platform: ios
      refuse_during_release: true
      # No locale's job with tidy_only. Its list is never read then, and still names one entry: an empty matrix
      # fails a job that runs, and nobody tried whether it fails one that is skipped.
      tidy_only: ${{ inputs.tidy_only }}
      locales: ${{ inputs.tidy_only && '["none"]' || needs.check.outputs.ios_locales }}
      artifact: app-store-screenshots-ios
      app_version: ${{ inputs.app_version }}
      devices: ${{ inputs.devices }}
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  macos:
    name: Mac
    needs: check
    if: ${{ inputs.macos }}
    permissions:
      contents: read
      # Each upload job looks for a release running, as `check` did: a job run again starts without `check`.
      actions: read
    uses: ./.github/workflows/app-store-screenshots-upload.yml
    with:
      platform: mac
      refuse_during_release: true
      # No locale's job with tidy_only. Its list is never read then, and still names one entry: an empty matrix
      # fails a job that runs, and nobody tried whether it fails one that is skipped.
      tidy_only: ${{ inputs.tidy_only }}
      locales: ${{ inputs.tidy_only && '["none"]' || needs.check.outputs.mac_locales }}
      artifact: app-store-screenshots-mac
      app_version: ${{ inputs.app_version }}
      devices: ${{ inputs.devices }}
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  # After the last locale of both, failed ones included. It reaches no store: it reads the run's own jobs and
  # deletes the draft release. A run that sent chosen locales alone, or none, removes nothing.
  finish:
    name: Report and remove the set
    needs: [check, ios, macos]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To delete the draft release.
      contents: write
      # To read which of the run's jobs passed.
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check who sends
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # A locale landed when its upload job passed, the latest try of it: a job run again counts as it ended then.
      - name: Say which locales landed
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          APP_VERSION: ${{ inputs.app_version }}
          IOS_LOCALES: ${{ needs.check.outputs.ios_locales }}
          MAC_LOCALES: ${{ needs.check.outputs.mac_locales }}
          IOS_SHELVES: ${{ needs.check.outputs.ios_shelves }}
          MAC_SHELVES: ${{ needs.check.outputs.mac_shelves }}
          LOCALES: ${{ inputs.locales }}
          TIDY_ONLY: ${{ inputs.tidy_only }}
        run: scripts/ci/app-store-screenshots-say-which-locales-landed.sh

      # Only a draft, as when it was fetched. Gone already when a run of this job removed it and was run again. A set
      # that holds both versions' screenshots and went up one version per run loses, each time, the archive that
      # landed, and is removed with the last one. A release that can't be read is not one that is gone: the step
      # fails then, and is run again. Not while the tidy-up says a shelf isn't as staged: the set is what the
      # locale of that shelf is sent again from.
      - name: Remove the set
        if: ${{ steps.report.outputs.landed == 'true' && steps.report.outputs.tidied == 'true' && inputs.locales == '' && !inputs.tidy_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
        run: scripts/ci/app-store-screenshots-remove-the-set.sh

      # Whenever it wasn't removed: a locale didn't land, a shelf isn't as staged, or the run sent chosen locales
      # alone, which say nothing of the others. The last is what was asked, so it is no warning.
      - name: Keep the set
        if: ${{ !inputs.tidy_only && (steps.report.outputs.landed != 'true' || steps.report.outputs.tidied != 'true' || inputs.locales != '') }}
        env:
          LANDED: ${{ steps.report.outputs.landed }}
          TIDIED: ${{ steps.report.outputs.tidied }}
          LOCALES: ${{ inputs.locales }}
          SET: ${{ inputs.set }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          APP_VERSION: ${{ inputs.app_version }}
        run: scripts/ci/app-store-screenshots-keep-the-set.sh
