name: release-production

# Ships a stable version of Bora Rachar: Android to Google Play, iOS and macOS to the App Store, and the web app to
# https://web.blitzsplit.com.
#
# Run it with ./scripts/release/release-production.sh, or from the Actions tab
# (docs/release-process.md#releasing-a-stable-version):
#   1. `plan` checks who dispatched the run and from where, since nothing waits for an approval: only an
#      administrator of the repository releases, from main, and the `Production` environment has to limit its
#      deployments to main. It then resolves the version X.Y.Z from version.properties and the release notes'
#      fragments, picks the notes the version tells (docs/release-notes.md) and shows both, with what the run will
#      publish, in the run summary.
#   2. Each platform builds and publishes, in jobs of its own, because "Re-run failed jobs" repeats whole jobs: an
#      upload that failed is sent again without building a second time.
#        - Android: a signed AAB to the Google Play track of the `track` input, with the notes as its "What's new".
#          On the production track `rollout` is the percentage of the users who get it. The watch's AAB (:wearApp,
#          the phone's applicationId and versionCode + 1,000,000) then goes to the same track of Google Play's Wear
#          OS form factor (wear:production, wear:beta, wear:alpha, wear:internal), with the same notes and rollout.
#        - iOS and macOS: App Store Connect, signed as the betas are (the composite actions apple-build and
#          apple-upload). With `submit_for_review`, the build is then sent to App Store review with the notes, and
#          goes out by itself once approved.
#        - Web: Cloudflare Pages, the project of CLOUDFLARE_PAGES_PROJECT, which web.blitzsplit.com serves. The
#          beta's build and deploy, at the stable version (the composite action web-deploy).
#        - With `screenshots`, the listings' screenshots are made again and uploaded, one job per language on
#          the App Store and a few languages per job on Google Play, so that what a store refused is all that is
#          sent again: Google Play's after the bundle reached production, so the bundle is never the upload its
#          daily save quota refuses, the App Store's before the submission, since a version in review can't take
#          them. Best effort: none of these jobs holds the release back. Off unless asked for: a release that
#          changes no screen and adds no language leaves the listings' images as they are. The App Store's are
#          captured on the iPhone and the iPad; `screenshots_iphone_duo` and `screenshots_mac` add the iPhone Duo
#          and the Mac, whose captures don't work on the runners yet
#          (docs/release-process.md#screenshots-with-a-release). Google Play's alone, with the App Store's left as
#          they are, go through play-store-screenshots.yml instead.
#   3. `finalize` runs when a store took a build or the web was deployed. When the run released (the production
#      track, a submission for review, or the web) it tags X.Y.Z and publishes the GitHub release, then merges the
#      versionCode, the versionName and the removal of the fragments the version told back into main. A run that
#      only reached a testing track or TestFlight leaves no tag and removes no fragment: it merges back its
#      versionCode, and its version when that is higher than main's. A run of the web alone, with every store
#      platform off, leaves the versionCode on main alone and records no build number, since it consumed none a
#      store cares about.
#   4. `site-release-notes` sends the notes of a version that was released to blitz-split-site, whose "What's new"
#      page and feed the apps read. It doesn't wait for the stores' reviews.
#
# With no input changed, the run publishes to everyone: the production track at 100%, a submission for review and
# the web.
# The dispatch is the one gate, as in Bible Planner's releases: the jobs that reach a store or the web name the
# `Production` environment, which no reviewer guards and whose branch policy only lets main deploy.
#
# One release at a time, betas included: the concurrency group is release-beta.yml's, since both take the next
# versionCode from the same place.
#
# Repository secrets and variables: see docs/release-process.md#secrets.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z: leave blank to use the one version.properties and the release notes give"
        type: string
        required: false
      android:
        description: "Android, Google Play"
        type: boolean
        default: true
      ios:
        description: "iOS, App Store"
        type: boolean
        default: true
      macos:
        description: "macOS, App Store"
        type: boolean
        default: true
      web:
        description: "Web, web.blitzsplit.com"
        type: boolean
        default: true
      track:
        description: "Google Play track"
        type: choice
        options:
          - production
          - beta
          - alpha
          - internal
        default: production
      rollout:
        description: "Google Play, production track: the percentage of the users who get it, 1 to 100"
        type: string
        default: '100'
      submit_for_review:
        description: "Submit the iOS and macOS builds for App Store review (unchecked: TestFlight only)"
        type: boolean
        default: true
      phased_release:
        description: "App Store: release an approved update over seven days, not to everyone at once"
        type: boolean
        default: false
      screenshots:
        description: "Make the store listings' screenshots again and upload them (a new language, a screen that changed)"
        type: boolean
        default: false
      screenshots_iphone_duo:
        description: "With screenshots: capture the iPhone Duo too, closed and open (fails on the runners today)"
        type: boolean
        default: false
      screenshots_mac:
        description: "With screenshots: capture the Mac too (fails on the runners today)"
        type: boolean
        default: false

# Least privilege by default: only finalize writes.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

# Named, so every step runs with pipefail: a `gh` that fails at the head of a pipe must stop the step, not hand an
# empty answer to what reads it.
defaults:
  run:
    shell: bash

env:
  # The GitHub Environment of the jobs that reach a store or the web (Settings > Environments): its deployment
  # branch policy only lets main deploy. Those jobs name it themselves, since `environment` can't read `env`.
  RELEASE_ENVIRONMENT: Production
  # Where a version's notes may already be written by hand (docs/release-notes.md): `plan` reads it.
  SITE_REPOSITORY: Quartel-Enterprise/blitz-split-site
  # The Cloudflare Pages project of the production web app, next to the betas' blitz-split-beta in the same
  # account, and the domain it is served at. Both were set up by hand, never by this workflow
  # (docs/release-process.md#the-production-web-app).
  CLOUDFLARE_PAGES_PROJECT: blitz-split
  WEB_URL: https://web.blitzsplit.com

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To read the environment's deployment branch policy, and whether a store's screenshots are going up.
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      branch: ${{ steps.resolve.outputs.branch }}
      sha: ${{ steps.sha.outputs.sha }}
      capture_slots: ${{ steps.slots.outputs.capture_slots }}
      has_notes: ${{ steps.notes.outputs.has_notes }}
      github_notes: ${{ steps.notes.outputs.github_notes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Every job builds this commit, so a push to main during the run doesn't end up half in the release.
      - name: Pin the commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Through env, not spliced into the commands: the values are checked, but only after the shell has parsed
      # the line.
      - name: Check the inputs
        env:
          ANDROID: ${{ inputs.android }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          WEB: ${{ inputs.web }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          if [ "$ANDROID" != true ] && [ "$IOS" != true ] && [ "$MACOS" != true ] && [ "$WEB" != true ]; then
            echo "::error::No platform is selected."
            exit 1
          fi
          if ! [[ "$ROLLOUT" =~ ^[0-9]+$ ]] || [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then
            echo "::error::rollout is the percentage of the users who get the release, from 1 to 100: '$ROLLOUT' is not."
            exit 1
          fi

      # Nothing waits for an approval, so the dispatch is the gate: only an administrator of the repository
      # releases, and only from main, whose copy of this workflow is the one that was reviewed. Nothing is built
      # yet, so a run that stops here only costs another dispatch. The jobs that reach a store or the web check the
      # admin again, since "Re-run failed jobs" runs them without this one.
      - name: Check where the release comes from
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::A stable version is released from main, and this run was dispatched on $REF. See docs/release-process.md#who-releases."
            exit 1
          fi

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      # The jobs that reach a store or the web name the environment, whose deployment branch policy is what keeps
      # a copy of this workflow on another branch from publishing through them. GitHub makes an environment a job
      # names and that doesn't exist, with no rule at all, so the release stops here when it is missing, lets any
      # branch deploy, or can't be read.
      - name: Check the environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What gh says on stderr is kept apart from its answer, which is read as JSON and as a name below.
          errors="$RUNNER_TEMP/environment-errors.txt"
          if ! environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/$RELEASE_ENVIRONMENT" 2> "$errors")"; then
            if grep -q "HTTP 404" "$errors"; then
              echo "::error::The $RELEASE_ENVIRONMENT environment doesn't exist: create it, with a deployment branch policy that only allows main. See docs/release-process.md#who-releases."
              exit 1
            fi
            cat "$errors"
            echo "::error::Could not read the $RELEASE_ENVIRONMENT environment, so nothing says which branches may deploy to it. Dispatch the release again."
            exit 1
          fi
          if [ "$(jq -r '.deployment_branch_policy.custom_branch_policies // false' <<< "$environment")" != true ]; then
            echo "::error::The $RELEASE_ENVIRONMENT environment doesn't limit its deployments to branches it names: any branch, or any protected one, could deploy. Set its deployment branches to 'Selected branches and tags', with main alone. See docs/release-process.md#who-releases."
            exit 1
          fi
          if ! allowed="$(gh api "repos/$GITHUB_REPOSITORY/environments/$RELEASE_ENVIRONMENT/deployment-branch-policies" --paginate --jq '.branch_policies[] | "\(.type):\(.name)"' 2> "$errors")"; then
            cat "$errors"
            echo "::error::Could not read the deployment branch policy of the $RELEASE_ENVIRONMENT environment. Dispatch the release again."
            exit 1
          fi
          # By type too: a tag named main is not the branch.
          if [ "$allowed" != branch:main ]; then
            echo "::error::The $RELEASE_ENVIRONMENT environment has to let the branch main deploy, and nothing else: its deployment policy allows '$(paste -sd, - <<< "$allowed")'. See docs/release-process.md#who-releases."
            exit 1
          fi

      # A run that submits sends the App Store versions to review, and a version waiting for review takes no
      # screenshot: started while a set made on a Mac is still going up, one locale per job
      # (app-store-screenshots.yml), it would leave the locales still to go without theirs. That workflow refuses to
      # start during a release; this is the other way round. Whatever the run submits or releases: that workflow's
      # upload jobs stop while any release is going, since they can't tell one that submits nothing apart, so a
      # release let through would fail every locale still to go.
      - name: Check that no App Store screenshots are going up
        uses: ./.github/actions/no-run-going
        with:
          token: ${{ github.token }}
          workflows: app-store-screenshots.yml
          then: dispatch the release once every locale of that run is up

      # The bundle goes to Google Play through an edit, as each locale of the listing's screenshots does when they
      # are sent alone (play-store-screenshots.yml), and the newer edit drops the one still open. That workflow
      # refuses to start during a release; this is the other way round. Whatever the run's platforms: that
      # workflow's upload jobs stop while any stable release is going, since they can't tell one without Android
      # apart, so a release let through would fail every locale still to go.
      - name: Check that no Google Play screenshots are going up
        uses: ./.github/actions/no-run-going
        with:
          token: ${{ github.token }}
          workflows: play-store-screenshots.yml
          then: dispatch the release once every locale of that run is up

      # The version and the notes both come from scripts/release/release-notes.mjs, plain Node.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Every release with its notes: the build numbers the earlier releases, betas too, recorded in them.
      - name: Read the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | {tag: .tag_name, body: .body, prerelease: .prerelease}' | jq -s . > "$RUNNER_TEMP/releases.json"

      - name: Resolve version
        id: resolve
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: ./scripts/release/suggest-version.sh --stable "$VERSION_INPUT"

      # The matrix of apple-screenshots-capture, whose job-level `if` can't read `matrix`: a device left out of the
      # list starts no runner, where a job that started only to stop would hold a Mac for it. Empty when the run
      # could upload none of them (the Mac alone, without its marker), which skips the job. Read into a variable
      # first, so a script that fails stops the step.
      - name: List the App Store capture slots
        id: slots
        env:
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          SCREENSHOTS_IPHONE_DUO: ${{ inputs.screenshots_iphone_duo }}
          SCREENSHOTS_MAC: ${{ inputs.screenshots_mac }}
        run: |
          capture_slots="$(./scripts/release/app-store-capture-slots.sh)"
          echo "capture_slots=$capture_slots" >> "$GITHUB_OUTPUT"

      - name: Say what the run publishes
        env:
          ANDROID: ${{ inputs.android }}
          IOS: ${{ inputs.ios }}
          MACOS: ${{ inputs.macos }}
          WEB: ${{ inputs.web }}
          TRACK: ${{ inputs.track }}
          ROLLOUT: ${{ inputs.rollout }}
          SUBMIT: ${{ inputs.submit_for_review }}
          PHASED: ${{ inputs.phased_release }}
          SCREENSHOTS: ${{ inputs.screenshots }}
          SCREENSHOTS_IPHONE_DUO: ${{ inputs.screenshots_iphone_duo }}
          SCREENSHOTS_MAC: ${{ inputs.screenshots_mac }}
        run: |
          android="not in this run"
          if [ "$ANDROID" = true ]; then
            android="Google Play, \`$TRACK\` track"
            if [ "$TRACK" = production ]; then
              android="$android, $ROLLOUT% of the users"
            fi
            android="$android; the watch to the same Wear OS track"
          fi
          app_store="TestFlight only"
          if [ "$SUBMIT" = true ]; then
            app_store="App Store review, then released once approved"
            if [ "$PHASED" = true ]; then
              app_store="$app_store, over seven days"
            fi
          fi
          ios="not in this run"
          macos="not in this run"
          if [ "$IOS" = true ]; then ios="$app_store"; fi
          if [ "$MACOS" = true ]; then macos="$app_store"; fi
          web="not in this run"
          if [ "$WEB" = true ]; then web="$WEB_URL, for everyone"; fi
          # The web has no testing channel: deployed, it is out for everyone and the version is released, whatever
          # the stores get. Said at once, while the web job still builds: a run meant to try the stores would
          # otherwise do more than its plan reads, and nothing waits for anyone to read it.
          trial=false
          if [ "$ANDROID" = true ] && [ "$TRACK" != production ]; then trial=true; fi
          if { [ "$IOS" = true ] || [ "$MACOS" = true ]; } && [ "$SUBMIT" != true ]; then trial=true; fi
          note=""
          if [ "$WEB" = true ] && [ "$trial" = true ]; then
            note="The stores only get a trial (a testing track, or TestFlight), but the web app is deployed for everyone: the version gets its tag and its notes are published. For a run that reaches no user, cancel this one now, before the web job deploys, and dispatch again with \`web\` off. What a store already took stays there, and the run still records it."
            echo "::warning title=The web is released::${note//\`/}"
          fi
          # The row about the screenshots, and a warning for each device marker that is on and adds no capture, from
          # a script with tests, which reads the list apple-screenshots-capture's matrix is made of. The warnings
          # come on stderr: kept apart from the row, then printed for the run's page.
          warnings="$RUNNER_TEMP/screenshots-warnings.txt"
          if ! screenshots="$(./scripts/release/app-store-screenshots-plan.sh 2> "$warnings")"; then
            cat "$warnings"
            exit 1
          fi
          cat "$warnings"
          {
            echo ""
            echo "| Platform | Where it goes |"
            echo "|---|---|"
            echo "| Android | $android |"
            echo "| iOS | $ios |"
            echo "| macOS | $macos |"
            echo "| Web | $web |"
            echo "| Store screenshots | $screenshots |"
            echo ""
            if [ -n "$note" ]; then
              echo "**$note**"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Read-only, and public: the default token is enough. A version the site already has, as one written there by
      # hand, is the text every store and the GitHub release get (docs/release-notes.md).
      - name: Checkout the site
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SITE_REPOSITORY }}
          path: site
          fetch-depth: 1
          persist-credentials: false

      # Picked here, once, for every job after it: a later job that picked them again could fail after the builds
      # went out. The stores' "What's new" by language go on as a build artifact, and `github_notes` is what the
      # GitHub release opens with.
      - name: Pick the release notes
        id: notes
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          node scripts/release/release-notes.mjs collect "$VERSION" --ref "$SHA" --site site \
            --out "$RUNNER_TEMP/release-notes"
          # A delimiter no note can hold, since the notes are text the pull requests wrote.
          delimiter="notes_$(openssl rand -hex 16)"
          {
            echo "github_notes<<${delimiter}"
            cat "$RUNNER_TEMP/release-notes/github.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/release-notes/github.md" ]; then
            cat "$RUNNER_TEMP/release-notes/github.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "### What's new on Google Play, in English"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/release-notes/stores/play/en.txt"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release notes as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------------------------
  android-build:
    name: Android, build the AABs
    needs: plan
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      # The phone's and the watch's, in one Gradle run: one version, one key, one applicationId.
      - name: Build the signed AABs
        uses: ./.github/actions/android-build
        with:
          task: ':androidApp:bundleRelease :wearApp:bundleRelease'
          version: ${{ needs.plan.outputs.version }}
          version-code: ${{ needs.plan.outputs.version_code }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          google-web-client-id: ${{ vars.SUPABASE_GOOGLE_WEB_CLIENT_ID }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Google Play takes a bundle only when it is signed with the app's upload key, so the run says which key this
      # one carries: its SHA-1 is the one to compare with Play Console > Test and release > App integrity > Upload
      # key certificate when the upload is refused. The digests come from the release keystore, and keytool confirms
      # the bundle carries that certificate by its SHA-256.
      - name: Show the signing certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          shopt -s nullglob
          aabs=()
          for app in androidApp wearApp; do
            found=("$app"/build/outputs/bundle/release/*.aab)
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::Expected one release AAB of $app, found ${#found[@]}."
              exit 1
            fi
            aabs+=("${found[0]}")
          done
          if ! keystore="$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1)"; then
            echo "$keystore"
            echo "::error::keytool could not read the release keystore."
            exit 1
          fi
          digest() { sed -n "s/^[[:space:]]*$1: *//p" <<< "$2" | head -1; }
          sha1="$(digest SHA1 "$keystore")"
          sha256="$(digest SHA256 "$keystore")"
          if [ -z "$sha1" ] || [ -z "$sha256" ]; then
            echo "$keystore"
            echo "::error::keytool printed no SHA-1 or SHA-256 for the release key."
            exit 1
          fi
          # The watch's too: the Data Layer only links the phone's and the watch's apps signed by one key.
          for aab in "${aabs[@]}"; do
            if ! bundle="$(keytool -printcert -jarfile "$aab" 2>&1)" || [ "$(digest SHA256 "$bundle")" != "$sha256" ]; then
              echo "$bundle"
              echo "::error::$aab is not signed with the release keystore's certificate (SHA-256 $sha256)."
              exit 1
            fi
          done
          echo "::notice title=AAB signing SHA-1::$sha1"
          {
            echo "### AAB signing certificate"
            echo ""
            echo "SHA-1: \`$sha1\`"
            echo ""
            echo "SHA-256: \`$sha256\`"
            echo ""
            echo "Google Play takes the bundles, the phone's and the watch's, only when this is their upload key certificate (Play Console > Test and release > App integrity)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the AAB as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          # A week, for the "Re-run failed jobs" of the upload: a bundle installs nowhere before Google Play signs it.
          retention-days: 7
          if-no-files-found: error

      - name: Upload the watch's AAB as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: wear-aab
          path: wearApp/build/outputs/bundle/release/*.aab
          retention-days: 7
          if-no-files-found: error

  android-upload:
    name: Android, send to Google Play
    needs: [plan, android-build]
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Download the AAB build artifact
        uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: aab

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      # One edit of Google Play: the bundle, the track and the notes land together or not at all, so a failed
      # attempt leaves nothing behind and "Re-run failed jobs" starts it over. The lane takes the one bundle the
      # pattern finds, and gives each language of the listing its notes.
      - name: Send the AAB to Google Play
        uses: ./.github/actions/play-store-lane
        with:
          lane: >-
            play_upload aab:aab/*.aab track:${{ inputs.track }} rollout:${{ inputs.rollout }}
            version_code:${{ needs.plan.outputs.version_code }} notes:release-notes/stores/play
          service-account-json: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

  # The watch's bundle, to the Wear OS form factor's track of the same name (the lane's form_factor:wear), after the
  # phone's: Google Play drops an edit that is still open when another one commits, so the two never go at once. A job
  # of its own, so "Re-run failed jobs" sends only the watch's again once the phone's landed. Its versionCode is the
  # phone's + 1,000,000 (wearVersionCodeOffset in wearApp/build.gradle.kts).
  wear-upload:
    name: Wear OS, send to Google Play
    needs: [plan, android-build, android-upload]
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Download the watch's AAB build artifact
        uses: actions/download-artifact@v8
        with:
          name: wear-aab
          path: wear-aab

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      # The offset read from wearApp/build.gradle.kts, its one place, so the code the lane checks after a 5xx is the
      # bundle's.
      - name: The watch's versionCode
        id: code
        env:
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
        run: |
          offset="$(sed -n 's/^val wearVersionCodeOffset = \([0-9_]*\)$/\1/p' wearApp/build.gradle.kts | tr -d _)"
          if [ -z "$offset" ]; then
            echo "::error::No wearVersionCodeOffset in wearApp/build.gradle.kts."
            exit 1
          fi
          echo "version_code=$((VERSION_CODE + offset))" >> "$GITHUB_OUTPUT"

      - name: Send the watch's AAB to Google Play
        uses: ./.github/actions/play-store-lane
        with:
          lane: >-
            play_upload aab:wear-aab/*.aab form_factor:wear track:${{ inputs.track }} rollout:${{ inputs.rollout }}
            version_code:${{ steps.code.outputs.version_code }} notes:release-notes/stores/play
          service-account-json: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

  # Google Play shows a listing's screenshots to everyone the moment they change, whatever track the bundle went to:
  # only a release to the production track brings its screenshots. Jobs of their own, which finalize doesn't wait
  # for, so a listing that failed to update never reads as a bundle that didn't land. Drawing them needs nothing from
  # the bundle, so it runs next to the build, and hands the images over as an artifact: a build or an upload that
  # fails leaves them drawn for nothing, which costs less than a listing that waits for them after every bundle.
  android-screenshots-render:
    name: Android, draw the store listing screenshots
    needs: plan
    if: ${{ inputs.screenshots && inputs.android && inputs.track == 'production' }}
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      locales: ${{ steps.draw.outputs.locales }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      # Robolectric draws the real Compose screens from the sample trip (docs/store-listing-screenshots.md), and the
      # images are handed over as the artifact `play-store-screenshots`: the steps play-store-screenshots.yml runs
      # to send them without a release.
      - name: Draw the screenshots
        id: draw
        uses: ./.github/actions/play-screenshots-draw
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  # A few locales per job, one job after the other: the jobs of play-store-screenshots-upload.yml, which
  # play-store-screenshots.yml calls too, to send them without a release. Shown as "Android, Google Play
  # screenshots / send 1 of 5: <locales>". A group Google Play refused costs that group alone, and that group's own
  # re-run button sends only it again, without drawing anything a second time ("Re-run failed jobs" would also run
  # the App Store jobs that failed with continue-on-error). Run again after the release, a group's job stops while
  # a listing or Google Play's screenshots sent alone are going.
  #
  # Only after the bundle reached the track (`needs: android-upload`, with no `if` that would let them run past a
  # failed upload): every job here that changes something is a save, which Google Play counts against a daily
  # quota it documents nowhere, and the bundle's edit is a save too. Sent first, the bundle is never the one left
  # without quota by its own run's screenshots; a save they are refused is a warning, not a failed job
  # (docs/store-listing-screenshots.md#google-plays-daily-save-quota).
  android-screenshots:
    name: Android, Google Play screenshots
    # After the watch's bundle too, whatever became of it: an edit of theirs that committed first would drop the
    # watch's still open. Only the phone's has to have landed, so a watch that failed (no Wear OS form factor yet)
    # costs the listing nothing; a phone that failed or was skipped skips them, as before.
    needs: [plan, android-upload, wear-upload, android-screenshots-render]
    if: >-
      ${{ !cancelled() && needs.android-upload.result == 'success' &&
      needs.android-screenshots-render.outputs.locales != '' }}
    permissions:
      contents: read
      # Each upload job looks for a listing or Google Play's screenshots going up alone, and for a group before
      # it that used Google Play's save quota up.
      actions: read
    uses: ./.github/workflows/play-store-screenshots-upload.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      locales: ${{ needs.android-screenshots-render.outputs.locales }}
      # Neither can start while this run is going, so the check only ever stops a group's job run again after
      # it. Not the releases: the next one waiting behind this run would stop every group.
      refuse_while_going: store-listing.yml play-store-screenshots.yml
    secrets:
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

  # ---------------------------------------------------------------------------------------------
  # The App Store's screenshots: captured on the simulators and this runner's screen, framed, uploaded
  # ---------------------------------------------------------------------------------------------
  # The App Store only takes screenshots on a version it can still edit, so they go up before the submission, and
  # only in a run that submits. Only the captures need a Mac: the jobs that talk to App Store Connect through its API
  # (the version, the uploads, the submission) run on Linux, where a wait for Apple costs no Mac runner. None of these jobs may hold the release back, hence continue-on-error: a failed one
  # is listed as failed, the run is not, and the submission goes on with the screenshots the version already has. A
  # job with continue-on-error doesn't read as failed to the jobs that need it, so those look at its outputs.

  # Creating a version makes App Store Connect copy the previous version's screenshots into it, and deliver deleting
  # a shelf in the middle of that copy leaves strays it then can't sort. Created here, the copy is long over by the
  # time the captures are framed. In every run that submits, with `screenshots` off too: the submit lane refuses a
  # version whose primary language has no screenshots, and one it had to create itself, a moment before it looks,
  # could still be waiting for that copy. Should this fail, the first upload or the submit lane creates the version,
  # as they always could.
  app-store-versions:
    name: App Store, create the version
    needs: plan
    if: ${{ inputs.submit_for_review && (inputs.ios || inputs.macos) }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Create the iOS version
        if: ${{ inputs.ios }}
        uses: ./.github/actions/app-store-lane
        with:
          lane: app_store_prepare_version platform:ios version:${{ needs.plan.outputs.version }}
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Create the macOS version
        if: ${{ !cancelled() && inputs.macos }}
        uses: ./.github/actions/app-store-lane
        with:
          lane: app_store_prepare_version platform:osx version:${{ needs.plan.outputs.version }}
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  # One job per App Store slot, next to the builds: each builds the UI tests of a debug app seeded with the sample
  # trip and runs them on its simulator; for `mac`, a script launches the debug Mac app on the runner's own screen and
  # photographs its window (docs/store-listing-screenshots.md).
  # The slots are the ones `plan` listed (scripts/release/app-store-capture-slots.sh): only what the run can upload.
  # The iPhone's two and the iPad's are among them whichever Apple platform the run releases, since the frames of
  # every device need them. The iPhone Duo's two and the Mac's are there only with `screenshots_iphone_duo` and
  # `screenshots_mac`, off unless asked for: all three failed on the first release that ran them (run 44222898644,
  # November 2026), so a release leaves them out until their captures work on a runner
  # (docs/release-process.md#the-devices-the-app-stores-captures-run-on). No slot at all, in a run of the Mac alone
  # without its marker, skips the job, and with it the frames and the uploads.
  # The iPhone Duo has two, closed and open, each on a runner of its own. Both fail on a runner whose Xcode
  # has no runtime for the Duo, and the open one where the script can't press Open in Device Hub: nobody is there to
  # press it, so once its own attempt is over (up to a minute and a half) it waits half a minute more and gives up,
  # and the job fails for having captured nothing. The Duo's art needs both slots: when either fails, the art goes
  # without the Duo, and the App Store's upload stops (the Fastfile's upload_store_screenshots) rather than let
  # deliver's overwrite_screenshots clear its shelf. The two slots stay apart, although one job could share their build: the open capture is the one nobody has seen work, and a run of it that breaks halfway must
  # not take the closed Duo's captures with it.
  apple-screenshots-capture:
    name: App Store, capture the ${{ matrix.slot }} screenshots
    needs: plan
    if: ${{ inputs.screenshots && inputs.submit_for_review && needs.plan.outputs.capture_slots != '' }}
    runs-on: xcode-27
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(needs.plan.outputs.capture_slots) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          kotlin-native: 'true'
          cache-read-only: 'true'

      - name: Install XcodeGen
        run: brew install xcodegen

      # One run of the UI test per language, so the log says which one is being captured and the job's summary
      # lists them with how long each took. A language that fails is tried once more; failing again, the others are
      # still captured and the step fails at the end, naming it (scripts/store-screenshots/capture-ios.sh).
      - name: Capture on the simulator
        id: simulator
        if: ${{ matrix.slot != 'mac' }}
        env:
          STORE_SCREENSHOTS_SLOTS: ${{ matrix.slot }}
          STORE_SCREENSHOTS_OPEN_TIMEOUT: 30
        run: |
          # The art's screens: the nine of screens.tsv, then "Dividir" and, in Brazil's listing, "Pagar Carla".
          # The iPhone Duo's two displays are captured as the listing's own list says (capture-ios.sh), the art
          # taking the group, Balances and Statistics from the open one.
          if [ "$STORE_SCREENSHOTS_SLOTS" = iphoneduoopen ]; then
            STORE_SCREENSHOTS_SCREENS=group,balances,statistics ./scripts/store-screenshots/capture-ios.sh
          else
            ART_SLOTS="$STORE_SCREENSHOTS_SLOTS" ./scripts/store-screenshots/listing-art/capture.sh
          fi

      # The runner has no signing account, so the app is signed to run locally and without its entitlements, which
      # only a provisioning profile could grant. The script fails where it isn't allowed to record the screen, and
      # on a display that isn't Retina, whose captures the frame would blur: the Mac's listing keeps what it has, which
      # is nothing today, so `macos-submit` refuses the version
      # (docs/release-process.md#the-devices-the-app-stores-captures-run-on).
      - name: Capture on the runner's screen
        if: ${{ matrix.slot == 'mac' }}
        env:
          STORE_SCREENSHOTS_BUILD_SETTINGS: CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS=
        run: |
          ./scripts/store-screenshots/capture-mac.sh
          STORE_SCREENSHOTS_TABLE=art-screens STORE_SCREENSHOTS_SCREENS=splitmodes ./scripts/store-screenshots/capture-mac.sh
          STORE_SCREENSHOTS_TABLE=art-screens STORE_SCREENSHOTS_SCREENS=pay STORE_SCREENSHOTS_LOCALES=pt-BR ./scripts/store-screenshots/capture-mac.sh

      # Also when the simulator's capture failed on a language, with the languages it did capture: the frame takes
      # none of a slot that misses one, but they are there to download, so a person who captures the missing language
      # on a Mac has the others. The failed language's folder isn't among them, and a capture that failed with
      # nothing captured (the build failed, the Duo didn't open) uploads nothing, without a second error. Not after a
      # failed Mac capture, which stops in the middle of a language, nor in a job that was cancelled or ran out of
      # time. A job run again replaces what its failed run uploaded.
      - name: Upload the captures as a build artifact
        if: ${{ !cancelled() && (success() || steps.simulator.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: apple-captures-${{ matrix.slot }}
          path: build/outputs/apple-screenshot-captures/
          retention-days: 7
          if-no-files-found: ${{ steps.simulator.outcome == 'failure' && 'ignore' || 'error' }}
          overwrite: true

  # Chrome lays each capture out in the listing art's design (listing-art/compose.mjs), on a Mac runner, whose fonts
  # and Chrome the art is drawn with. The script fails without the iPhone's and the iPad's captures; the iPhone Duo's
  # and the Mac's are drawn when they are there. Without the Duo's, `ios_locales` is emptied, so the iPhone's and the
  # iPad's aren't uploaded either; with no Mac capture `mac_locales` is empty, and the Mac's upload and tidy-up jobs skip.
  apple-screenshots-frame:
    name: App Store, frame the screenshots
    needs: [plan, apple-screenshots-capture]
    if: ${{ !cancelled() && needs.apple-screenshots-capture.result != 'skipped' }}
    runs-on: xcode-27
    timeout-minutes: 60
    continue-on-error: true
    outputs:
      ios_locales: ${{ steps.staged.outputs.ios_locales }}
      mac_locales: ${{ steps.staged.outputs.mac_locales }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Setup Gradle and Java
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: 'true'

      # Each artifact is rooted at its slot's folder, so together they are the captures folder again.
      - name: Download the captures
        uses: actions/download-artifact@v8
        with:
          pattern: apple-captures-*
          merge-multiple: true
          path: build/outputs/apple-screenshot-captures

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # In a virtual environment of its own, which the runner's Python allows whatever its pip: the system's refuses
      # installs, and --break-system-packages doesn't exist on an older pip.
      - name: Install Pillow
        run: |
          python3 -m venv "$RUNNER_TEMP/art-venv"
          "$RUNNER_TEMP/art-venv/bin/pip" install pillow
          echo "$RUNNER_TEMP/art-venv/bin" >> "$GITHUB_PATH"

      - name: Frame the screenshots
        run: ./scripts/store-screenshots/listing-art/frame-app-store.sh

      # The upload jobs' matrices, read off what was staged: empty for a store with nothing to send. Set last, so only
      # a job that framed them says so. Read into variables first, so a script that fails stops the step.
      - name: List the staged locales
        id: staged
        run: |
          ios_locales="$(./scripts/release/staged-screenshot-locales.sh fastlane/screenshots)"
          # The upload refuses a set without the iPhone Duo (the Fastfile), which would empty its shelf: rather than a
          # failed job per locale, the iPhone's and the iPad's are left as they are
          if [ -n "$ios_locales" ] && ! compgen -G "fastlane/screenshots/*/*_iphone_duo*.png" > /dev/null; then
            echo "::warning::No iPhone Duo screenshots staged: the iPhone's and the iPad's App Store screenshots are left as they are (screenshots_iphone_duo, or a set sent from a Mac)"
            ios_locales=""
          fi
          mac_locales="$(./scripts/release/staged-screenshot-locales.sh fastlane/screenshots-mac)"
          {
            echo "ios_locales=$ios_locales"
            echo "mac_locales=$mac_locales"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the iPhone and iPad screenshots as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots-ios
          path: fastlane/screenshots/
          retention-days: 7
          if-no-files-found: error

      - name: Upload the Mac screenshots as a build artifact
        if: ${{ steps.staged.outputs.mac_locales != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots-mac
          path: fastlane/screenshots-mac/
          retention-days: 7
          if-no-files-found: error

  # One job per locale, as in Bible Planner's releases, so a locale App Store Connect refused is the only one sent
  # again, with the images that were already framed, then the tidy-up, which sorts every shelf and fails on one
  # that doesn't hold every screen once, without removing anything and without stopping the release
  # (best_effort): the jobs of app-store-screenshots-upload.yml, which app-store-screenshots.yml calls too,
  # for a set made on a Mac. Shown as "iOS, App Store screenshots / send <locale>" and "… / tidy up". The Mac's go
  # on a version of their own, so its jobs run next to the iPhone's. They go on the release's version, created if
  # app-store-versions didn't.
  # deliver deletes a locale's screenshots before it uploads the new ones, so a job that failed halfway can leave
  # that locale with none: the App Store then shows the primary language's there, and the submission says which.
  #
  # best_effort is the continue-on-error of every job of the call, which a job that calls a workflow can't carry
  # itself. Re-running a failed locale's job runs it, the tidy-up and the submit job again, which only helps while
  # the version can still be edited: the submission doesn't wait for a failed locale
  # (docs/release-process.md#screenshots-with-a-release).
  ios-screenshots:
    name: iOS, App Store screenshots
    needs: [plan, app-store-versions, apple-screenshots-frame]
    if: ${{ !cancelled() && inputs.ios && needs.apple-screenshots-frame.outputs.ios_locales != '' }}
    uses: ./.github/workflows/app-store-screenshots-upload.yml
    with:
      platform: ios
      locales: ${{ needs.apple-screenshots-frame.outputs.ios_locales }}
      artifact: app-store-screenshots-ios
      ref: ${{ needs.plan.outputs.sha }}
      app_version: ${{ needs.plan.outputs.version }}
      best_effort: true
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  macos-screenshots:
    name: macOS, App Store screenshots
    needs: [plan, app-store-versions, apple-screenshots-frame]
    if: ${{ !cancelled() && inputs.macos && needs.apple-screenshots-frame.outputs.mac_locales != '' }}
    uses: ./.github/workflows/app-store-screenshots-upload.yml
    with:
      platform: mac
      locales: ${{ needs.apple-screenshots-frame.outputs.mac_locales }}
      artifact: app-store-screenshots-mac
      ref: ${{ needs.plan.outputs.sha }}
      app_version: ${{ needs.plan.outputs.version }}
      best_effort: true
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  # ---------------------------------------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------------------------------------
  # One job, as the beta's: Cloudflare takes a deployment whole, and one that failed leaves the site as it was, so
  # "Re-run failed jobs" builds and deploys again. The action stops before the build, naming the project, when the
  # Pages project was never created.
  web:
    name: Web, build and deploy to Cloudflare Pages
    needs: plan
    if: ${{ inputs.web }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Build and deploy the web app
        uses: ./.github/actions/web-deploy
        with:
          version: ${{ needs.plan.outputs.version }}
          version-code: ${{ needs.plan.outputs.version_code }}
          sha: ${{ needs.plan.outputs.sha }}
          pages-project: ${{ env.CLOUDFLARE_PAGES_PROJECT }}
          url: ${{ env.WEB_URL }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          firebase-api-key: ${{ vars.VITE_FIREBASE_API_KEY }}
          firebase-app-id: ${{ vars.VITE_FIREBASE_APP_ID }}
          firebase-project-id: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          firebase-measurement-id: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          sentry-dsn: ${{ vars.VITE_SENTRY_DSN }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ vars.SENTRY_ORG }}
          sentry-project: ${{ vars.SENTRY_PROJECT }}
          vapid-public-key: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  # ---------------------------------------------------------------------------------------------
  # iOS and macOS: the same composite actions as the betas, then the submission
  # ---------------------------------------------------------------------------------------------
  ios-build:
    name: iOS, build the IPA
    needs: plan
    if: ${{ inputs.ios }}
    # The Xcode 27 image, as apple.yml: the app uses the iOS 27 SDK's APIs.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Archive and export the iOS app
        uses: ./.github/actions/apple-build
        with:
          scheme: BoraRachar-iOS
          destination: generic/platform=iOS
          export-path: build/ios
          version: ${{ needs.plan.outputs.version }}
          version-code: ${{ needs.plan.outputs.version_code }}
          google-service-info-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          match-password: ${{ secrets.MATCH_PASSWORD }}
          match-ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Upload the IPA as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/ios/*.ipa
          # A week, for the "Re-run failed jobs" of the upload: an IPA signed for the App Store installs nowhere else.
          retention-days: 7
          if-no-files-found: error

  # The binary only, which is also what puts it on TestFlight. The submission is ios-submit's, so one that fails
  # is tried again without sending the build a second time, which App Store Connect refuses for a build number it
  # already holds.
  ios-upload:
    name: iOS, send to App Store Connect
    needs: [plan, ios-build]
    # The image that built it: an older altool uploading an Xcode 27 binary is a risk with no use.
    runs-on: xcode-27
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Download the IPA build artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: build/ios

      - name: Send the IPA to App Store Connect
        uses: ./.github/actions/apple-upload
        with:
          type: ios
          file: build/ios/*.ipa
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  # Waits for App Store Connect to process the build, writes the version's "What's new" in each language the
  # listing has, and sends it for review. It needs the screenshots' job only to come after it: !cancelled() lets it
  # run when that one failed or never ran, and the binary having landed is the one thing it requires. The lane
  # refuses to submit a version whose primary language has no screenshots and names, in a warning on the run's page,
  # the other locales with none of their own (a language added since the screenshots were last made). A re-run of
  # this job after the submission landed finds it and does nothing.
  ios-submit:
    name: iOS, submit for App Store review
    needs: [plan, ios-upload, ios-screenshots]
    if: ${{ !cancelled() && inputs.submit_for_review && needs.ios-upload.result == 'success' }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      # The lane asks scripts/release/store-listing.mjs, plain Node, for the version's copyright line.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Submit for review
        uses: ./.github/actions/app-store-lane
        with:
          lane: >-
            app_store_submit platform:ios version:${{ needs.plan.outputs.version }}
            build:${{ needs.plan.outputs.version_code }} phased:${{ inputs.phased_release }}
            notes:release-notes/stores/app-store-ios
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  macos-build:
    name: macOS, build the package
    needs: plan
    if: ${{ inputs.macos }}
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Archive and export the macOS app
        uses: ./.github/actions/apple-build
        with:
          scheme: BoraRachar-macOS
          destination: generic/platform=macOS
          # :shared only declares macosArm64(), and a Release archive of a generic destination also builds x86_64.
          build-settings: ARCHS=arm64
          export-path: build/macos
          version: ${{ needs.plan.outputs.version }}
          version-code: ${{ needs.plan.outputs.version_code }}
          google-service-info-plist: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          match-password: ${{ secrets.MATCH_PASSWORD }}
          match-ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-pkg
          path: build/macos/*.pkg
          retention-days: 7
          if-no-files-found: error

  macos-upload:
    name: macOS, send to App Store Connect
    needs: [plan, macos-build]
    runs-on: xcode-27
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Download the package build artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-pkg
          path: build/macos

      - name: Send the package to App Store Connect
        uses: ./.github/actions/apple-upload
        with:
          type: macos
          file: build/macos/*.pkg
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  # As ios-submit, on the Mac app's own version (platform osx).
  macos-submit:
    name: macOS, submit for App Store review
    needs: [plan, macos-upload, macos-screenshots]
    if: ${{ !cancelled() && inputs.submit_for_review && needs.macos-upload.result == 'success' }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1

      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      - name: Download the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      # The lane asks scripts/release/store-listing.mjs, plain Node, for the version's copyright line.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Submit for review
        uses: ./.github/actions/app-store-lane
        with:
          lane: >-
            app_store_submit platform:osx version:${{ needs.plan.outputs.version }}
            build:${{ needs.plan.outputs.version_code }} phased:${{ inputs.phased_release }}
            notes:release-notes/stores/app-store-mac
          key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          key-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          key-p8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

  # ---------------------------------------------------------------------------------------------
  # Finalize
  # ---------------------------------------------------------------------------------------------
  finalize:
    name: Tag, release and merge-back
    needs:
      - plan
      - android-build
      - android-upload
      - wear-upload
      - ios-build
      - ios-upload
      - ios-submit
      - macos-build
      - macos-upload
      - macos-submit
      - web
    # always() replaces the implicit success(): a platform the run skipped or that failed must not hold the
    # release back, and neither must a cancelled run, since cancelling is the only way to stop a release and what
    # a store or the web took before it has to be recorded all the same. A store that took a build, or the web
    # deployed, is enough: the versionCode a store used has to reach main whatever happened to the others, and a
    # version that is out has to be recorded. An upload cancelled after its build passed may have reached the
    # store before it stopped, and nothing says which: it counts for the versionCode, which only has to grow, and
    # never for the tag, which takes an upload that passed.
    if: >-
      ${{ always() && needs.plan.result == 'success' && (
      needs.android-upload.result == 'success' || needs.ios-upload.result == 'success' ||
      needs.macos-upload.result == 'success' || needs.web.result == 'success' ||
      (needs.android-build.result == 'success' && needs.android-upload.result == 'cancelled') ||
      (needs.ios-build.result == 'success' && needs.ios-upload.result == 'cancelled') ||
      (needs.macos-build.result == 'success' && needs.macos-upload.result == 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # It tags, publishes and merges into main: an admin's to run again, as the jobs before it.
      - name: Check who releases
        uses: ./.github/actions/release-admin
        with:
          token: ${{ github.token }}

      # The run released when a build reached the production track or was sent to App Store review, or the web app
      # was deployed, which is for everyone at once: the version
      # then gets its tag and its GitHub release, which is also what tells the next release where to count the
      # notes and the build numbers from. First, so it is recorded even when the merge-back below fails. It opens
      # with what the version tells, in English, as `plan` picked it. A re-run
      # (after "Re-run failed jobs" fixed a platform), or a later run that adds a platform to the version, keeps
      # the release and rewrites the rows of the platforms it ran, so the record follows the results.
      - name: Publish the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          SHA: ${{ needs.plan.outputs.sha }}
          TRACK: ${{ inputs.track }}
          ROLLOUT: ${{ inputs.rollout }}
          SUBMIT: ${{ inputs.submit_for_review }}
          ANDROID: ${{ needs.android-upload.result }}
          WEAR: ${{ needs.wear-upload.result }}
          IOS_UPLOAD: ${{ needs.ios-upload.result }}
          IOS_SUBMIT: ${{ needs.ios-submit.result }}
          MACOS_UPLOAD: ${{ needs.macos-upload.result }}
          MACOS_SUBMIT: ${{ needs.macos-submit.result }}
          WEB: ${{ needs.web.result }}
          STORES: ${{ inputs.android || inputs.ios || inputs.macos }}
          NOTES: ${{ needs.plan.outputs.github_notes }}
        run: |
          released=false
          if [ "$TRACK" = production ] && [ "$ANDROID" = success ]; then released=true; fi
          if [ "$IOS_SUBMIT" = success ] || [ "$MACOS_SUBMIT" = success ]; then released=true; fi
          if [ "$WEB" = success ]; then released=true; fi
          # Only a 404 says the version has no release: any other failure read as "not released" would skip the
          # tag of a version that went out, or try to create a release that is there.
          errors="$RUNNER_TEMP/release-errors.txt"
          if release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" 2> "$errors")"; then
            exists=true
          elif grep -q "HTTP 404" "$errors"; then
            exists=false
          else
            cat "$errors"
            echo "::error::Could not ask GitHub whether $VERSION has a release. Re-run this job."
            exit 1
          fi
          if [ "$released" = false ] && [ "$exists" = false ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing reached the production track, App Store review or the web: $VERSION gets no tag, and its fragments stay. Its versionCode is merged back, and its version when higher than main's."
            exit 0
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"

          android_channel="Google Play, \`$TRACK\` track"
          if [ "$TRACK" = production ]; then android_channel="$android_channel, $ROLLOUT% of the users"; fi
          # The watch's part only when its upload ran: a phone that failed never sent it.
          if [ "$WEAR" != skipped ]; then android_channel="$android_channel, the watch on Wear OS's"; fi
          # The phone's result decides the release; the watch's, sent after it, is told next to it when it differs.
          android="$ANDROID"
          if [ "$ANDROID" = success ] && [ "$WEAR" != success ]; then android="success (watch: $WEAR)"; fi
          if [ "$SUBMIT" = true ]; then
            apple_channel="App Store, sent for review"
            ios="$IOS_SUBMIT"
            macos="$MACOS_SUBMIT"
            # A submission that never started because the upload failed is that failure, not a platform left out.
            if [ "$IOS_UPLOAD" != success ]; then ios="$IOS_UPLOAD"; fi
            if [ "$MACOS_UPLOAD" != success ]; then macos="$MACOS_UPLOAD"; fi
          else
            apple_channel="TestFlight"
            ios="$IOS_UPLOAD"
            macos="$MACOS_UPLOAD"
          fi

          web_channel="Cloudflare Pages, $WEB_URL"
          # The build number a store may hold. A run of the web alone has none to record: no store was asked to
          # take a build, so the release names none and the next one doesn't skip a number for it.
          code="$VERSION_CODE"
          if [ "$STORES" != true ]; then code=0; fi

          if [ "$exists" = true ]; then
            # A platform this run left out, or was cancelled on, keeps the row an earlier run wrote for it, and so
            # does one this run
            # only sent to a testing track or to TestFlight when the row says it was released. The web's keeps a
            # success a later deployment that failed didn't undo: the site still serves the one that worked. A
            # release from before the web was part of a stable version has no Web row: it goes after macOS's.
            jq -r '.body // ""' <<< "$release" | tr -d '\r' | awk \
              -v code="$code" -v android="$android" -v ios="$ios" -v macos="$macos" \
              -v android_channel="$android_channel" -v apple_channel="$apple_channel" \
              -v track="$TRACK" -v submit="$SUBMIT" -v web="$WEB" -v web_channel="$web_channel" '
              function left_out(result) { return result == "skipped" || result == "cancelled" }
              function keeps(result, releases) { return left_out(result) || (!releases && $0 ~ /production|sent for review/) }
              function web_row() { return "| Web | " web_channel " | " web " |" }
              after_macos { if ($0 !~ /^\| Web \|/ && !left_out(web)) print web_row(); after_macos = 0 }
              /^Build number: / { if ($3 + 0 < code + 0) print "Build number: " code; else print; next }
              /^\| Android \|/ && !keeps(android, track == "production") { print "| Android | " android_channel " | " android " |"; next }
              /^\| iOS \|/ && !keeps(ios, submit == "true")              { print "| iOS | " apple_channel " | " ios " |"; next }
              /^\| macOS \|/ { if (keeps(macos, submit == "true")) print; else print "| macOS | " apple_channel " | " macos " |"; after_macos = 1; next }
              /^\| Web \|/ && !left_out(web) && (web == "success" || $0 !~ /\| success \|$/) { print web_row(); next }
              { print }
              END { if (after_macos && !left_out(web)) print web_row() }' > "$RUNNER_TEMP/notes.md"
            # A release the web alone made names no build number: the first run that sends a store one adds it.
            if [ "$code" -gt 0 ] && ! grep -q '^Build number: ' "$RUNNER_TEMP/notes.md"; then
              { printf 'Build number: %s\n\n' "$code"; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/notes-with-build.md"
              mv "$RUNNER_TEMP/notes-with-build.md" "$RUNNER_TEMP/notes.md"
            fi
            gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            echo "::notice::$VERSION is already published: its table of channels was refreshed."
            exit 0
          fi

          {
            if [ "$code" -gt 0 ]; then
              echo "Build number: $code"
              echo
            fi
            if [ -n "$NOTES" ]; then
              printf '%s\n\n' "$NOTES"
            fi
            echo "## Channels"
            echo
            echo "| Platform | Channel | Result |"
            echo "| --- | --- | --- |"
            echo "| Android | $android_channel | $android |"
            echo "| iOS | $apple_channel | $ios |"
            echo "| macOS | $apple_channel | $macos |"
            echo "| Web | $web_channel | $WEB |"
          } > "$RUNNER_TEMP/channels.md"
          # The pull requests since the stable version before this one, not since its last beta.
          since=()
          # Not this version's own tag, which a release deleted since, or a tag pushed by hand, leaves behind.
          previous="$(git tag --merged "$SHA" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$VERSION" | sort -V | tail -1 || true)"
          if [ -n "$previous" ]; then since=(--notes-start-tag "$previous"); fi
          gh release create "$VERSION" \
            --target "$SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/channels.md" \
            --generate-notes "${since[@]}" \
            --latest

      # The versionCode, the versionName when it is higher than main's and, once the version is released, the
      # removal of the fragments its tag's commit had (scripts/release/merge-back.sh, which also says how a re-run
      # finishes the job). A run of the web alone, with every store platform off, consumed no build number a store
      # cares about, so, as a beta's, it leaves main's versionCode alone: the version and the fragments are all it
      # merges back. A run that asked a store for a build merges its versionCode back even when every upload failed,
      # since a store may hold a build of a job that failed after sending it. The pull request is created with
      # GITHUB_TOKEN, so no PR workflow runs for a version bump,
      # and merged with the MERGE_WHEN_GREEN_TOKEN, so the push to main triggers its workflows (docs/ci.md,
      # "Merge when green").
      - name: Merge the release back into main
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.MERGE_WHEN_GREEN_TOKEN }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          VERSION: ${{ needs.plan.outputs.version }}
          VERSION_CODE: ${{ needs.plan.outputs.version_code }}
          RELEASED: ${{ steps.release.outputs.released }}
          STORES: ${{ inputs.android || inputs.ios || inputs.macos }}
          ACTOR: ${{ github.actor }}
        run: |
          tag=()
          if [ "$RELEASED" = true ]; then tag=("$VERSION"); fi
          code="$VERSION_CODE"
          if [ "$STORES" != true ]; then code=0; fi
          ./scripts/release/merge-back.sh "$VERSION" "$code" "$VERSION" "${tag[@]}"

  # ---------------------------------------------------------------------------------------------
  # Release notes
  # ---------------------------------------------------------------------------------------------
  site-release-notes:
    name: Release notes, send to the site
    needs: [plan, finalize]
    # Once the version is released, whatever the stores' reviews say later, even when the merge-back failed, and
    # on a cancelled run too, whose finalize recorded the release: the notes are about a version that went out, and
    # its fragments leave main with the merge-back. A version with no note has nothing to send.
    if: >-
      ${{ always() && needs.plan.outputs.has_notes == 'true' && needs.finalize.outputs.released == 'true' &&
      (needs.finalize.result == 'success' || needs.finalize.result == 'failure') }}
    uses: ./.github/workflows/site-release-notes.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      sha: ${{ needs.plan.outputs.sha }}
      admin-only: true
    secrets:
      SITE_RELEASE_NOTES_TOKEN: ${{ secrets.SITE_RELEASE_NOTES_TOKEN }}
