name: ai-review-refs

# Fails when the workflows pin different releases of Quartel-Enterprise/ai-review. The gate and
# the threads action have to agree on which threads hold the checks and which step marks a hold, so
# a bump that misses one `uses:` would let the gate hold runs nothing re-runs.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/ai-review-refs-*.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/ci
      - name: Check that every ai-review ref is the same
        run: scripts/ci/ai-review-refs-check-that-every-ai-review-ref-is-the-same.sh
