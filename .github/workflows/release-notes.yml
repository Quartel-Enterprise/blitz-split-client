name: release-notes

# Fails when a fragment of release-notes/unreleased/ has something a release couldn't publish (a language missing, a
# platform the site doesn't know, Markdown in a note), or when a store listing of store-listing/ has something a
# store would refuse or cut (docs/store-listing.md), and runs the tests of the scripts the releases run: the ones
# that read the fragments and the listings, the ones that resolve a release's version and merge it back, the one
# that checks and sends a set of App Store screenshots made on a Mac, the one that decides what the tidy-up of the
# App Store's shelves removes and sorts, and the ones that hold together the workflows Google Play's screenshots go
# up through and decide how its locales are grouped and what its daily save quota stops (the lane's own tests need
# fastlane and are skipped on this runner), and the ones of the queue a Mac's heavy builds share (heavy-check.sh). See
# docs/release-notes.md. Locally: node scripts/release/release-notes.mjs check and
# node scripts/release/store-listing.mjs check.
on:
  pull_request:
    # The defaults, plus a draft marked ready, which claude-review reviews then (see review-gate below).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '.github/workflows/release-notes.yml'
      - 'scripts/release/**'
      - 'release-notes/**'
      - 'store-listing/**'
      # The screens the captures write, and the locales the generators draw in, which a test holds to what Robolectric
      # takes
      - 'scripts/store-screenshots/screens.tsv'
      # The check of a set of App Store screenshots made on a Mac, its tests, and the workflows the tests hold it to
      - 'scripts/store-screenshots/local-set.mjs'
      - 'scripts/store-screenshots/local-set.test.mjs'
      - 'scripts/store-screenshots/listing-art/stage-app-store.py'
      - 'scripts/store-screenshots/watch/generate.sh'
      - '.github/workflows/app-store-screenshots.yml'
      - '.github/workflows/app-store-screenshots-upload.yml'
      # What the tidy-up of the App Store's shelves removes and sorts, its tests, and the lane a test holds it to
      - 'scripts/store-screenshots/shelves.mjs'
      - 'scripts/store-screenshots/shelves.test.mjs'
      # The queue of this Mac's heavy builds and its tests
      - 'scripts/heavy-check.sh'
      - 'scripts/heavy-check.test.mjs'
      - 'fastlane/Fastfile'
      # The workflows that send Google Play's screenshots, from a release and alone, which a test holds together
      - '.github/workflows/release-production.yml'
      - '.github/workflows/play-store-screenshots.yml'
      - '.github/workflows/play-store-screenshots-upload.yml'
      - '.github/actions/play-screenshots-draw/**'
      # The action that runs their lane, which a test holds to the upload jobs with the lane itself
      # (fastlane/Fastfile, listed above)
      - '.github/actions/play-store-lane/**'
      - 'android/store_screenshots/src/test/kotlin/com/quare/blitzsplit/android/storescreenshots/StoreLocale.kt'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-notes.yml'
      - 'scripts/release/**'
      - 'release-notes/**'
      - 'store-listing/**'
      # The screens the captures write, and the locales the generators draw in, which a test holds to what Robolectric
      # takes
      - 'scripts/store-screenshots/screens.tsv'
      # The check of a set of App Store screenshots made on a Mac, its tests, and the workflows the tests hold it to
      - 'scripts/store-screenshots/local-set.mjs'
      - 'scripts/store-screenshots/local-set.test.mjs'
      - '.github/workflows/app-store-screenshots.yml'
      - '.github/workflows/app-store-screenshots-upload.yml'
      # What the tidy-up of the App Store's shelves removes and sorts, its tests, and the lane a test holds it to
      - 'scripts/store-screenshots/shelves.mjs'
      - 'scripts/store-screenshots/shelves.test.mjs'
      # The queue of this Mac's heavy builds and its tests
      - 'scripts/heavy-check.sh'
      - 'scripts/heavy-check.test.mjs'
      - 'fastlane/Fastfile'
      # The workflows that send Google Play's screenshots, from a release and alone, which a test holds together
      - '.github/workflows/release-production.yml'
      - '.github/workflows/play-store-screenshots.yml'
      - '.github/workflows/play-store-screenshots-upload.yml'
      - '.github/actions/play-screenshots-draw/**'
      # The action that runs their lane, which a test holds to the upload jobs with the lane itself
      # (fastlane/Fastfile, listed above)
      - '.github/actions/play-store-lane/**'
      - 'android/store_screenshots/src/test/kotlin/com/quare/blitzsplit/android/storescreenshots/StoreLocale.kt'

permissions:
  contents: read

# Cancels in-progress runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Waits for the opening review on the commit a pull request opened with, or was marked ready for
  # review on, since that review may push a commit of its fixes, and on that fix commit; on all of
  # them, it holds the jobs below while a thread the review opened is unresolved. Every other event
  # skips it, and the jobs below run on a skipped gate too. See .github/workflows/review-gate.yml.
  review-gate:
    if: >-
      github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
      (github.event.action == 'synchronize' && github.event.sender.login == 'claude[bot]')
    uses: ./.github/workflows/review-gate.yml
    permissions:
      actions: read
      pull-requests: read

  release-notes:
    needs: review-gate
    if: ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' }}
    runs-on: ubuntu-latest
    # A hung runner would otherwise hold the check, and merge-when-green, for six hours.
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No dependencies to install: the script and its tests are plain Node.
      - name: Check the fragments
        run: node scripts/release/release-notes.mjs check

      - name: Check the stores' listings
        run: node scripts/release/store-listing.mjs check

      - name: Test the scripts
        run: >-
          node --test scripts/release/play-screenshot-groups.test.mjs scripts/release/play-screenshots-lane.test.mjs
          scripts/release/release-notes.test.mjs scripts/release/release-scripts.test.mjs
          scripts/release/store-listing.test.mjs scripts/store-screenshots/local-set.test.mjs
          scripts/store-screenshots/shelves.test.mjs scripts/heavy-check.test.mjs
