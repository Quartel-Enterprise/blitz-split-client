name: translations

# Every check of the app's strings that needs no build, on one Linux runner, in about half a minute: each language
# against English on Android, Apple and the web. The release notes' and store listings' languages are release-notes's,
# already a short Node job.
#
# Each of these also runs in a slower job (lintDebug in build-and-test, check-translations.py in both Xcode builds of
# apple, check:messages in build-and-test's web), minutes into a Gradle or Xcode build, or not at all when the path
# filters leave that workflow out. A language added by one pull request and a string
# added by another, each green alone, are what turned main red on 2026-11-25 (#604 and #605); this job names every
# platform's missing string at once, before the builds get there. It doesn't stop two green pull requests from
# combining into a red main: each one is checked against the main it was last merged with (merge-when-green updates
# a branch behind main when either side adds a language for that). It makes any red that gets through show in
# seconds, with every platform's gaps listed.
on:
  pull_request:
    # The defaults, plus a draft marked ready, which claude-review reviews then (see review-gate below).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '.github/workflows/translations.yml'
      - '**/src/main/res/values*/strings.xml'
      - 'scripts/check-android-strings.py'
      - 'iosApp/Resources/*.xcstrings'
      - 'iosApp/check-translations.py'
      - 'webApp/src/i18n/**'
      - 'webApp/scripts/check-messages.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/translations.yml'
      - '**/src/main/res/values*/strings.xml'
      - 'scripts/check-android-strings.py'
      - 'iosApp/Resources/*.xcstrings'
      - 'iosApp/check-translations.py'
      - 'webApp/src/i18n/**'
      - 'webApp/scripts/check-messages.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Waits for the opening review on the commit a pull request opened with, or was marked ready for
  # review on, since that review may push a commit of its fixes, and on that fix commit; on all of
  # them, it holds the job below while a thread the review opened is unresolved. Every other event
  # skips it, and the job below runs on a skipped gate too. See .github/workflows/review-gate.yml.
  review-gate:
    if: >-
      github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
      (github.event.action == 'synchronize' && github.event.sender.login == 'claude[bot]')
    uses: ./.github/workflows/review-gate.yml
    permissions:
      actions: read
      pull-requests: read

  # Every step runs even when one before it failed, so one run names what every platform lacks.
  translations:
    needs: review-gate
    if: ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # check-messages.mjs reads the TypeScript dictionaries through Node's own type stripping: no npm install.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Android
        if: ${{ !cancelled() }}
        run: python3 -I scripts/check-android-strings.py

      - name: Apple
        if: ${{ !cancelled() }}
        run: python3 -I iosApp/check-translations.py iosApp/Resources

      - name: Web
        if: ${{ !cancelled() }}
        run: node webApp/scripts/check-messages.mjs
