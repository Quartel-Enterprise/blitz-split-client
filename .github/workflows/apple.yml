name: apple

# The Apple side of the app, on a macOS runner (free on a public repository): every module's
# commonTest on the macOS target, and on the iOS simulator too on main, and both schemes of the Apple
# app, which link the Shared framework. create-pr leaves these to CI and builds a scheme locally only
# when the branch changes the Swift code (see the create-pr skill, step 8).
on:
  pull_request:
    # The defaults, plus a draft marked ready, which claude-review reviews then (see review-gate below).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '.github/workflows/apple.yml'
      - '.github/actions/gradle/action.yml'
      - 'core/**'
      - 'feature/**'
      - 'shared/**'
      - 'iosApp/**'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - 'gradlew'
      - '.github/workflows/review-gate.yml'
      - 'scripts/modules-with-tests.sh'
      - '!**/*.md'
      # The source sets no Apple target compiles.
      - '!**/src/jsMain/**'
      - '!**/src/jsTest/**'
      - '!**/src/jvmMain/**'
      - '!**/src/jvmTest/**'
      - '!**/src/androidMain/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apple.yml'
      - '.github/actions/gradle/action.yml'
      - 'core/**'
      - 'feature/**'
      - 'shared/**'
      - 'iosApp/**'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - 'gradlew'
      - '.github/workflows/review-gate.yml'
      - 'scripts/modules-with-tests.sh'
      - '!**/*.md'
      # The source sets no Apple target compiles.
      - '!**/src/jsMain/**'
      - '!**/src/jsTest/**'
      - '!**/src/jvmMain/**'
      - '!**/src/jvmTest/**'
      - '!**/src/androidMain/**'

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one. main's pushes share one group
# that never cancels a run once it started, since a cancelled run saves no Gradle cache: a push that
# arrives meanwhile waits, and a later one takes its place in the queue. A burst of merges then runs
# the first and the newest, one after the other, each starting from the cache the one before saved.
# With a group per commit they all ran side by side, every one recompiling what the others did, and
# took half of the macOS runners' time: only five of those jobs run at once in the whole
# organization, and the pull requests' waited for a runner behind them, up to 36 minutes.
# A run of main someone runs again gets a group of its own (its run id): in main's it would take the
# place of the push waiting in the queue, the newest commit, which no run would then check.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    (github.run_attempt == 1 && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Waits for the opening review on the commit a pull request opened with, or was marked ready for
  # review on, since that review may push a commit of its fixes, and on that fix commit; on all of
  # them, it holds the jobs below while a thread the review opened is unresolved. Every other event
  # skips it, and the jobs below run on a skipped gate too. See .github/workflows/review-gate.yml.
  review-gate:
    if: >-
      github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
      (github.event.action == 'synchronize' && github.event.sender.login == 'claude[bot]')
    uses: ./.github/workflows/review-gate.yml
    permissions:
      actions: read
      pull-requests: read

  # Says whether the change reaches the Kotlin code, on a Linux runner, which starts at once: a macOS
  # runner is waited for, up to ten minutes when several pull requests run. A pull request that
  # changes the Swift app alone (iosApp, with its Markdown docs and its release notes fragment)
  # leaves every input of apple-tests as main built it, so the job would take a macOS runner for
  # five minutes to restore its tests from the cache. apple-app still builds both schemes. Anything
  # else, a diff that fails or no changed file at all counts as a change to the Kotlin code. So
  # does every push to main, where this job is skipped and apple-tests reads no answer: that run
  # also stands for the pushes it replaced in the queue (see `concurrency` above), which its own
  # diff wouldn't list. It doesn't wait for the review gate, since it checks nothing: the answer is
  # ready when the gate lets apple-tests ask for its runner.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kotlin: ${{ steps.diff.outputs.kotlin }}
      shards: ${{ steps.diff.outputs.shards }}
    steps:
      # Two commits: GitHub's merge of the pull request with main and main itself, its first parent.
      # Without their files: the diff below compares names, which the commits' trees hold, so no
      # file's content is downloaded and only this workflow is written to disk.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github/workflows/apple.yml
          sparse-checkout-cone-mode: false

      # The paths that are no input of a Gradle task of the Apple targets; Markdown is already left
      # out of the paths that start this workflow. --no-renames lists both paths of a moved file, so
      # one moved out of a Kotlin module still counts, and without core.quotePath a name with an
      # accent would come quoted and match nothing.
      #
      # `shards` is the matrix of apple-tests. A change under core/, to gradle/ (the version catalog,
      # the wrapper) or to gradle.properties reaches nearly every module as a rule, and each one then
      # links its test binary again: 18 to 21 minutes in one job, the last check of such a pull
      # request to end by far. Two jobs share those links. It is a guess from the paths, on the
      # cheap side: a core module nothing depends on splits for nothing, which costs a runner five
      # minutes, and a change that reaches every module from elsewhere runs in one job, as before.
      # build-logic and the root's Gradle scripts are left out: a change there gives a new key only
      # to the tasks it configures differently (docs/ci.md, "Speed and timeouts"). The source sets no
      # Apple target compiles and Markdown don't count, as they don't to start this workflow. A change
      # to this workflow or to the script that lists the modules counts too, so a change to the
      # split is seen working before it merges. Two is the only split: "Pick this shard's tasks"
      # deals three of every five modules to the first shard and refuses a third.
      - name: Look for a change outside the Swift app
        id: diff
        run: |
          kotlin=true
          shards='[1]'
          wide='^(core|gradle)/|^gradle\.properties$'
          wide="$wide|^\.github/workflows/apple\.yml$|^scripts/modules-with-tests\.sh$"
          not_apple='\.md$|/src/(js|jvm)(Main|Test)/|/src/androidMain/'
          if files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD) &&
            [ -n "$files" ]; then
            if ! grep -q -v -E '^(iosApp|release-notes)/|\.md$' <<< "$files"; then
              kotlin=false
            elif grep -v -E "$not_apple" <<< "$files" | grep -q -E "$wide"; then
              shards='[1, 2]'
            fi
          fi
          echo "kotlin=$kotlin" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  # The tests and the app's two builds run side by side: each compiles the Kotlin/Native code on its
  # own, and three runners finish sooner than one doing it all. apple-tests runs unless `changes`
  # said the Kotlin code is untouched: when that job fails or is skipped (on main), its output is
  # empty and the tests run, in one job. `changes` asks for two on a pull request whose change
  # reaches nearly every module (see its `shards`); main never does, since no pull request waits
  # for its run and a second job there would be one more runner the pull requests don't get.
  apple-tests:
    needs: [review-gate, changes]
    if: >-
      ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' &&
      needs.changes.outputs.kotlin != 'false' }}
    strategy:
      # One shard's failure doesn't hide the other modules' results.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards || '[1]') }}
    # The Xcode 27 image (a public preview): the app uses the iOS 27 SDK's APIs, and macos-26 has
    # Xcode 26 only.
    runs-on: xcode-27
    # A hung simulator or build would otherwise hold one of the few macOS runners for six hours. The
    # bound that fits each run is on "Run the tests", which knows whether the simulator runs: this
    # one only stops what hangs around it, with room for the caches restored before the longest test
    # run and saved after it.
    timeout-minutes: 100
    steps:
      # Two commits: on a pull request, GitHub's merge of it with main and main itself, its first
      # parent, which "Pick the test targets" compares it with.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Gradle
        id: gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          kotlin-native: 'true'

      # A pull request runs the suite on macOS only. The iOS simulator runs the same commonTest over
      # the same appleMain actuals (iosMain and macosMain differ in a couple of one-line files no test
      # reaches), and each module links one more test binary for it: the links of both targets were
      # half of this job. The main code is still built for the simulator on every pull request:
      # apple-app links Shared for it. main runs the simulator's suite too, after the merge, and so
      # does a pull request that changes the version catalog: a library publishes its code for each
      # target apart, so a bump is the change the two targets can take differently.
      - name: Pick the test targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
        # A diff that fails (no first parent) counts as a change: the simulator's suite runs.
        run: |
          if [ "$EVENT_NAME" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- gradle/libs.versions.toml; then
            echo "simulator=iosSimulatorArm64Test" >> "$GITHUB_OUTPUT"
          fi

      # The actuals of appleMain live in a few modules with few tests of their own; the tests that
      # exercise them are the other modules', so every module's suite runs. compileKotlinIosArm64
      # compiles the device target, which no other check builds, and compileAppleMainKotlinMetadata the
      # appleMain shared by the Apple targets, which only a macOS host compiles.
      #
      # One job runs them all by their task names, as before. Two split the modules that have a
      # commonTest, dealt from the sorted list js-tests deals its own from
      # (scripts/modules-with-tests.sh), so a new module joins a shard by itself. The first takes
      # three of every five; the second takes the other two and the two compilations, about three
      # minutes of the 18 when everything is compiled again, which leaves each shard about half of
      # the work. Each one compiles for macOS the modules its own depend on. That leaves out a
      # module with no tests that no tested module depends on, `:shared` today, which the one job's
      # macosArm64Test compiled: apple-app's macOS build compiles and links it, and compiling it
      # here would compile every module it depends on, all of them, in this shard too.
      - name: Pick this shard's tasks
        id: tasks
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          SIMULATOR_TESTS: ${{ steps.targets.outputs.simulator }}
        run: |
          compilations='compileKotlinIosArm64 compileAppleMainKotlinMetadata'
          if [ "$SHARD_TOTAL" -gt 2 ]; then
            echo "::error::apple-tests deals its modules to two shards, three of every five and the other two: $SHARD_TOTAL were asked for."
            exit 1
          elif [ "$SHARD_TOTAL" -eq 1 ]; then
            tasks="${SIMULATOR_TESTS:+$SIMULATOR_TESTS }macosArm64Test $compilations"
          else
            modules=$(./scripts/modules-with-tests.sh commonTest)
            tasks=$(awk -v shard="$SHARD_INDEX" -v simulator="$SIMULATOR_TESTS" '
              ((NR - 1) % 5 < 3 ? 0 : 1) == shard {
                gsub("/", ":")
                printf ":%s:macosArm64Test ", $0
                if (simulator != "") printf ":%s:%s ", $0, simulator
              }' <<< "$modules")
            if [ -z "$tasks" ]; then
              echo "::error::No module with tests falls on shard $((SHARD_INDEX + 1)) of $SHARD_TOTAL."
              exit 1
            fi
            if [ "$SHARD_INDEX" -eq 1 ]; then
              tasks="$tasks$compilations"
            fi
          fi
          echo "$tasks" | tr ' ' '\n'
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

      # Recompiling everything took 22 minutes on macOS alone and up to 48 with the simulator too,
      # in one job. "finished" says Gradle ended on its own, with failed tests or without: a run this
      # step's timeout killed may have left a library half compiled in ~/.konan, which main must not
      # save.
      - name: Run the tests
        id: tests
        timeout-minutes: ${{ steps.targets.outputs.simulator && 80 || 60 }}
        env:
          TASKS: ${{ steps.tasks.outputs.tasks }}
        run: |
          status=0
          read -ra tasks <<< "$TASKS"
          ./gradlew "${tasks[@]}" --continue || status=$?
          echo "finished=true" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-test-reports-${{ matrix.shard }}
          path: '**/build/reports/tests/**'

      # main saves the Kotlin/Native entry the Gradle action restored, and only this job, which
      # compiles every Apple target. Its key has a fingerprint of the libraries compiled to native code
      # in it (the folders of klib/cache), so it is saved again when a link compiled a library's new
      # version, and only then: with the Kotlin version alone as the key it was saved once, and every
      # run compiled the libraries bumped since. The fingerprint is compared with the newest entry's,
      # looked up now rather than the one restored when the job started: a run that ended meanwhile
      # may have saved these libraries already, and a second copy would take half a gigabyte of the
      # repository's cache. A failed test doesn't stop the save, since the libraries were compiled
      # all the same; a run the timeout killed does. An entry keeps the versions bumped away until a
      # new Kotlin version starts an empty one.
      - name: Look up the newest Kotlin/Native entry
        id: newest
        if: ${{ !cancelled() && steps.tests.outputs.finished == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ steps.gradle.outputs.konan-key }}
          restore-keys: |
            ${{ steps.gradle.outputs.konan-key }}
          lookup-only: true

      # The key ends with the run, so an entry saved now is always a new one and the newest, the one
      # every job restores: with the fingerprint alone, a run that started from a newer entry holding
      # less (one saved after a restore that found nothing) and compiled its way back to an older
      # entry's libraries could save nothing, that key being taken.
      - name: Fingerprint the Kotlin/Native libraries
        id: konan
        if: ${{ !cancelled() && steps.tests.outputs.finished == 'true' && github.ref == 'refs/heads/main' }}
        env:
          KEY_PREFIX: ${{ steps.gradle.outputs.konan-key }}
          NEWEST_KEY: ${{ steps.newest.outputs.cache-matched-key }}
        run: |
          if [ -n "$KEY_PREFIX" ] && ls -d ~/.konan/kotlin-native-prebuilt-*/klib/cache > /dev/null 2>&1; then
            libraries=$(find ~/.konan/kotlin-native-prebuilt-*/klib/cache -mindepth 3 -maxdepth 3 -type d |
              sort | shasum -a 256 | cut -c1-16)
            case "$NEWEST_KEY" in
              "$KEY_PREFIX$libraries"*) echo "The newest entry already holds these libraries." ;;
              *) echo "key=$KEY_PREFIX$libraries-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Save the Kotlin/Native toolchain
        if: ${{ !cancelled() && steps.konan.outputs.key != '' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.key }}

  # One job per scheme, side by side. Each scheme's build phase builds the Shared framework with
  # Gradle first, which links it again for its target (close to four minutes, even with two modules
  # to compile and the rest from the cache), then compiles the Swift app. In one job the two builds
  # ran one after the other, 14 to 16 minutes that were the last check of nearly every pull request
  # to end.
  apple-app:
    needs: review-gate
    if: ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' }}
    # The Xcode 27 image (a public preview): the app uses the iOS 27 SDK's APIs, and macos-26 has
    # Xcode 26 only.
    runs-on: xcode-27
    # A hung build would otherwise hold one of the few macOS runners for six hours.
    timeout-minutes: 40
    strategy:
      # One scheme's failure doesn't hide the other's.
      fail-fast: false
      # No pull request waits for main's run, so there the schemes take turns on one runner and
      # leave another to the pull requests: with apple-tests, this workflow's run of main holds two
      # of the five macOS runners at most.
      max-parallel: ${{ github.event_name == 'push' && 1 || 2 }}
      # The jobs are apple-app (iOS) and apple-app (macOS). Only the platform is in the matrix: a
      # name written from it would show unexpanded on a job the review gate skips.
      matrix:
        platform: [iOS, macOS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          kotlin-native: 'true'
          # apple-tests saves the Gradle cache of the macOS runner.
          cache-read-only: 'true'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: ./iosApp/generate-project.sh

      # The Swift packages (Firebase and its dependencies) only change with project.yml, and both
      # schemes resolve the same ones. As with the other caches, only main saves them, and only the
      # iOS job: one save is enough. When the macOS job runs before it after a change to project.yml,
      # it finds no entry and resolves the packages from the network, once.
      - name: Cache the Swift packages
        if: github.ref == 'refs/heads/main' && matrix.platform == 'iOS'
        uses: actions/cache@v6
        with:
          path: iosApp/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/project.yml') }}

      - name: Restore the Swift packages
        if: github.ref != 'refs/heads/main' || matrix.platform != 'iOS'
        uses: actions/cache/restore@v6
        with:
          path: iosApp/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/project.yml') }}

      # The iOS build targets the Apple silicon simulator only, since Shared has no x86_64 simulator
      # slice. Signing is skipped: Sign in with Apple and the associated domains need a provisioning
      # profile, on the macOS app even to sign ad hoc.
      - name: Build the app
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            iOS) target=(-destination 'generic/platform=iOS Simulator' ARCHS=arm64) ;;
            macOS) target=(-destination 'platform=macOS') ;;
          esac
          xcodebuild -project iosApp/BoraRachar.xcodeproj -scheme "BoraRachar-$PLATFORM" "${target[@]}" \
            -derivedDataPath iosApp/build/DerivedData -clonedSourcePackagesDirPath iosApp/build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO build -quiet

  # On main, a failed apple-tests leaves no Gradle home in the cache. setup-gradle saves the home when
  # the job ends, whatever its result, under a key that ends with the commit, and every later run
  # restores the newest entry. A run that lost the network restored nothing, found no plugin to
  # configure the build with, and saved an empty home: the next run of main restored it and compiled
  # its 1905 tasks, 40 minutes instead of 4, and so did the pull requests opened meanwhile. Without
  # that entry they restore the one of the last run that passed. A run whose tests failed loses a
  # good entry the same way, which costs the next run that commit's own changes. A job of its own,
  # so the entry goes as soon as apple-tests ends, not once apple-app has built both schemes too.
  # always(), not !cancelled(): a run someone cancels saves the home it had got to as well, and
  # this job has to outlive that cancellation to delete it.
  drop-failed-cache:
    needs: apple-tests
    if: >-
      ${{ always() && github.event_name == 'push' &&
      (needs.apple-tests.result == 'failure' || needs.apple-tests.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # setup-gradle's key is gradle-home-<version>|<os>|<job>[<hash>]-<commit>. The newest entries
      # come first, and this run's is among them: a hundred are ten commits of every job's. The entry
      # was saved seconds ago and the list may not show it yet, so an empty answer is asked for
      # again, and one that stays empty is a warning: the entry may still be there to restore.
      - name: Delete the Gradle home the failed run saved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ids=''
          for attempt in 1 2 3; do
            ids=$(gh cache list --ref "$GITHUB_REF" --key gradle-home- --sort created_at --order desc \
              --limit 100 --json id,key | jq -r --arg sha "$GITHUB_SHA" '.[]
              | select((.key | contains("|apple-tests[")) and (.key | endswith("-" + $sha))) | .id')
            if [ -n "$ids" ] || [ "$attempt" -eq 3 ]; then
              break
            fi
            sleep 20
          done
          if [ -z "$ids" ]; then
            echo "::warning::The cache lists no Gradle home of this run's apple-tests. If the run saved one, it is still the newest: see \"Speed and timeouts\" in docs/ci.md."
          fi
          for id in $ids; do
            gh cache delete "$id"
          done

  # main has no pull request to show a failure on, and a test that fails on the iOS simulator alone
  # first fails there, after the merge, since pull requests run the suite on macOS only. So a job
  # that failed or timed out on main opens an issue, assigned to whoever merged, or comments on the
  # one still open. The commit it names is the one this run checked out: what broke may be any push
  # since the last run of main that completed, the ones this run replaced in the queue included (see
  # `concurrency` above), so the issue links those commits. A run someone cancelled reports nothing,
  # and neither does one replaced in the queue.
  report-failure:
    needs: [apple-tests, apple-app]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To look up the run before this one.
      actions: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: The apple checks failed on main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTS: ${{ needs.apple-tests.result }}
          APP: ${{ needs.apple-app.result }}
          ACTOR: ${{ github.actor }}
        # The commits to look at start after the last run of main that passed or failed: a run
        # replaced in the queue was cancelled, and so was one someone stopped, which leaves a longer
        # range, never a shorter one. With no answer the issue names this run's commit alone.
        # The list of issues, not the search: the search index lags, and two failures in a row
        # would open two.
        run: |
          previous=$(gh api "repos/$GH_REPO/actions/workflows/apple.yml/runs?branch=main&event=push&status=completed&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].head_sha // empty" || true)
          commits=''
          # Only a commit id: on an error, gh prints GitHub's answer where the id would be.
          if [[ "$previous" =~ ^[0-9a-f]{40}$ ]] && [ "$previous" != "$GITHUB_SHA" ]; then
            commits=" The run also stands for the pushes it replaced in the queue, so what broke is in [the commits since the last run that completed]($GITHUB_SERVER_URL/$GH_REPO/compare/$previous...$GITHUB_SHA)."
          fi
          body=$(printf '%s\n\n%s\n' \
            "[This run]($RUN_URL) of \`apple\` failed on \`main\` at $GITHUB_SHA: \`apple-tests\` $TESTS, \`apple-app\` $APP.$commits" \
            "Pull requests run the Kotlin tests on macOS only, so a test that fails on the iOS simulator alone first fails here, and the pull request that fixes it can't check the fix: run \`./scripts/heavy-check.sh ./gradlew :<module>:iosSimulatorArm64Test\` on the Mac. See \"Speed and timeouts\" in docs/ci.md.")
          issue=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --assignee "$ACTOR" ||
              gh issue create --title "$TITLE" --body "$body"
          fi
