name: apple

# The Apple side of the app, on a macOS runner (free on a public repository): both schemes of the
# Apple app, which link the Shared framework, the device targets no scheme builds, and every
# module's commonTest on the macOS target, on main and on a pull request that changes Apple code.
# create-pr leaves these to CI and builds a scheme locally only when the branch changes the Swift
# code (see the create-pr skill, step 8).
on:
  pull_request:
    # The defaults, plus a draft marked ready, which claude-review reviews then (see review-gate below).
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '.github/workflows/apple.yml'
      - '.github/actions/gradle/action.yml'
      - 'core/**'
      - 'feature/**'
      - 'shared/**'
      - 'iosApp/**'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - 'gradlew'
      - '.github/workflows/review-gate.yml'
      - 'scripts/modules-with-tests.sh'
      - '!**/*.md'
      # The source sets no Apple target compiles.
      - '!**/src/jsMain/**'
      - '!**/src/jsTest/**'
      - '!**/src/jvmMain/**'
      - '!**/src/jvmTest/**'
      - '!**/src/androidMain/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apple.yml'
      - '.github/actions/gradle/action.yml'
      - 'core/**'
      - 'feature/**'
      - 'shared/**'
      - 'iosApp/**'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - 'gradlew'
      - '.github/workflows/review-gate.yml'
      - 'scripts/modules-with-tests.sh'
      - '!**/*.md'
      # The source sets no Apple target compiles.
      - '!**/src/jsMain/**'
      - '!**/src/jsTest/**'
      - '!**/src/jvmMain/**'
      - '!**/src/jvmTest/**'
      - '!**/src/androidMain/**'

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one. main's pushes share one group
# that never cancels a run once it started, since a cancelled run saves no Gradle cache: a push that
# arrives meanwhile waits, and a later one takes its place in the queue. A burst of merges then runs
# the first and the newest, one after the other, each starting from the cache the one before saved.
# With a group per commit they all ran side by side, every one recompiling what the others did, and
# took half of the macOS runners' time: only five of those jobs run at once in the whole
# organization, and the pull requests' waited for a runner behind them, up to 36 minutes.
# A run of main someone runs again gets a group of its own (its run id): in main's it would take the
# place of the push waiting in the queue, the newest commit, which no run would then check.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    (github.run_attempt == 1 && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Waits for the opening review on the commit a pull request opened with, or was marked ready for
  # review on, since that review may push a commit of its fixes, and on that fix commit; on all of
  # them, it holds the jobs below while a thread the review opened is unresolved. Every other event
  # skips it, and the jobs below run on a skipped gate too. See .github/workflows/review-gate.yml.
  review-gate:
    if: >-
      github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
      (github.event.action == 'synchronize' && github.event.sender.login == 'claude[bot]')
    uses: ./.github/workflows/review-gate.yml
    permissions:
      actions: read
      pull-requests: read

  # Says what the change reaches, on a Linux runner, which starts at once: a macOS runner is waited
  # for, half an hour and more when several pull requests run, since only five macOS jobs run at
  # once. It answers three questions from the changed paths, each for a job below:
  #
  # - `kotlin`: whether it reaches the Kotlin code at all. A pull request that changes the Swift
  #   app alone (iosApp, with its Markdown docs and its release notes fragment) leaves every input
  #   of a Gradle task of the Apple targets as main built it.
  # - `tests`: whether apple-tests runs. Its suite is every module's commonTest, which jvm-tests
  #   and js-tests of build-and-test already run on two other targets, on Linux runners nobody
  #   waits for. What the macOS run adds is the code only an Apple target compiles, and how a
  #   library behaves there. So it runs on a pull request that changes one of these: an appleMain,
  #   iosMain or macosMain of a module under core/ or feature/; the version catalog (a library
  #   publishes its code for each target apart); gradle.properties, where the kotlin.native
  #   settings are; the build logic that sets up the Kotlin targets and their test tasks; what
  #   runs the job itself. A watchosMain starts nothing: no suite compiles it, and the schemes and
  #   "Compile the device targets" do. Neither do the Apple source sets of `:shared`, which has
  #   no tests and no tested module depending on it: the schemes compile and link it. Any other
  #   pull request leaves the suite to main's run, after the merge: in the 70 pull requests before
  #   this rule, apple-tests never failed on a commit whose build-and-test passed.
  # - `simulator`: whether the suite runs on the iOS simulator too. It is the macOS suite again,
  #   over the same appleMain, with one more test binary to link per module, so it only runs for
  #   what the two targets can take differently (an iosMain, the version catalog) and for what no
  #   other run would try: the build logic that sets up the test tasks, the simulators' among them,
  #   and this workflow, whose simulator steps main never runs.
  #
  # A diff that fails or lists no file counts as a change to all of it. On main this job is
  # skipped and the jobs read no answer: apple-tests runs there, on macOS, since that run also
  # stands for the pushes it replaced in the queue (see `concurrency` above), which its own diff
  # wouldn't list. It doesn't wait for the review gate, since it checks nothing: the answer is
  # ready when the gate lets the jobs ask for their runners.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kotlin: ${{ steps.diff.outputs.kotlin }}
      tests: ${{ steps.diff.outputs.tests }}
      simulator: ${{ steps.diff.outputs.simulator }}
      shards: ${{ steps.diff.outputs.shards }}
    steps:
      # Two commits: GitHub's merge of the pull request with main and main itself, its first parent.
      # Without their files: the diff below compares names, which the commits' trees hold, so no
      # file's content is downloaded and only this workflow is written to disk.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github/workflows/apple.yml
          sparse-checkout-cone-mode: false

      # Markdown is already left out of the paths that start this workflow. --no-renames lists both
      # paths of a moved file, so one moved out of a Kotlin module or an Apple source set still
      # counts, and without core.quotePath a name with an accent would come quoted and match
      # nothing.
      #
      # `shards` is the matrix of apple-tests, when it runs. A change under core/, to gradle/ (the
      # version catalog, the wrapper) or to gradle.properties reaches nearly every module as a rule,
      # and each one then links its test binary again: 18 to 21 minutes in one job. Two jobs share
      # those links. It is a guess from the paths, on the cheap side: a core module nothing depends
      # on splits for nothing, which costs a runner five minutes, and a change that reaches every
      # module from elsewhere runs in one job. build-logic and the root's Gradle scripts are left
      # out of the split: a change there gives a new key only to the tasks it configures differently
      # (docs/ci.md, "Speed and timeouts"). Of build-logic, only the files that set up the test tasks
      # run the tests, on the simulator too (the multiplatform convention plugin, the simulators'
      # files): the store screenshots' file there changes with every language, and the watchOS
      # convention plugin only adds targets no suite runs on, which the schemes and "Compile the
      # device targets" build.
      # The source sets no Apple target compiles and Markdown don't count, as they don't to start
      # this workflow. A change to this workflow, to the Gradle action or to the script that lists
      # the modules runs the tests, and the first and the last split them too, so a change to the
      # job is seen working before it merges, on the simulator as well when it is this workflow that
      # changes.
      - name: Look at what the change reaches
        id: diff
        run: |
          kotlin=true
          tests=true
          simulator=true
          shards='[1]'
          own='^\.github/workflows/apple\.yml$|^scripts/modules-with-tests\.sh$'
          apple='^(core|feature)/.*/src/(apple|ios|macos|native)[A-Za-z0-9]*/'
          apple="$apple|^gradle/libs\.versions\.toml$|^gradle\.properties$"
          logic='^build-logic/.*(Multiplatform|Simulator)[A-Za-z]*\.kt$'
          apple="$apple|$logic|^\.github/actions/gradle/action\.yml$|$own"
          ios='^(core|feature)/.*/src/ios[A-Za-z0-9]*/|^gradle/libs\.versions\.toml$'
          ios="$ios|$logic|^\.github/workflows/apple\.yml$"
          wide="^(core|gradle)/|^gradle\.properties$|$own"
          not_apple='\.md$|/src/(js|jvm)(Main|Test)/|/src/androidMain/'
          if files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD) &&
            [ -n "$files" ]; then
            simulator=false
            if ! grep -q -v -E '^(iosApp|release-notes)/|\.md$' <<< "$files"; then
              kotlin=false
              tests=false
            elif ! grep -q -E "$apple" <<< "$files"; then
              tests=false
            else
              if grep -q -E "$ios" <<< "$files"; then
                simulator=true
              fi
              if grep -v -E "$not_apple" <<< "$files" | grep -q -E "$wide"; then
                shards='[1, 2]'
              fi
            fi
          fi
          {
            echo "kotlin=$kotlin"
            echo "tests=$tests"
            echo "simulator=$simulator"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"

  # The tests, when they run, and the app's two builds run side by side: each compiles the
  # Kotlin/Native code on its own, and runners side by side finish sooner than one doing it all.
  # apple-tests runs unless `changes` said the pull request changes no Apple code (see its `tests`):
  # when that job fails or is skipped (on main), its output is empty and the tests run, in one job.
  # `changes` asks for two on a pull request whose change reaches nearly every module (see its
  # `shards`); main never does, since no pull request waits for its run and a second job there
  # would be one more runner the pull requests don't get.
  apple-tests:
    needs: [review-gate, changes]
    if: >-
      ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' &&
      needs.changes.outputs.tests != 'false' }}
    strategy:
      # One shard's failure doesn't hide the other modules' results.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards || '[1]') }}
    # The Xcode 27 image (a public preview): the app uses the iOS 27 SDK's APIs, and macos-26 has
    # Xcode 26 only.
    runs-on: xcode-27
    # A hung simulator or build would otherwise hold one of the few macOS runners for six hours. The
    # bound that fits each run is on "Run the tests", which knows whether the simulator runs: this
    # one only stops what hangs around it, with room for the caches restored before the longest test
    # run and saved after it.
    timeout-minutes: 100
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Gradle
        id: gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          kotlin-native: 'true'

      # The actuals of appleMain live in a few modules with few tests of their own; the tests that
      # exercise them are the other modules', so every module's suite runs, on macOS. The iOS
      # simulator runs the same commonTest over the same appleMain actuals (iosMain and macosMain
      # differ in a couple of one-line files no test reaches), and each module links one more test
      # binary for it: the links of both targets were half of this job. On main, where it ran on
      # every push, a week of its failures were all the simulator's own (CoreSimulator crashing, no
      # device listed), none a test. So the simulator's suite runs when `changes` asks for it, never
      # on main.
      #
      # main, in its one job, also builds what the pull requests' apple-app jobs read from the two
      # entries this job alone saves, the Gradle home and ~/.konan. It links Shared for the iOS
      # simulator, as apple-app (iOS) does: the link compiles every module's main code for it, and
      # each library to native code on its first link (klib/cache), which the simulator's test
      # binaries did here before. Without a simulator link in this job, a bumped library's native
      # code would be compiled again by every apple-app (iOS) and kept by none. And it runs the
      # compilations of apple-app (macOS)'s "Compile the device targets". A pull request leaves
      # them to those jobs.
      #
      # A pull request whose `changes` gave no answer (the job failed) runs the simulator's suite
      # too, as a diff that fails does: only its "false" leaves it out.
      #
      # One job of a pull request runs every suite by its task name. Two split the modules that
      # have a commonTest, dealt in turn from the sorted list js-tests deals its own from
      # (scripts/modules-with-tests.sh), so a new module joins a shard by itself. Each one compiles
      # for macOS the modules its own depend on. That leaves out a module with no tests that no
      # tested module depends on, `:shared` today, which the one job's macosArm64Test compiled:
      # apple-app's macOS build compiles and links it, and compiling it here would compile every
      # module it depends on, all of them, in this shard too.
      - name: Pick this shard's tasks
        id: tasks
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          SIMULATOR: ${{ needs.changes.outputs.simulator }}
        run: |
          simulator=''
          if [ "$SIMULATOR" != false ]; then
            simulator=iosSimulatorArm64Test
          fi
          if [ "$EVENT_NAME" != pull_request ]; then
            tasks='macosArm64Test :shared:linkDebugFrameworkIosSimulatorArm64'
            tasks="$tasks compileKotlinIosArm64 compileKotlinWatchosArm64 compileAppleMainKotlinMetadata"
          elif [ "$SHARD_TOTAL" -eq 1 ]; then
            tasks="${simulator:+$simulator }macosArm64Test"
          else
            modules=$(./scripts/modules-with-tests.sh commonTest)
            tasks=$(awk -v shard="$SHARD_INDEX" -v total="$SHARD_TOTAL" -v simulator="$simulator" '
              (NR - 1) % total == shard {
                gsub("/", ":")
                printf ":%s:macosArm64Test ", $0
                if (simulator != "") printf ":%s:%s ", $0, simulator
              }' <<< "$modules")
            if [ -z "$tasks" ]; then
              echo "::error::No module with tests falls on shard $((SHARD_INDEX + 1)) of $SHARD_TOTAL."
              exit 1
            fi
          fi
          echo "$tasks" | tr ' ' '\n'
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

      # Recompiling everything took 22 minutes on macOS alone and up to 48 with the simulator too,
      # in one job: 60 minutes for the first and 80 for the second. main takes the 80 as well: its
      # job also links Shared for the simulator and compiles the device targets, and a run this
      # bound kills saves no cache for the next one to start from. "finished" says Gradle ended on
      # its own, with failed tests or without: a run this step's timeout killed may have left a
      # library half compiled in ~/.konan, which main must not save.
      - name: Run the tests
        id: tests
        timeout-minutes: ${{ (github.event_name == 'push' || needs.changes.outputs.simulator != 'false') && 80 || 60 }}
        env:
          TASKS: ${{ steps.tasks.outputs.tasks }}
        run: |
          status=0
          read -ra tasks <<< "$TASKS"
          ./gradlew "${tasks[@]}" --continue || status=$?
          echo "finished=true" >> "$GITHUB_OUTPUT"
          exit "$status"

      # main also links the watchOS Shared for the device (arm64_32) and the simulator, and packs the
      # two into the XCFramework. No pull request links the device slice: apple-app (iOS) links the
      # simulator's into the Apple Watch app, and apple-app (macOS) only compiles the device's. Its
      # first, cold run compiles every module for two more targets; the bound leaves room for that.
      - name: Build the watchOS framework
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 60
        run: ./gradlew :shared:assembleSharedDebugXCFramework

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-test-reports-${{ matrix.shard }}
          path: '**/build/reports/tests/**'

      # main saves the Kotlin/Native entry the Gradle action restored, and only this job, which
      # compiles every Apple target. Its key has a fingerprint of the libraries compiled to native code
      # in it (the folders of klib/cache), so it is saved again when a link compiled a library's new
      # version, and only then: with the Kotlin version alone as the key it was saved once, and every
      # run compiled the libraries bumped since. The fingerprint is compared with the newest entry's,
      # looked up now rather than the one restored when the job started: a run that ended meanwhile
      # may have saved these libraries already, and a second copy would take half a gigabyte of the
      # repository's cache. A failed test doesn't stop the save, since the libraries were compiled
      # all the same; a run the timeout killed does. An entry keeps the versions bumped away until a
      # new Kotlin version starts an empty one.
      - name: Look up the newest Kotlin/Native entry
        id: newest
        if: ${{ !cancelled() && steps.tests.outputs.finished == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ steps.gradle.outputs.konan-key }}
          restore-keys: |
            ${{ steps.gradle.outputs.konan-key }}
          lookup-only: true

      # The key ends with the run, so an entry saved now is always a new one and the newest, the one
      # every job restores: with the fingerprint alone, a run that started from a newer entry holding
      # less (one saved after a restore that found nothing) and compiled its way back to an older
      # entry's libraries could save nothing, that key being taken.
      - name: Fingerprint the Kotlin/Native libraries
        id: konan
        if: ${{ !cancelled() && steps.tests.outputs.finished == 'true' && github.ref == 'refs/heads/main' }}
        env:
          KEY_PREFIX: ${{ steps.gradle.outputs.konan-key }}
          NEWEST_KEY: ${{ steps.newest.outputs.cache-matched-key }}
        run: |
          if [ -n "$KEY_PREFIX" ] && ls -d ~/.konan/kotlin-native-prebuilt-*/klib/cache > /dev/null 2>&1; then
            libraries=$(find ~/.konan/kotlin-native-prebuilt-*/klib/cache -mindepth 3 -maxdepth 3 -type d |
              sort | shasum -a 256 | cut -c1-16)
            case "$NEWEST_KEY" in
              "$KEY_PREFIX$libraries"*) echo "The newest entry already holds these libraries." ;;
              *) echo "key=$KEY_PREFIX$libraries-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Save the Kotlin/Native toolchain
        if: ${{ !cancelled() && steps.konan.outputs.key != '' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.key }}

  # One job per scheme, side by side. Each scheme's build phase builds the Shared framework with
  # Gradle first, which links it again for its target (close to four minutes, even with two modules
  # to compile and the rest from the cache), then compiles the Swift app. In one job the two builds
  # ran one after the other, 14 to 16 minutes that were the last check of nearly every pull request
  # to end. `changes` is only read by "Compile the device targets": the schemes are built whatever
  # it says, and when it fails or is skipped (on main).
  apple-app:
    needs: [review-gate, changes]
    if: ${{ !cancelled() && needs.review-gate.outputs.proceed != 'false' }}
    # The Xcode 27 image (a public preview): the app uses the iOS 27 SDK's APIs, and macos-26 has
    # Xcode 26 only.
    runs-on: xcode-27
    # A hung build would otherwise hold one of the few macOS runners for six hours. The macOS job
    # gets longer: it also compiles the device targets after its scheme, which has a bound of its
    # own.
    timeout-minutes: ${{ matrix.platform == 'macOS' && 60 || 40 }}
    strategy:
      # One scheme's failure doesn't hide the other's.
      fail-fast: false
      # No pull request waits for main's run, so there the schemes take turns on one runner and
      # leave another to the pull requests: with apple-tests, this workflow's run of main holds two
      # of the five macOS runners at most.
      max-parallel: ${{ github.event_name == 'push' && 1 || 2 }}
      # The jobs are apple-app (iOS) and apple-app (macOS). Only the platform is in the matrix: a
      # name written from it would show unexpanded on a job the review gate skips.
      matrix:
        platform: [iOS, macOS]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Gradle
        uses: ./.github/actions/gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          kotlin-native: 'true'
          # apple-tests saves the Gradle cache of the macOS runner.
          cache-read-only: 'true'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: ./iosApp/generate-project.sh

      # The Swift packages (Firebase and its dependencies) only change with project.yml, and both
      # schemes resolve the same ones. As with the other caches, only main saves them, and only the
      # iOS job: one save is enough. When the macOS job runs before it after a change to project.yml,
      # it finds no entry and resolves the packages from the network, once.
      - name: Cache the Swift packages
        if: github.ref == 'refs/heads/main' && matrix.platform == 'iOS'
        uses: actions/cache@v6
        with:
          path: iosApp/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/project.yml') }}

      - name: Restore the Swift packages
        if: github.ref != 'refs/heads/main' || matrix.platform != 'iOS'
        uses: actions/cache/restore@v6
        with:
          path: iosApp/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/project.yml') }}

      # The iOS build targets the Apple silicon simulator only, since Shared has no x86_64 simulator
      # slice. It builds the Apple Watch app too, which the iPhone app embeds, for the watchOS
      # simulator, linking the watchOS Shared. Signing is skipped: Sign in with Apple and the associated domains need a provisioning
      # profile, on the macOS app even to sign ad hoc.
      - name: Build the app
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            iOS) target=(-destination 'generic/platform=iOS Simulator' ARCHS=arm64) ;;
            macOS) target=(-destination 'platform=macOS') ;;
          esac
          xcodebuild -project iosApp/BoraRachar.xcodeproj -scheme "BoraRachar-$PLATFORM" "${target[@]}" \
            -derivedDataPath iosApp/build/DerivedData -clonedSourcePackagesDirPath iosApp/build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO build -quiet

      # The device targets, which no scheme builds here: iosArm64, watchosArm64 (the watch's
      # arm64_32) and the appleMain shared by the Apple targets, which only a macOS host compiles.
      # They are compiled, not linked: a link is minutes per framework, and what the device slices
      # can take differently from the simulator's (a 32-bit pointer, a platform library's API) is
      # found by compiling. main links the watchOS ones in apple-tests. It runs after the macOS
      # scheme, the shorter of the two builds, rather than on a runner of its own: with the
      # watchOS framework linked in a job apart, a pull request held all five macOS runners. On a
      # pull request only (main compiles them in apple-tests, which saves the Gradle home this job
      # reads them from), and not on one that changes the Swift app alone. After a scheme that
      # failed too: a Swift error would otherwise hide a device target's until the next push, one
      # more round of every macOS job.
      - name: Compile the device targets
        if: >-
          ${{ !cancelled() && matrix.platform == 'macOS' && github.event_name == 'pull_request' &&
          needs.changes.outputs.kotlin != 'false' }}
        timeout-minutes: 30
        run: ./gradlew compileKotlinIosArm64 compileKotlinWatchosArm64 compileAppleMainKotlinMetadata

  # On main, a failed apple-tests leaves no Gradle home in the cache. setup-gradle saves the home when
  # the job ends, whatever its result, under a key that ends with the commit, and every later run
  # restores the newest entry. A run that lost the network restored nothing, found no plugin to
  # configure the build with, and saved an empty home: the next run of main restored it and compiled
  # its 1905 tasks, 40 minutes instead of 4, and so did the pull requests opened meanwhile. Without
  # that entry they restore the one of the last run that passed. A run whose tests failed loses a
  # good entry the same way, which costs the next run that commit's own changes. A job of its own,
  # so the entry goes as soon as apple-tests ends, not once apple-app has built both schemes too.
  # always(), not !cancelled(): a run someone cancels saves the home it had got to as well, and
  # this job has to outlive that cancellation to delete it.
  drop-failed-cache:
    needs: apple-tests
    if: >-
      ${{ always() && github.event_name == 'push' &&
      (needs.apple-tests.result == 'failure' || needs.apple-tests.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # setup-gradle's key is gradle-home-<version>|<os>|<job>[<hash>]-<commit>. The newest entries
      # come first, and this run's is among them: a hundred are ten commits of every job's. The entry
      # was saved seconds ago and the list may not show it yet, so an empty answer is asked for
      # again, and one that stays empty is a warning: the entry may still be there to restore.
      - name: Delete the Gradle home the failed run saved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ids=''
          for attempt in 1 2 3; do
            ids=$(gh cache list --ref "$GITHUB_REF" --key gradle-home- --sort created_at --order desc \
              --limit 100 --json id,key | jq -r --arg sha "$GITHUB_SHA" '.[]
              | select((.key | contains("|apple-tests[")) and (.key | endswith("-" + $sha))) | .id')
            if [ -n "$ids" ] || [ "$attempt" -eq 3 ]; then
              break
            fi
            sleep 20
          done
          if [ -z "$ids" ]; then
            echo "::warning::The cache lists no Gradle home of this run's apple-tests. If the run saved one, it is still the newest: see \"Speed and timeouts\" in docs/ci.md."
          fi
          for id in $ids; do
            gh cache delete "$id"
          done

  # main has no pull request to show a failure on, and a test that fails on an Apple target alone
  # first fails there, after the merge, since a pull request runs the suite on macOS only when it
  # changes Apple code. So a job that failed or timed out on main opens an issue, assigned to
  # whoever merged, or comments on the one still open. The commit it names is the one this run
  # checked out: what broke may be any push since the last run of main that completed, the ones this
  # run replaced in the queue included (see `concurrency` above), so the issue links those commits.
  # A run someone cancelled reports nothing, and neither does one replaced in the queue.
  report-failure:
    needs: [apple-tests, apple-app]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To look up the run before this one.
      actions: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: The apple checks failed on main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTS: ${{ needs.apple-tests.result }}
          APP: ${{ needs.apple-app.result }}
          ACTOR: ${{ github.actor }}
        # The commits to look at start after the last run of main that passed or failed: a run
        # replaced in the queue was cancelled, and so was one someone stopped, which leaves a longer
        # range, never a shorter one. With no answer the issue names this run's commit alone.
        # The list of issues, not the search: the search index lags, and two failures in a row
        # would open two.
        run: |
          previous=$(gh api "repos/$GH_REPO/actions/workflows/apple.yml/runs?branch=main&event=push&status=completed&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].head_sha // empty" || true)
          commits=''
          # Only a commit id: on an error, gh prints GitHub's answer where the id would be.
          if [[ "$previous" =~ ^[0-9a-f]{40}$ ]] && [ "$previous" != "$GITHUB_SHA" ]; then
            commits=" The run also stands for the pushes it replaced in the queue, so what broke is in [the commits since the last run that completed]($GITHUB_SERVER_URL/$GH_REPO/compare/$previous...$GITHUB_SHA)."
          fi
          body=$(printf '%s\n\n%s\n' \
            "[This run]($RUN_URL) of \`apple\` failed on \`main\` at $GITHUB_SHA: \`apple-tests\` $TESTS, \`apple-app\` $APP.$commits" \
            "A pull request runs the Kotlin tests on macOS only when it changes Apple code, so a test that fails on an Apple target alone first fails here, and the pull request that fixes it may not run them. The failed job's log names the task: on \`main\`, \`apple-tests\` runs every module's \`macosArm64Test\`, links \`Shared\` for the iOS simulator, compiles the device targets and builds the watchOS XCFramework. Run that task on the Mac, \`./scripts/heavy-check.sh ./gradlew :<module>:macosArm64Test\` for a test. See \"Speed and timeouts\" in docs/ci.md.")
          issue=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body" --assignee "$ACTOR" ||
              gh issue create --title "$TITLE" --body "$body"
          fi
