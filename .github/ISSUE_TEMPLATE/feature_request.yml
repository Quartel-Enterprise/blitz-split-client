name: Feature request
description: An idea to make the app better.
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Please search the existing issues first, in case someone asked for it already.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I split a dinner where someone only had drinks, I have to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How would you like the app to help? Sketches and examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: dropdown
    id: platforms
    attributes:
      label: Platform
      description: Where would you use it?
      multiple: true
      options:
        - Android
        - iPhone
        - iPad
        - Mac
        - Web
