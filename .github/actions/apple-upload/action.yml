name: 'Send an Apple build to TestFlight'
description: 'Uploads an exported IPA or package to App Store Connect with the API key.'

inputs:
  type:
    description: 'altool platform type: ios or macos'
    required: true
  file:
    description: 'The IPA or package to upload (a glob is fine)'
    required: true
  key-id:
    description: 'The App Store Connect API key id'
    required: true
  key-issuer-id:
    description: 'The App Store Connect API issuer id'
    required: true
  key-p8:
    description: 'The text of the API key (.p8)'
    required: true

runs:
  using: composite
  steps:
    - name: Upload to App Store Connect
      shell: bash
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.key-id }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ inputs.key-issuer-id }}
        APP_STORE_CONNECT_API_KEY_P8: ${{ inputs.key-p8 }}
      run: |
        for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
          if [ -z "${!name}" ]; then
            echo "::error::The $name secret is empty. See docs/release-process.md#secrets."
            exit 1
          fi
        done
        key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
        trap 'rm -f "$key_path"' EXIT
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_path"
        xcrun altool --upload-app --type "${{ inputs.type }}" --file ${{ inputs.file }} \
          --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
