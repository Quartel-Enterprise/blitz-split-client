name: 'Build and deploy the web app'
description: >-
  Builds the web app at a version and deploys it to a Cloudflare Pages project: the beta's (release-beta.yml) or the
  production one, served at web.blitzsplit.com (release-production.yml), which differ only in these inputs. The
  calling job checks out the repository first, since the steps run its scripts.

inputs:
  version:
    description: 'The versionName the web app shows, a beta suffix too'
    required: true
  version-code:
    description: 'The versionCode'
    required: true
  sha:
    description: 'The commit the release builds, which the deployment is recorded with'
    required: true
  pages-project:
    description: "The Cloudflare Pages project's name"
    required: true
  url:
    description: 'Where people open what was deployed, for the run summary'
    required: true
  cloudflare-api-token:
    description: 'A token with Account > Cloudflare Pages > Edit'
    required: true
  cloudflare-account-id:
    description: "The Cloudflare account's id"
    required: true
  firebase-api-key:
    description: "The web app's Firebase config (the VITE_FIREBASE_API_KEY variable)"
    required: false
    default: ''
  firebase-app-id:
    description: 'The VITE_FIREBASE_APP_ID variable'
    required: false
    default: ''
  firebase-project-id:
    description: 'The VITE_FIREBASE_PROJECT_ID variable'
    required: false
    default: ''
  firebase-measurement-id:
    description: 'The VITE_FIREBASE_MEASUREMENT_ID variable'
    required: false
    default: ''
  vapid-public-key:
    description: "The public half of the server's VAPID pair (the VITE_VAPID_PUBLIC_KEY variable)"
    required: false
    default: ''
  sentry-dsn:
    description: "The Sentry project's DSN (the VITE_SENTRY_DSN variable); empty, the web app reports no crash"
    required: false
    default: ''
  sentry-environment:
    description: "The environment the reports are filed under in Sentry: beta or production"
    required: false
    default: 'production'
  sentry-auth-token:
    description: 'A Sentry organization token, for the source maps; empty, none is made nor uploaded'
    required: false
    default: ''
  sentry-org:
    description: "The Sentry organization's slug (the SENTRY_ORG variable)"
    required: false
    default: ''
  sentry-project:
    description: "The Sentry project's slug (the SENTRY_PROJECT variable)"
    required: false
    default: ''
  cache-encryption-key:
    description: 'Passed to the Gradle action'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Before the build, which takes minutes: a missing secret, a token Cloudflare refuses, a project nobody created
    # yet and one that would only take a preview each stop here with what to do, where wrangler would say the
    # deployment failed, or nothing at all. A Pages project is created once, by hand
    # (docs/release-process.md#the-production-web-app): the workflow never makes one.
    - name: Check the secrets and the Pages project
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PAGES_PROJECT: ${{ inputs.pages-project }}
        URL: ${{ inputs.url }}
      run: '"$GITHUB_ACTION_PATH/check-the-secrets-and-the-pages-project.sh"'

    # The web app shows the versionName of version.properties. Through env, not spliced into the command: the script
    # validates the values, but only after the shell has parsed the line.
    - name: Bump version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        VERSION_CODE: ${{ inputs.version-code }}
      run: ./scripts/release/bump-version.sh "$VERSION" "$VERSION_CODE"

    - name: Setup Gradle and Java
      uses: ./.github/actions/gradle
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        # Dispatched on main, where the action would save the cache: a release must not push out the entries the
        # pull requests read.
        cache-read-only: 'true'

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: webApp/package-lock.json

    # webApp depends on the JS library of :shared through a file: dependency, so the library is built before npm
    # installs it.
    - name: Build the shared JS library
      shell: bash
      run: npm --prefix webApp run shared

    - name: Install the web dependencies
      shell: bash
      run: npm --prefix webApp ci

    # Cloudflare Pages answers an unknown path with index.html when the site has no 404.html, which is what
    # /g/<code> and /n?... need. The database runs in a worker on OPFS's opfs-sahpool, so no COOP/COEP headers are
    # needed either. --ignore-scripts skips the prebuild hook, which would build the shared JS library a second time.
    - name: Build the web app
      shell: bash
      env:
        VITE_FIREBASE_API_KEY: ${{ inputs.firebase-api-key }}
        VITE_FIREBASE_APP_ID: ${{ inputs.firebase-app-id }}
        VITE_FIREBASE_PROJECT_ID: ${{ inputs.firebase-project-id }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ inputs.firebase-measurement-id }}
        VITE_VAPID_PUBLIC_KEY: ${{ inputs.vapid-public-key }}
        VITE_SENTRY_DSN: ${{ inputs.sentry-dsn }}
        VITE_SENTRY_ENVIRONMENT: ${{ inputs.sentry-environment }}
        # vite.config.ts makes the source maps when this is true. The token itself stays out of the build.
        WEB_SOURCE_MAPS: ${{ inputs.sentry-auth-token != '' }}
      run: npm --prefix webApp run build --ignore-scripts

    # Sentry reads a report's stack with the source maps of the build it came from, matched by the debug id that
    # inject writes into each file and its map, so this runs before the deploy. Only on assets, what Vite bundled:
    # the files copied from public (the push service worker) have no map and stay as they are. A failed upload only warns: the
    # reports still arrive, with the minified stack. The maps never go to Pages, uploaded or not.
    - name: Upload the source maps to Sentry
      if: inputs.sentry-auth-token != ''
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
        SENTRY_ORG: ${{ inputs.sentry-org }}
        SENTRY_PROJECT: ${{ inputs.sentry-project }}
        VERSION: ${{ inputs.version }}
        # Pinned: the version the releases were written with.
        SENTRY_CLI_VERSION: 3.8.2
      run: '"$GITHUB_ACTION_PATH/upload-the-source-maps-to-sentry.sh"'

    # To the project's production branch, main, so the deployment is the one its domains serve. The tree is dirty
    # with the version bump above; --commit-dirty keeps wrangler from warning about it.
    - name: Deploy to Cloudflare Pages
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        PAGES_PROJECT: ${{ inputs.pages-project }}
        VERSION: ${{ inputs.version }}
        SHA: ${{ inputs.sha }}
        URL: ${{ inputs.url }}
        # Pinned: the version the releases were written with.
        WRANGLER_VERSION: 4.152.0
      run: '"$GITHUB_ACTION_PATH/deploy-to-cloudflare-pages.sh"'
