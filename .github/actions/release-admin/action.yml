name: 'Check that an admin releases or sends a listing'
description: >-
  Fails unless whoever started this attempt of the run is an administrator of the repository. Nothing waits for an
  approval in release-production.yml, store-listing.yml nor app-store-screenshots.yml, so every one of their jobs
  starts with this: "Re-run failed jobs" runs jobs again without the first one. The calling job checks out the
  repository first.

inputs:
  token:
    description: 'A token that can read the repository, the GITHUB_TOKEN of the job'
    required: true

runs:
  using: composite
  steps:
    # A permission that can't be read stops the job as one that isn't enough does. What gh says on stderr is kept
    # apart: a notice it prints with a good answer must not be read as part of the permission.
    - name: Check who releases
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ACTOR: ${{ github.triggering_actor }}
      run: |
        errors="$RUNNER_TEMP/release-admin-errors.txt"
        if ! permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission 2> "$errors")"; then
          cat "$errors"
          if grep -q "HTTP 404" "$errors"; then
            echo "::error::Only an administrator of the repository releases a stable version or sends a listing to a store, and $ACTOR is not a user GitHub knows on it (an app or a bot can't). See docs/release-process.md#who-releases."
          else
            echo "::error::Could not read $ACTOR's permission on the repository, so nothing says they may. Run it again."
          fi
          exit 1
        fi
        if [ "$permission" != admin ]; then
          echo "::error::Only an administrator of the repository releases a stable version or sends a listing to a store, and $ACTOR has the '$permission' permission. See docs/release-process.md#who-releases."
          exit 1
        fi
