name: 'Setup Gradle and Java'
description: 'Sets up JDK 25 and Gradle with caching'

inputs:
  cache-encryption-key:
    description: >-
      Secret used to encrypt the Gradle configuration cache before storing it. Without it the
      configuration cache is discarded between runs, so every job pays full configuration time.
    required: false
    default: ''
  cache-read-only:
    description: >-
      'true' for a job whose Gradle cache another job of the same runner already saves: it only reads
      main's entries, even on main, so two copies don't take room in the repository's cache.
    required: false
    default: 'false'
  kotlin-native:
    description: >-
      'true' for a job that compiles Kotlin/Native: restores the Kotlin/Native toolchain (~/.konan)
      and fits the Gradle and Kotlin daemons to a macOS runner.
    required: false
    default: 'false'

outputs:
  konan-key:
    description: >-
      With kotlin-native: the prefix of the keys of the Kotlin/Native entry (~/.konan), for the job
      that saves it to finish with a fingerprint of what the entry holds.
    value: ${{ steps.kotlin.outputs.konan-key }}
  konan-restored-key:
    description: 'With kotlin-native: the key of the entry that was restored, empty when there was none.'
    value: ${{ steps.konan.outputs.cache-matched-key }}

runs:
  using: "composite"
  steps:
    # The Gradle daemon's toolchain (gradle/gradle-daemon-jvm.properties).
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    # setup-gradle's defaults: only main writes the cache, and every pull request reads main's
    # entries.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        cache-read-only: ${{ inputs.cache-read-only == 'true' || github.ref != 'refs/heads/main' }}

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew

    # A hosted macOS runner has 3 cores and 7 GB of memory, less than gradle.properties' 8 GB Gradle
    # heap and 4 GB Kotlin daemon. Kotlin/Native compiles and links inside the Gradle daemon, so it
    # gets most of the memory, and two workers keep two links at most in that heap at once. The
    # Kotlin daemon only compiles the JVM code of the build here. ~/.gradle/gradle.properties wins
    # over the project's, and the Gradle run of Xcode's build phase reads it too. It replaces the
    # whole jvmargs line, so the project's other flags are repeated.
    - name: Fit Gradle to the runner
      if: inputs.kotlin-native == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        mkdir -p ~/.gradle
        {
          echo 'org.gradle.jvmargs=-Xmx4608M -Dfile.encoding=UTF-8'
          echo 'kotlin.daemon.jvmargs=-Xmx1024M'
          echo 'org.gradle.workers.max=2'
        } >> ~/.gradle/gradle.properties

    # The image's default Xcode can lag behind the newest it has installed (27.1 against 27.2 on
    # xcode-27), and the Apple app uses the newest SDK's APIs under @available, as the Mac it is
    # developed on builds it with the newest release.
    - name: Select the newest Xcode
      if: inputs.kotlin-native == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)
        sudo xcode-select -s "$xcode"
        xcodebuild -version

    # ~/.konan holds the toolchain, which changes with the Kotlin version and the runner, and the
    # native code Kotlin/Native compiles each library to on its first link (klib/cache), which changes
    # with the libraries' versions. So an entry's key ends with a fingerprint of the libraries it
    # holds, and every job restores the newest one of its Kotlin version, whatever its fingerprint.
    # Nothing is saved here, since a composite action has no step that runs when the job ends: the
    # job that compiles every Apple target saves it (apple-tests, on main). As with Gradle's cache, an
    # entry a pull request saves would be readable by that branch alone, and a gigabyte each would
    # push main's entries out of the repository's cache.
    - name: Read the Kotlin version
      id: kotlin
      if: inputs.kotlin-native == 'true'
      shell: bash
      run: |
        version=$(sed -nE 's/^kotlin = "(.*)"$/\1/p' gradle/libs.versions.toml)
        if [ -z "$version" ]; then
          echo "::error::No kotlin = \"...\" line in gradle/libs.versions.toml, so the Kotlin/Native cache has no key."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # The fixed word after the version keeps 2.5.0 from matching an entry of 2.5.0-RC.
        echo "konan-key=konan-$RUNNER_OS-$RUNNER_ARCH-$version-libraries-" >> "$GITHUB_OUTPUT"

    # No entry has the bare prefix as its key, so it is always a restore key that matches. The second
    # one is the entry saved before the keys had a fingerprint, so the first runs after that change
    # don't start from nothing: drop it once Kotlin moves on from 2.4.21.
    - name: Restore the Kotlin/Native toolchain
      id: konan
      if: inputs.kotlin-native == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.konan
        key: ${{ steps.kotlin.outputs.konan-key }}
        restore-keys: |
          ${{ steps.kotlin.outputs.konan-key }}
          konan-macOS-ARM64-2.4.21
