[versions]
# Build tooling (kept in step with the Bible Planner, which already builds with this set)
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
buildkonfig = "0.23.0"
# Read by scripts/ktlint.sh: the ruleset, its runner and the ktlint CLI all come from this release
# (github.com/Quartel-Enterprise/ktlint-rules)
quare-ktlint-rules = "1.0.2"
jraska-modules-graph-assert = "2.9.1"
kover = "0.9.11"

# Android SDK levels
android-minSdk = "26"
android-compileSdk = "37"
android-targetSdk = "37"

# AndroidX
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-credentials = "1.6.0"
androidx-lifecycle = "2.11.0"
navigation3 = "1.2.0"
room = "3.0.3"
sqlite = "2.7.1"

# KotlinX
kotlinx-coroutines = "1.11.0"
kotlinx-browser = "0.5.0"
kotlinx-serialization = "1.11.0"

# Compose: only the Android app draws with Compose, so it takes the AndroidX artifacts straight
# from their BOM.
androidx-compose-bom = "2026.09.00"
# The BOM pins the stable 1.4.0, which lacks the Material 3 Expressive APIs (MaterialExpressiveTheme,
# MaterialShapes); they ship on the 1.5 pre-releases only.
androidx-compose-material3 = "1.5.0-beta01"
androidx-graphics-shapes = "1.1.0"

# Third party
googleid = "1.2.1"
play-services-code-scanner = "16.1.0"
kermit = "2.2.0"
koin = "4.2.2"
ktor = "3.6.0"
quare-connectivity = "1.0.0"
quare-loadable = "1.0.0"
supabase = "3.9.0-beta-1"

[libraries]
# Gradle plugins consumed as libraries (build-logic)
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-playServicesAuth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
# The shared ViewModels (KMP: Android, Apple, JS) take JetBrains' multiplatform lifecycle; the
# Android UI takes the AndroidX artifacts it maps to.
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelNavigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "androidx-graphics-shapes" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "play-services-code-scanner" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

# Navigation 3
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# Room (KMP)
androidx-room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-web = { module = "androidx.sqlite:sqlite-web", version.ref = "sqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }

# KotlinX
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Compose (Android UI only)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-material3" }
compose-materialIconsExtended = { module = "androidx.compose.material:material-icons-extended" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }

# Koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel" }
koin-test = { module = "io.insert-koin:koin-test" }

# Ktor (HTTP engines of the Supabase client)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# Supabase
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-functions = { module = "io.github.jan-tennert.supabase:functions-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }

# Quare
quare-connectivity = { module = "software.quare:connectivity", version.ref = "quare-connectivity" }
quare-loadable = { module = "software.quare:loadable", version.ref = "quare-loadable" }
# Unused by Gradle; it lets Dependabot / Renovate propose new releases of the ktlint ruleset
quare-ktlint-rules = { module = "software.quare:ktlint-rules", version.ref = "quare-ktlint-rules" }

# Observability
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidx-room = { id = "androidx.room3", version.ref = "room" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jraska-module-graph-assertion = { id = "com.jraska.module.graph.assertion", version.ref = "jraska-modules-graph-assert" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
blitzsplit-kotlin-multiplatform = { id = "blitzsplit.kotlin.multiplatform" }
blitzsplit-android-compose = { id = "blitzsplit.android.compose" }
