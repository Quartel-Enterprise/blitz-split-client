# XcodeGen spec of the Apple app (iOS, iPadOS and macOS). Generate the project with
# ./iosApp/generate-project.sh, which reads the app version from ../version.properties.
name: BoraRachar

options:
  bundleIdPrefix: com.quare
  # English is the source language and the fallback of every language but Portuguese (pt-BR), Spanish (es, es-ES) and French (fr)
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    # Liquid Glass (glassEffect, the glass tab bar and sheets) starts at iOS 26 and macOS 26
    iOS: "26.0"
    macOS: "26.0"

# Crashlytics and Analytics (docs/crash-reporting.md, docs/analytics/README.md): the app starts Firebase only when
# Resources/GoogleService-Info.plist is there
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.1.1

settings:
  base:
    PRODUCT_NAME: BoraRachar
    PRODUCT_MODULE_NAME: BoraRachar
    # The legacy Blitz Split app's id and team: this app replaces it in the stores
    PRODUCT_BUNDLE_IDENTIFIER: com.quare.blitzsplit
    DEVELOPMENT_TEAM: TTV2A365LG
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: ${BLITZSPLIT_VERSION_NAME}
    CURRENT_PROJECT_VERSION: ${BLITZSPLIT_VERSION_CODE}
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # The Gradle task below runs outside the sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Shared is a static framework, so it is linked and never embedded. Room's sqlite-framework
    # driver comes along with the bundled one and needs the system SQLite at link time. -ObjC keeps
    # Firebase's Objective-C categories, as its setup asks.
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS: [-framework, Shared, -lsqlite3, -ObjC]
    # Xcode extracts the Swift UI literals into Resources/Localizable.xcstrings (English source, pt-BR, es, es-ES and fr)
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: YES
    # "Bora Rachar" only in Portuguese (Blitz Split in Spanish and French too): Resources/InfoPlist.xcstrings localizes the name
    INFOPLIST_KEY_CFBundleDisplayName: Blitz Split
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    INFOPLIST_KEY_NSCameraUsageDescription: To scan the QR code of an invite or from your old device, and to take your profile photo and photos of bills.
    # A bill's viewer saves its photo through the share sheet's Save Image
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: To save a bill's photos to your library.
    # Invite from contacts reads the agenda only on the device: no number leaves it
    INFOPLIST_KEY_NSContactsUsageDescription: To invite people from your contacts with a group's link. Their numbers stay on this device.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targetTemplates:
  BoraRachar:
    type: application
    sources:
      - path: Sources/Shared
      - path: Resources
    preBuildScripts:
      - name: Build the Shared framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping the Gradle build: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED is YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postCompileScripts:
      - name: Check the localized keys
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-localized-keys.py" "$OBJECT_FILE_DIR_normal"
      - name: Check the prominent labels
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-prominent-labels.py" "$SRCROOT/Sources"
      - name: Check the localized bundle
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-localized-bundle.py" "$SRCROOT/Sources"
      - name: Check the translations
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-translations.py" "$SRCROOT/Resources"
    postBuildScripts:
      # Xcode compiles es-ES.lproj with only the words Spain says differently, and an es-ES app would show English
      # for the rest: this fills each es-ES table with the neutral es one, Spain's keys winning, before signing
      - name: Fill the regional tables with their language's
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/merge-regional-strings.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
      # The last phase, as Crashlytics asks: a release build with the Firebase config uploads its dSYM, which holds
      # the Shared framework's symbols too, since it is linked in
      - name: Upload the dSYM to Crashlytics
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "$CONFIGURATION" != "Release" ] || [ ! -f "$SRCROOT/Resources/GoogleService-Info.plist" ]; then
            exit 0
          fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
      # Without FirebaseAnalyticsIdentitySupport, so no advertising id is ever collected
      - package: Firebase
        product: FirebaseAnalytics
    info:
      properties:
        # borarachar://auth-callback brings back the browser sign in (Google)
        CFBundleURLTypes:
          - CFBundleURLName: com.quare.blitzsplit.auth
            CFBundleURLSchemes: [borarachar]
        # Nothing is collected from the first launch on; FirebaseSetup turns it on, on every launch of a release build
        # (docs/analytics/README.md#consent)
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        # Each screen is tracked by the shared code from the back stack, never by UIKit's or AppKit's view controllers
        FirebaseAutomaticScreenReportingEnabled: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        # Profile's "Version 3.0.0-beta_7": the whole versionName, which CFBundleShortVersionString can't hold
        # (generate-project.sh)
        BlitzSplitVersionName: ${BLITZSPLIT_DISPLAY_VERSION}

targets:
  BoraRachar-iOS:
    templates: [BoraRachar]
    platform: iOS
    sources:
      - path: Sources/iOS
    info:
      path: Generated/iOS-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Generated/iOS.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # webcredentials lets the recovery code be saved to the Passwords app; applinks opens a
        # group's invite link, blitzsplit.com/g/<code>, in the app. Both need their entry in
        # https://blitzsplit.com/.well-known/apple-app-site-association, served by blitz-split-site
        # (webApp/public/.well-known keeps the same copy: change both)
        com.apple.developer.associated-domains: [webcredentials:blitzsplit.com, applinks:blitzsplit.com]
        # Atividade's push notifications. Xcode's automatic signing adds Push Notifications to the App ID, and an
        # export for the App Store turns it into production
        aps-environment: development

  BoraRachar-macOS:
    templates: [BoraRachar]
    platform: macOS
    sources:
      - path: Sources/macOS
    info:
      path: Generated/macOS-Info.plist
      properties:
        # Crashlytics on the Mac: an uncaught Objective-C exception crashes the app instead of being swallowed
        NSApplicationCrashOnExceptions: true
    entitlements:
      path: Generated/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        # A bill's photo chosen from a file, and Download's save panel
        com.apple.security.files.user-selected.read-write: true
        # Invite from contacts reads the Mac's Contacts
        com.apple.security.personal-information.addressbook: true
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: [webcredentials:blitzsplit.com, applinks:blitzsplit.com]
        com.apple.developer.aps-environment: development

schemes:
  BoraRachar-iOS:
    build:
      targets:
        BoraRachar-iOS: all
    run:
      config: Debug
  BoraRachar-macOS:
    build:
      targets:
        BoraRachar-macOS: all
    run:
      config: Debug
