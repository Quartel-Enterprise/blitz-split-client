# XcodeGen spec of the Apple app (iOS, iPadOS and macOS). Generate the project with
# ./iosApp/generate-project.sh, which reads the app version from ../version.properties.
name: BoraRachar

# The Apple Watch app inside the iPhone app: on CI and with --watch, never in a project generated for a simulator
# run on this Mac (generate-project.sh says why)
include:
  - path: watch-embed.yml
    enable: ${BLITZSPLIT_EMBED_WATCH}

options:
  bundleIdPrefix: com.quare
  # English is the source language (with Britain's, Australia's and Canada's en-GB, en-AU and en-CA holding the words
  # they spell differently) and the fallback of every language but Portuguese (pt-BR, pt-PT), Spanish (es, es-ES), French (fr),
  # German (de), Italian (it), Polish (pl), Dutch (nl), Japanese (ja), Turkish (tr), Indonesian (id), Russian (ru),
  # Ukrainian (uk), Korean (ko), Hindi (hi), Arabic (ar), Simplified Chinese (zh-Hans), Hebrew (he), Thai (th), Vietnamese (vi), Traditional Chinese (zh-Hant), Swedish
  # (sv), Czech (cs), Romanian (ro), Bengali (bn), Malay (ms), Greek (el), Croatian (hr), Hungarian (hu), Urdu (ur), Filipino (fil), Serbian (sr-Latn) and Slovak (sk), Persian (fa), Tamil (ta), Norwegian (nb), Telugu (te), Bulgarian (bg), Marathi (mr), Swahili (sw), Catalan (ca), Danish (da) and Finnish (fi)
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    # Liquid Glass (glassEffect, the glass tab bar and sheets) starts at iOS 26 and macOS 26
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"

# Crashlytics and Analytics (docs/crash-reporting.md, docs/analytics/README.md): the app starts Firebase only when
# Resources/GoogleService-Info.plist is there
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.2.0

settings:
  base:
    PRODUCT_NAME: BoraRachar
    PRODUCT_MODULE_NAME: BoraRachar
    # The legacy Blitz Split app's id and team: this app replaces it in the stores
    PRODUCT_BUNDLE_IDENTIFIER: com.quare.blitzsplit
    DEVELOPMENT_TEAM: TTV2A365LG
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: ${BLITZSPLIT_VERSION_NAME}
    CURRENT_PROJECT_VERSION: ${BLITZSPLIT_VERSION_CODE}
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # The Gradle task below runs outside the sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Shared is a static framework, so it is linked and never embedded. Room's sqlite-framework
    # driver comes along with the bundled one and needs the system SQLite at link time. -ObjC keeps
    # Firebase's Objective-C categories, as its setup asks.
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS: [-framework, Shared, -lsqlite3, -ObjC]
    # Xcode extracts the Swift UI literals into Resources/Localizable.xcstrings (English source, en-GB, en-AU, en-CA, pt-BR, pt-PT, es, es-ES, fr, de, it, pl, nl, ja, tr, id, ru, uk, ko, hi, ar, zh-Hans, he, th, vi, zh-Hant, sv, cs, ro, bn, ms, el, hr, hu, ur, fil, sr-Latn and sk, fa, ta, nb, te, bg, mr, sw, ca, da and fi)
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: YES
    # "Bora Rachar" only in Portuguese (Blitz Split in every other language): Resources/InfoPlist.xcstrings localizes the name
    INFOPLIST_KEY_CFBundleDisplayName: Blitz Split
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    INFOPLIST_KEY_NSCameraUsageDescription: To scan the QR code of an invite or from your old device, and to take your profile photo and photos of bills.
    # A bill's viewer saves its photo through the share sheet's Save Image
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: To save a bill's photos to your library.
    # Invite from contacts reads the agenda only on the device: no number leaves it
    INFOPLIST_KEY_NSContactsUsageDescription: To invite people from your contacts with a group's link. Their numbers stay on this device.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targetTemplates:
  BoraRachar:
    type: application
    sources:
      - path: Sources/Shared
      # What the app and its widget share: the color tokens, the locale's direction
      - path: Sources/Common
      - path: Resources
    preBuildScripts:
      - name: Build the Shared framework
        basedOnDependencyAnalysis: false
        # A project generated without the watch app (watch-embed.yml) builds an iPhone app that ships alone: fine on
        # a simulator, never for a release. Checked first, since Gradle links a release framework for minutes
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ "$BLITZSPLIT_EMBEDS_WATCH" != "YES" ]; then
            case "$PLATFORM_NAME" in
              iphone*)
                echo "error: this project was generated without the Apple Watch app, which a release ships inside the iPhone app. Generate it again: ./iosApp/generate-project.sh --watch"
                exit 1
                ;;
            esac
          fi
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping the Gradle build: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED is YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postCompileScripts:
      - name: Check the localized keys
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-localized-keys.py" "$OBJECT_FILE_DIR_normal"
      - name: Check the prominent labels
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-prominent-labels.py" "$SRCROOT/Sources"
      - name: Check the localized bundle
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-localized-bundle.py" "$SRCROOT/Sources"
      - name: Check the translations
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-translations.py" "$SRCROOT/Resources"
    postBuildScripts:
      # Xcode compiles es-ES.lproj, pt-PT.lproj, en-GB.lproj, en-AU.lproj and en-CA.lproj with only the words Spain,
      # Portugal, Britain, Australia and Canada say differently, and an es-ES or pt-PT app would show English for the
      # rest, an en-GB one only those words: this fills each table with its language's (es, pt-BR, en),
      # the keys the catalogs give the region winning, before signing
      - name: Fill the regional tables with their language's
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/merge-regional-strings.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" "$SRCROOT/Resources"
      # The last phase, as Crashlytics asks: a release build with the Firebase config uploads its dSYM, which holds
      # the Shared framework's symbols too, since it is linked in
      - name: Upload the dSYM to Crashlytics
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "$CONFIGURATION" != "Release" ] || [ ! -f "$SRCROOT/Resources/GoogleService-Info.plist" ]; then
            exit 0
          fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
      # The product without the advertising id: the plain FirebaseAnalytics links GoogleAppMeasurementIdentitySupport
      # and GoogleAdsOnDeviceConversion, and FirebaseAnalyticsCore leaves both out. The module the code imports is
      # still FirebaseAnalytics
      - package: Firebase
        product: FirebaseAnalyticsCore
    info:
      properties:
        # borarachar://auth-callback brings back the browser sign in (Google)
        CFBundleURLTypes:
          - CFBundleURLName: com.quare.blitzsplit.auth
            CFBundleURLSchemes: [borarachar]
        # Nothing is collected until the shared code read Profile's "Share usage data" and a release build turned it on
        # (docs/analytics/README.md#consent)
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        # Each screen is tracked by the shared code from the back stack, never by UIKit's or AppKit's view controllers
        FirebaseAutomaticScreenReportingEnabled: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        # Profile's "Version 3.0.0-beta_7": the whole versionName, which CFBundleShortVersionString can't hold
        # (generate-project.sh)
        BlitzSplitVersionName: ${BLITZSPLIT_DISPLAY_VERSION}

targets:
  BoraRachar-iOS:
    templates: [BoraRachar]
    platform: iOS
    sources:
      - path: Sources/iOS
      # The balance widget's file and faces: the app writes the file, and compiling the faces here extracts their
      # words into Localizable.xcstrings
      - path: Widgets/Shared
      # The widget's file from the shared code's snapshot, which the watch app writes too
      - path: Sources/WidgetSnapshot
    # The Apple Watch app the iPhone app ships with is one more dependency, which watch-embed.yml adds when
    # generate-project.sh includes it: without it, a build of this target links one Shared framework, not two
    dependencies:
      - target: BalanceWidget
        embed: true
        codeSign: true
    info:
      path: Generated/iOS-Info.plist
      properties:
        # An event's push carries content-available: iOS wakes the app to sync, so a tap finds the bill on the device
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Generated/iOS.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # webcredentials lets the recovery code be saved to the Passwords app; applinks opens a
        # group's invite link, blitzsplit.com/g/<code>, a comment's, blitzsplit.com/b/<bill>, a profile's,
        # blitzsplit.com/u/<code>, and a bill's, blitzsplit.com/c/<code>, in the app. Each needs its entry in
        # https://blitzsplit.com/.well-known/apple-app-site-association, served by blitz-split-site
        # (webApp/public/.well-known keeps the same copy: change both)
        com.apple.developer.associated-domains: [webcredentials:blitzsplit.com, applinks:blitzsplit.com]
        # Atividade's push notifications. Xcode's automatic signing adds Push Notifications to the App ID; the betas'
        # signing lane (fastlane/Fastfile) sets production
        aps-environment: development
        # The balance widget reads the file the app writes there (Widgets/Shared/WidgetBalances.swift)
        com.apple.security.application-groups: [group.com.quare.blitzsplit]

  # The iPhone's balance widget (board 15.8): the Home Screen's small and medium, the Lock Screen's circle and
  # rectangle. It reads only the file the app writes to the App Group, never Room nor the Shared framework. Its
  # accessory faces (Widgets/Shared) are what the watch's complications and Smart Stack card draw (BalanceWidget-watchOS).
  BalanceWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Shared
      - path: Widgets/Extension
      - path: Sources/Common
      # The faces' words, which the app's build extracts into the catalog
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: BalanceWidget
        PRODUCT_MODULE_NAME: BalanceWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.quare.blitzsplit.BalanceWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        # Only the app links the Shared framework and Firebase
        OTHER_LDFLAGS: []
        FRAMEWORK_SEARCH_PATHS: []
        # The app's build already extracts the faces' words; a second extraction would mark them twice
        SWIFT_EMIT_LOC_STRINGS: NO
        # WidgetKit calls the timeline provider off the main actor
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Blitz Split
    postBuildScripts:
      # As the app's: the widget draws in the app's language, es-ES, pt-PT and the English regions included, whose
      # tables hold only the words their region says differently until this fills them with es's, pt-BR's and en's
      - name: Fill the regional tables with their language's
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/merge-regional-strings.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" "$SRCROOT/Resources"
    info:
      path: Generated/BalanceWidget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/BalanceWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.quare.blitzsplit]

  # The Apple Watch app (canvas page 15, docs/product/watch.md): its own Supabase session, Room and sync once
  # connected, drawing the shared ViewModels of :feature:watch_pairing and :feature:watch_balances. Dark only. It links
  # the watchOS Shared framework (its arm64_32 device slice only: docs/architecture/stack.md#watchos) and compiles the
  # few app files it needs (amounts, times, the language), never the iPhone's screens.
  BoraRachar-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: Watch/App
      - path: Watch/Assets.xcassets
      - path: Sources/Common
      - path: Widgets/Shared
      - path: Sources/WidgetSnapshot
      - path: Sources/Shared/Bridge/WatchBag.swift
      - path: Sources/Shared/DesignSystem/ExpenseFormat.swift
      - path: Sources/Shared/DesignSystem/RightToLeft.swift
      - path: Sources/Shared/App/AppLocale.swift
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - target: BalanceWidget-watchOS
        embed: true
        codeSign: true
      # The shared code's crash reporting (crashkios) calls Crashlytics, so the watch links it; Firebase starts only
      # with a GoogleService-Info.plist, which the watch app has none of yet
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_NAME: BoraRachar
        PRODUCT_MODULE_NAME: BoraRacharWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.quare.blitzsplit.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        # Kotlin/Native builds Shared for arm64_32 only on the device (watchosDeviceArm64 waits for lifecycle-viewmodel
        # and supabase-kt), so the app leaves out the arm64 slice Xcode adds for Series 9 and later, which run arm64_32
        ARCHS[sdk=watchos*]: arm64_32
        # Shared has no x86_64 simulator slice either: Apple silicon simulators only
        ARCHS[sdk=watchsimulator*]: arm64
        OTHER_LDFLAGS: [-framework, Shared, -lsqlite3, -ObjC]
        INFOPLIST_KEY_CFBundleDisplayName: Blitz Split
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.quare.blitzsplit
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Build the Shared framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping the Gradle build: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED is YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postCompileScripts:
      - name: Check the localized keys
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-localized-keys.py" "$OBJECT_FILE_DIR_normal"
      - name: Check the prominent labels
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-prominent-labels.py" "$SRCROOT/Watch"
      - name: Check the localized bundle
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/check-localized-bundle.py" "$SRCROOT/Watch"
    postBuildScripts:
      - name: Fill the regional tables with their language's
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/merge-regional-strings.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" "$SRCROOT/Resources"
    info:
      path: Generated/watchOS-Info.plist
      properties:
        BlitzSplitVersionName: ${BLITZSPLIT_DISPLAY_VERSION}
    entitlements:
      path: Generated/watchOS.entitlements
      properties:
        # The watch's own pushes of Activity (15.7). Xcode's automatic signing adds Push Notifications to the App ID
        aps-environment: development
        # The complication and the Smart Stack card read the file the watch app writes there. A watch's App Group is
        # its own container: nothing is shared with the iPhone through it
        com.apple.security.application-groups: [group.com.quare.blitzsplit]

  # The watch's complications (15.2: the circle "+186" and the rectangle) and its Smart Stack card (15.1), the
  # iPhone widget's accessory faces (Widgets/Shared) over the file the watch app writes.
  BalanceWidget-watchOS:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widgets/Shared
      - path: Watch/Widget
      - path: Widgets/Extension/Assets.xcassets
      - path: Sources/Common
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: BalanceWidget
        PRODUCT_MODULE_NAME: BalanceWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.quare.blitzsplit.watchkitapp.BalanceWidget
        TARGETED_DEVICE_FAMILY: "4"
        OTHER_LDFLAGS: []
        FRAMEWORK_SEARCH_PATHS: []
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Blitz Split
    postBuildScripts:
      - name: Fill the regional tables with their language's
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 -I "$SRCROOT/merge-regional-strings.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" "$SRCROOT/Resources"
    info:
      path: Generated/BalanceWidget-watchOS-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/BalanceWidget-watchOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.quare.blitzsplit]

  # The App Store screenshots (docs/store-listing-screenshots.md): launches the debug app seeded with the sample trip
  # and captures each listing screen. Run by scripts/store-screenshots/capture-ios.sh, never by CI's build. The Mac
  # has no such target: a Mac's UI test runner is sandboxed, so capture-mac.sh launches the app and captures its
  # window itself.
  BoraRachar-iOS-StoreScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BoraRachar-iOS
    settings:
      base:
        PRODUCT_NAME: BoraRacharStoreScreenshots
        PRODUCT_MODULE_NAME: BoraRacharStoreScreenshots
        PRODUCT_BUNDLE_IDENTIFIER: com.quare.blitzsplit.storescreenshots
        TEST_TARGET_NAME: BoraRachar-iOS
        TARGETED_DEVICE_FAMILY: "1,2"
        # Only the app links the Shared framework
        OTHER_LDFLAGS: []
        FRAMEWORK_SEARCH_PATHS: []
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  BoraRachar-macOS:
    templates: [BoraRachar]
    platform: macOS
    sources:
      - path: Sources/macOS
    info:
      path: Generated/macOS-Info.plist
      properties:
        # Crashlytics on the Mac: an uncaught Objective-C exception crashes the app instead of being swallowed
        NSApplicationCrashOnExceptions: true
    entitlements:
      path: Generated/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        # A bill's photo chosen from a file, and Download's save panel
        com.apple.security.files.user-selected.read-write: true
        # Invite from contacts reads the Mac's Contacts
        com.apple.security.personal-information.addressbook: true
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: [webcredentials:blitzsplit.com, applinks:blitzsplit.com]
        com.apple.developer.aps-environment: development

schemes:
  BoraRachar-iOS:
    build:
      targets:
        BoraRachar-iOS: all
    run:
      config: Debug
  BoraRachar-macOS:
    build:
      targets:
        BoraRachar-macOS: all
    run:
      config: Debug
  BoraRachar-watchOS:
    build:
      targets:
        BoraRachar-watchOS: all
    run:
      config: Debug
  BoraRachar-iOS-StoreScreenshots:
    build:
      targets:
        BoraRachar-iOS: all
        BoraRachar-iOS-StoreScreenshots: [test]
    test:
      config: Debug
      targets:
        - BoraRachar-iOS-StoreScreenshots
