# Which stores list the phone app, read by Gradle (core/profile's StoreConfig) and the web's Vite config.
# "Get the app" (page 14), on the web on a computer and the Mac, only shows once a store lists it: the web names only
# the stores that have it, and the Mac, which only points to the App Store, waits for appStoreId.
#
# googlePlay: true once com.quare.blitzsplit is public on Google Play.
# appStoreId: the numeric Apple ID of the App Store listing (apps.apple.com/app/id<appStoreId>), empty until there is
# one. It also turns on Safari's Smart App Banner on the web.
googlePlay=true
appStoreId=
